name: Sync to Public Repository

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — sanitize but skip push'
        type: boolean
        default: false
      target_repo:
        description: 'Public repo (org/name)'
        type: string
        default: 'blediagolli/ocp-cluster-automation'

jobs:
  sanitize-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Load sanitize config
        run: |
          set -a
          source .github/sanitize.env
          set +a
          # Export for subsequent steps
          {
            echo "GIT_ORG=${GIT_ORG}"
            echo "UPSTREAM_ORG=${UPSTREAM_ORG}"
            echo "HUB_CLUSTER_DOMAIN=${HUB_CLUSTER_DOMAIN}"
            echo "DEV_BASE_DOMAIN=${DEV_BASE_DOMAIN}"
            echo "USER_EMAIL=${USER_EMAIL}"
            echo "HOSTED_ZONE_ID=${HOSTED_ZONE_ID}"
            echo "CLUSTER_ISSUER_NAME=${CLUSTER_ISSUER_NAME}"
            echo "HUB_STORAGE_CLASS=${HUB_STORAGE_CLASS}"
            echo "IMAGE_REGISTRY_BUCKET=${IMAGE_REGISTRY_BUCKET}"
          } >> "$GITHUB_ENV"

      - name: Run sanitization
        env:
          STACKROX_OIDC_SECRET: ${{ secrets.STACKROX_OIDC_SECRET }}
          QUAY_OIDC_SECRET: ${{ secrets.QUAY_OIDC_SECRET }}
          QUAY_BRIDGE_TOKEN: ${{ secrets.QUAY_BRIDGE_TOKEN }}
          QUAY_INIT_TOKEN: ${{ secrets.QUAY_INIT_TOKEN }}
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
          KEYCLOAK_USER_PASSWORD: ${{ secrets.KEYCLOAK_USER_PASSWORD }}
          OPENSHIFT_OIDC_SECRET: ${{ secrets.OPENSHIFT_OIDC_SECRET }}
        run: .github/scripts/sanitize.sh

      - name: Verify no secrets remain
        env:
          STACKROX_OIDC_SECRET: ${{ secrets.STACKROX_OIDC_SECRET }}
          QUAY_OIDC_SECRET: ${{ secrets.QUAY_OIDC_SECRET }}
          QUAY_BRIDGE_TOKEN: ${{ secrets.QUAY_BRIDGE_TOKEN }}
          QUAY_INIT_TOKEN: ${{ secrets.QUAY_INIT_TOKEN }}
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
          KEYCLOAK_USER_PASSWORD: ${{ secrets.KEYCLOAK_USER_PASSWORD }}
          OPENSHIFT_OIDC_SECRET: ${{ secrets.OPENSHIFT_OIDC_SECRET }}
        run: |
          echo "==> Checking for leaked secrets..."
          leaked=0

          check_leak() {
            local label="$1" value="$2"
            if [[ -z "$value" ]]; then return; fi
            if grep -rq "$value" --include='*.yaml' --include='*.yml' --include='*.md' --include='*.sh' .; then
              echo "LEAK DETECTED: $label still present in sanitized tree"
              leaked=1
            fi
          }

          check_leak "STACKROX_OIDC_SECRET"    "$STACKROX_OIDC_SECRET"
          check_leak "QUAY_OIDC_SECRET"         "$QUAY_OIDC_SECRET"
          check_leak "QUAY_BRIDGE_TOKEN"         "$QUAY_BRIDGE_TOKEN"
          check_leak "QUAY_INIT_TOKEN"           "$QUAY_INIT_TOKEN"
          check_leak "KEYCLOAK_ADMIN_PASSWORD"   "$KEYCLOAK_ADMIN_PASSWORD"
          check_leak "KEYCLOAK_USER_PASSWORD"    "$KEYCLOAK_USER_PASSWORD"
          check_leak "OPENSHIFT_OIDC_SECRET"     "$OPENSHIFT_OIDC_SECRET"

          source .github/sanitize.env
          check_leak "HUB_CLUSTER_DOMAIN"  "$HUB_CLUSTER_DOMAIN"
          check_leak "DEV_BASE_DOMAIN"     "$DEV_BASE_DOMAIN"
          check_leak "USER_EMAIL"          "$USER_EMAIL"
          check_leak "GIT_ORG (SSH)"       "git@github.com:${GIT_ORG}/"

          if [[ "$leaked" -eq 1 ]]; then
            echo "::error::Secret leak check failed — aborting push"
            exit 1
          fi
          echo "==> No leaks detected."

      - name: Determine target repository
        id: target
        run: |
          repo="${{ inputs.target_repo }}"
          if [[ -z "$repo" ]]; then
            repo="${{ vars.PUBLIC_REPO }}"
          fi
          if [[ -z "$repo" ]]; then
            echo "::error::No target repo. Set the PUBLIC_REPO repository variable or pass target_repo input."
            exit 1
          fi
          echo "repo=$repo" >> "$GITHUB_OUTPUT"

      - name: Push to public repository
        if: ${{ !inputs.dry_run }}
        env:
          DEPLOY_KEY: ${{ secrets.PUBLIC_REPO_DEPLOY_KEY }}
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_PAT }}
          TARGET_REPO: ${{ steps.target.outputs.repo }}
        run: |
          # Prefer deploy key; fall back to PAT
          if [[ -n "${DEPLOY_KEY:-}" ]]; then
            mkdir -p ~/.ssh
            echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            export GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"
            REMOTE_URL="git@github.com:${TARGET_REPO}.git"
          elif [[ -n "${GH_TOKEN:-}" ]]; then
            REMOTE_URL="https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPO}.git"
          else
            echo "::error::No auth configured. Set PUBLIC_REPO_DEPLOY_KEY or PUBLIC_REPO_PAT secret."
            exit 1
          fi

          # Remove the .github/sanitize.env and .github/scripts from the public copy
          rm -rf .github/

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Sync from private repository ($(date -u +%Y-%m-%dT%H:%M:%SZ))" --allow-empty

          git remote add public "$REMOTE_URL"
          git push public HEAD:main --force

          echo "==> Pushed to ${TARGET_REPO} (main)"

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        run: |
          echo "==> Dry run complete. Changes applied locally but not pushed."
          echo ""
          echo "Files remaining:"
          find . -path ./.git -prune -o -type f -print | sort | head -80
          echo ""
          echo "Checking for CHANGEME placeholders:"
          grep -rn 'CHANGEME_' --include='*.yaml' . | head -20 || echo "(none)"
          echo ""
          echo "Checking for YOUR_ placeholders:"
          grep -rn 'YOUR_' --include='*.yaml' --include='*.md' . | head -20 || echo "(none)"
