{{- if and .Values.pullSecret.include .Values.multiClusterObservability.include }}
apiVersion: batch/v1
kind: Job
metadata:
  name: observability-copy-pull-secret
  namespace: {{ .Values.multiClusterObservability.namespace }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 4
  template:
    spec:
      serviceAccountName: observability-setup
      restartPolicy: OnFailure
      containers:
        - name: copy-pull-secret
          image: {{ .Values.setupImage | default "registry.redhat.io/openshift4/ose-cli:latest" }}
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              TARGET_NS="{{ .Values.multiClusterObservability.namespace }}"
              SECRET_NAME="{{ .Values.pullSecret.secretName }}"
              SOURCE_NS="{{ .Values.pullSecret.sourceNamespace }}"
              SOURCE_SECRET="{{ .Values.pullSecret.sourceSecretName }}"

              echo "Copying pull secret from ${SOURCE_NS}/${SOURCE_SECRET} to ${TARGET_NS}/${SECRET_NAME}..."
              DOCKER_JSON=$(oc get secret "${SOURCE_SECRET}" -n "${SOURCE_NS}" -o jsonpath='{.data.\.dockerconfigjson}')

              cat <<EOSECRET | oc apply -f -
              apiVersion: v1
              kind: Secret
              metadata:
                name: ${SECRET_NAME}
                namespace: ${TARGET_NS}
              type: kubernetes.io/dockerconfigjson
              data:
                .dockerconfigjson: ${DOCKER_JSON}
              EOSECRET
              echo "Pull secret copied."
{{- end }}
