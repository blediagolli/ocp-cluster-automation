central:
  include: false
  name: stackrox-central-services
  namespace: stackrox
  persistence:
    claimName: central-db
    size: 100Gi
  db:
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2
        memory: 6Gi
  scanner:
    autoScaling:
      minReplicas: 2
      maxReplicas: 5
  scannerV4:
    indexer:
      minReplicas: 1
      maxReplicas: 2
    matcher:
      minReplicas: 1
      maxReplicas: 2
    db:
      claimName: scanner-v4-db
  initBundle:
    include: false
  consoleLink:
    include: false
    centralUrl: ""
centralNamespace:
  include: false
