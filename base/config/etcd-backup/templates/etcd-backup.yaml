{{- if .Values.etcdBackup.include }}
{{- if eq .Values.etcdBackup.storage.type "pvc" }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.etcdBackup.storage.pvc.name }}
  namespace: {{ .Values.etcdBackup.namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.etcdBackup.storage.pvc.storageClass }}
  storageClassName: {{ .Values.etcdBackup.storage.pvc.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.etcdBackup.storage.pvc.size }}
{{- end }}
{{- if eq .Values.etcdBackup.storage.type "obc" }}
---
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: {{ .Values.etcdBackup.storage.obc.name }}
  namespace: {{ .Values.etcdBackup.namespace }}
spec:
  storageClassName: {{ .Values.etcdBackup.storage.obc.storageClass }}
  generateBucketName: {{ .Values.etcdBackup.storage.obc.bucketPrefix }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: etcd-backup
  namespace: {{ .Values.etcdBackup.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: etcd-backup
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
{{- if eq .Values.etcdBackup.storage.type "obc" }}
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: etcd-backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: etcd-backup
subjects:
  - kind: ServiceAccount
    name: etcd-backup
    namespace: {{ .Values.etcdBackup.namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: etcd-backup-script
  namespace: {{ .Values.etcdBackup.namespace }}
data:
  backup.sh: |
    #!/bin/bash
    set -euo pipefail

    NAMESPACE="openshift-etcd"
    STORAGE_TYPE="{{ .Values.etcdBackup.storage.type }}"
    RETENTION={{ .Values.etcdBackup.retentionCount }}
    TIMESTAMP=$(date +%Y%m%d-%H%M%S)

    echo "=== etcd backup starting ==="
    echo "Storage: ${STORAGE_TYPE}"
    echo "Retention: ${RETENTION}"
    echo ""

    # --- Find an etcd pod to exec into ---
    ETCD_POD=$(oc get pods -n ${NAMESPACE} -l app=etcd \
      --field-selector=status.phase=Running \
      -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)

    if [ -z "${ETCD_POD}" ]; then
      echo "ERROR: No running etcd pod found in ${NAMESPACE}"
      exit 1
    fi
    echo "Using etcd pod: ${ETCD_POD}"

    ETCD_EP=$(oc exec -n ${NAMESPACE} ${ETCD_POD} -c etcd -- \
      printenv ETCDCTL_ENDPOINTS 2>/dev/null || echo "https://localhost:2379")
    ETCD_EP_SINGLE=$(echo "${ETCD_EP}" | cut -d',' -f1)

    run_etcdctl() {
      oc exec -n ${NAMESPACE} ${ETCD_POD} -c etcd -- \
        env -u ETCDCTL_ENDPOINTS etcdctl "$@"
    }

    # --- Pre-backup health check ---
    echo "--- Cluster health ---"
    if ! run_etcdctl --endpoints="${ETCD_EP}" endpoint health --cluster; then
      echo "ERROR: Cluster is not healthy. Aborting backup."
      exit 1
    fi
    echo ""

    # --- Take snapshot ---
    SNAPSHOT_PATH="/tmp/etcd-snapshot-$(date +%s).db"
    echo "Taking snapshot to ${SNAPSHOT_PATH} inside ${ETCD_POD}..."
    run_etcdctl --endpoints="${ETCD_EP_SINGLE}" snapshot save "${SNAPSHOT_PATH}"
    echo ""

    # --- Copy snapshot out of etcd pod ---
    LOCAL_SNAPSHOT="/tmp/snapshot.db"
    echo "Copying snapshot from etcd pod..."
    oc cp "${NAMESPACE}/${ETCD_POD}:${SNAPSHOT_PATH}" "${LOCAL_SNAPSHOT}" -c etcd

    SNAPSHOT_SIZE=$(stat -c %s "${LOCAL_SNAPSHOT}" 2>/dev/null || stat -f %z "${LOCAL_SNAPSHOT}" 2>/dev/null || echo "0")
    if [ "${SNAPSHOT_SIZE}" -eq 0 ]; then
      echo "ERROR: Snapshot file is empty"
      exit 1
    fi
    echo "Snapshot size: $(( SNAPSHOT_SIZE / 1024 / 1024 ))MB"

    # --- Clean up remote snapshot ---
    oc exec -n ${NAMESPACE} ${ETCD_POD} -c etcd -- rm -f "${SNAPSHOT_PATH}" 2>/dev/null || true

    # --- Generate metadata ---
    ETCD_VERSION=$(run_etcdctl --endpoints="${ETCD_EP_SINGLE}" version 2>/dev/null | head -1 || echo "unknown")
    MEMBER_COUNT=$(run_etcdctl --endpoints="${ETCD_EP_SINGLE}" member list -w simple 2>/dev/null | wc -l | tr -d ' ')

    cat > /tmp/metadata.txt <<METAEOF
    timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)
    etcd_pod: ${ETCD_POD}
    snapshot_size_bytes: ${SNAPSHOT_SIZE}
    etcd_version: ${ETCD_VERSION}
    cluster_members: ${MEMBER_COUNT}
    METAEOF

    {{- if eq .Values.etcdBackup.storage.type "pvc" }}
    # === PVC storage ===
    BACKUP_DIR=/backup/${TIMESTAMP}
    mkdir -p "${BACKUP_DIR}"
    mv "${LOCAL_SNAPSHOT}" "${BACKUP_DIR}/snapshot.db"
    mv /tmp/metadata.txt "${BACKUP_DIR}/metadata.txt"

    BACKUP_COUNT=$(ls -dt /backup/*/ 2>/dev/null | wc -l | tr -d ' ')
    if [ "${BACKUP_COUNT}" -gt "${RETENTION}" ]; then
      REMOVE_COUNT=$((BACKUP_COUNT - RETENTION))
      echo "Removing ${REMOVE_COUNT} old backup(s)..."
      ls -dt /backup/*/ | tail -n +$((RETENTION + 1)) | xargs rm -rf || true
    fi

    echo ""
    echo "=== etcd backup complete ==="
    echo "Backup: ${BACKUP_DIR}"
    echo "Backups on disk: $(ls -dt /backup/*/ 2>/dev/null | wc -l | tr -d ' ')/${RETENTION}"
    {{- end }}

    {{- if eq .Values.etcdBackup.storage.type "obc" }}
    # === Object Bucket storage ===
    OBC_NAME="{{ .Values.etcdBackup.storage.obc.name }}"
    OBC_NAMESPACE="{{ .Values.etcdBackup.namespace }}"

    # OBC creates a Secret and ConfigMap with the same name as the OBC
    AWS_ACCESS_KEY_ID=$(oc get secret "${OBC_NAME}" -n "${OBC_NAMESPACE}" -o jsonpath='{.data.AWS_ACCESS_KEY_ID}' | base64 -d)
    AWS_SECRET_ACCESS_KEY=$(oc get secret "${OBC_NAME}" -n "${OBC_NAMESPACE}" -o jsonpath='{.data.AWS_SECRET_ACCESS_KEY}' | base64 -d)
    BUCKET_NAME=$(oc get configmap "${OBC_NAME}" -n "${OBC_NAMESPACE}" -o jsonpath='{.data.BUCKET_NAME}')
    BUCKET_HOST=$(oc get configmap "${OBC_NAME}" -n "${OBC_NAMESPACE}" -o jsonpath='{.data.BUCKET_HOST}')
    BUCKET_PORT=$(oc get configmap "${OBC_NAME}" -n "${OBC_NAMESPACE}" -o jsonpath='{.data.BUCKET_PORT}')

    S3_ENDPOINT="https://${BUCKET_HOST}:${BUCKET_PORT}"
    echo "Bucket: ${BUCKET_NAME}"
    echo "Endpoint: ${S3_ENDPOINT}"
    echo ""

    # S3v4 signing helper using curl
    s3_request() {
      local method=$1
      local path=$2
      local file=${3:-}

      local date_iso=$(date -u +%Y%m%dT%H%M%SZ)
      local date_short=$(date -u +%Y%m%d)
      local region="us-east-1"
      local service="s3"
      local host="${BUCKET_HOST}:${BUCKET_PORT}"

      local content_hash="UNSIGNED-PAYLOAD"
      local content_type=""
      local content_length=""

      if [ -n "${file}" ] && [ "${method}" = "PUT" ]; then
        content_type="application/octet-stream"
        content_length=$(stat -c %s "${file}" 2>/dev/null || stat -f %z "${file}" 2>/dev/null)
      fi

      # Canonical headers
      local signed_headers="host;x-amz-content-sha256;x-amz-date"
      local canonical_headers="host:${host}\nx-amz-content-sha256:${content_hash}\nx-amz-date:${date_iso}\n"

      # Canonical request
      local canonical_request="${method}\n/${BUCKET_NAME}${path}\n\n${canonical_headers}\n${signed_headers}\n${content_hash}"
      local canonical_hash=$(printf "%s" "${canonical_request}" | openssl dgst -sha256 -hex 2>/dev/null | awk '{print $NF}')

      # String to sign
      local scope="${date_short}/${region}/${service}/aws4_request"
      local string_to_sign="AWS4-HMAC-SHA256\n${date_iso}\n${scope}\n${canonical_hash}"

      # Signing key
      local k_date=$(printf "%s" "${date_short}" | openssl dgst -sha256 -hex -hmac "AWS4${AWS_SECRET_ACCESS_KEY}" 2>/dev/null | awk '{print $NF}')
      local k_region=$(printf "%s" "${region}" | openssl dgst -sha256 -hex -mac HMAC -macopt hexkey:${k_date} 2>/dev/null | awk '{print $NF}')
      local k_service=$(printf "%s" "${service}" | openssl dgst -sha256 -hex -mac HMAC -macopt hexkey:${k_region} 2>/dev/null | awk '{print $NF}')
      local k_signing=$(printf "%s" "aws4_request" | openssl dgst -sha256 -hex -mac HMAC -macopt hexkey:${k_service} 2>/dev/null | awk '{print $NF}')

      local signature=$(printf "%b" "${string_to_sign}" | openssl dgst -sha256 -hex -mac HMAC -macopt hexkey:${k_signing} 2>/dev/null | awk '{print $NF}')

      local auth="AWS4-HMAC-SHA256 Credential=${AWS_ACCESS_KEY_ID}/${scope}, SignedHeaders=${signed_headers}, Signature=${signature}"

      local curl_args=(
        -s -S --fail-with-body
        -X "${method}"
        -H "Host: ${host}"
        -H "x-amz-date: ${date_iso}"
        -H "x-amz-content-sha256: ${content_hash}"
        -H "Authorization: ${auth}"
        --cacert /run/secrets/kubernetes.io/serviceaccount/ca.crt
        -k
      )

      if [ -n "${file}" ] && [ "${method}" = "PUT" ]; then
        curl_args+=(-H "Content-Type: ${content_type}" -H "Content-Length: ${content_length}" --data-binary "@${file}")
      fi

      curl "${curl_args[@]}" "${S3_ENDPOINT}/${BUCKET_NAME}${path}"
    }

    # Upload snapshot
    S3_KEY="etcd-backup/${TIMESTAMP}/snapshot.db"
    echo "Uploading snapshot to s3://${BUCKET_NAME}/${S3_KEY}..."
    s3_request PUT "/${S3_KEY}" "${LOCAL_SNAPSHOT}"
    echo "Upload complete"

    # Upload metadata
    S3_META_KEY="etcd-backup/${TIMESTAMP}/metadata.txt"
    echo "Uploading metadata to s3://${BUCKET_NAME}/${S3_META_KEY}..."
    s3_request PUT "/${S3_META_KEY}" /tmp/metadata.txt
    echo "Metadata uploaded"

    # --- Retention: list and remove old backups ---
    echo ""
    echo "Checking retention..."
    LISTING=$(s3_request GET "/?prefix=etcd-backup/&delimiter=/")

    PREFIXES=$(echo "${LISTING}" | grep -oP '(?<=<Prefix>)etcd-backup/[^<]+' | sort -r)
    BACKUP_COUNT=$(echo "${PREFIXES}" | grep -c . || true)
    echo "Backups in bucket: ${BACKUP_COUNT}/${RETENTION}"

    if [ "${BACKUP_COUNT}" -gt "${RETENTION}" ]; then
      TO_DELETE=$(echo "${PREFIXES}" | tail -n +$((RETENTION + 1)))
      for prefix in ${TO_DELETE}; do
        echo "Deleting old backup: ${prefix}..."
        OBJECTS=$(s3_request GET "/?prefix=${prefix}")
        KEYS=$(echo "${OBJECTS}" | grep -oP '(?<=<Key>)[^<]+')
        for key in ${KEYS}; do
          s3_request DELETE "/${key}" || true
        done
      done
    fi

    echo ""
    echo "=== etcd backup complete ==="
    echo "Backup: s3://${BUCKET_NAME}/etcd-backup/${TIMESTAMP}/"
    echo "Backups in bucket: $(echo "${PREFIXES}" | head -n ${RETENTION} | grep -c . || true)/${RETENTION}"
    {{- end }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-backup
  namespace: {{ .Values.etcdBackup.namespace }}
spec:
  schedule: {{ .Values.etcdBackup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      template:
        spec:
          serviceAccountName: etcd-backup
          restartPolicy: OnFailure
          hostNetwork: true
          tolerations:
            {{- toYaml .Values.etcdBackup.tolerations | nindent 12 }}
          nodeSelector:
            node-role.kubernetes.io/control-plane: ""
          containers:
            - name: etcd-backup
              image: {{ .Values.etcdBackup.image }}
              command:
                - /bin/bash
                - /scripts/backup.sh
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                {{- if eq .Values.etcdBackup.storage.type "pvc" }}
                - name: backup-storage
                  mountPath: /backup
                {{- end }}
          volumes:
            - name: scripts
              configMap:
                name: etcd-backup-script
                defaultMode: 0755
            {{- if eq .Values.etcdBackup.storage.type "pvc" }}
            - name: backup-storage
              persistentVolumeClaim:
                claimName: {{ .Values.etcdBackup.storage.pvc.name }}
            {{- end }}
{{- end }}
