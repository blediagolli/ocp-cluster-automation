etcdBackup:
  include: false
  namespace: openshift-etcd
  schedule: "0 */6 * * *"
  retentionCount: 7
  image: registry.redhat.io/openshift4/ose-cli:v4.22
  storage:
    type: pvc
    pvc:
      name: etcd-backup-pvc
      storageClass: ""
      size: 50Gi
    # s3:
    #   bucket: ""
    #   region: us-east-1
    #   endpoint: ""
    #   credentialSecretName: etcd-backup-s3-creds
  tolerations:
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
