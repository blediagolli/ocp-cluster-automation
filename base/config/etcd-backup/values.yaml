etcdBackup:
  include: false
  namespace: openshift-etcd
  schedule: "0 */6 * * *"
  retentionCount: 7
  # CLI image — only needs `oc` for exec/cp into etcd pods.
  # Compatible across OCP 4.19-4.22.
  image: registry.redhat.io/openshift4/ose-cli:latest
  storage:
    type: pvc
    pvc:
      name: etcd-backup-pvc
      storageClass: ""
      size: 50Gi
  tolerations:
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
