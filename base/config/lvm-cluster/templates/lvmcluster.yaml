{{- if .Values.lvmCluster.include }}
apiVersion: lvm.topolvm.io/v1alpha1
kind: LVMCluster
metadata:
  name: {{ .Values.lvmCluster.name }}
  namespace: {{ .Values.lvmCluster.namespace }}
spec:
  storage:
    deviceClasses:
      - name: {{ .Values.lvmCluster.deviceClassName }}
        default: {{ .Values.lvmCluster.default }}
        fstype: {{ .Values.lvmCluster.fsType }}
        thinPoolConfig:
          name: {{ .Values.lvmCluster.thinPool.name }}
          sizePercent: {{ .Values.lvmCluster.thinPool.sizePercent }}
          overprovisionRatio: {{ .Values.lvmCluster.thinPool.overprovisionRatio }}
          chunkSizeCalculationPolicy: Static
          metadataSizeCalculationPolicy: Host
{{- end }}
