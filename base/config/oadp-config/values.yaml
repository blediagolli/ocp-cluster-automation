oadp:
  include: false
  namespace: openshift-adp

  # ---------------------------------------------------------------------------
  # Velero configuration
  # ---------------------------------------------------------------------------
  velero:
    defaultPlugins:
      - openshift
      - csi
    # Available plugins: aws, gcs, azure, openshift, csi, kubevirt
    customPlugins: []
    # - name: custom-plugin
    #   image: quay.io/example/velero-plugin:latest
    featureFlags: []
    # - EnableCSI
    resources:
      requests:
        cpu: 500m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi

  # ---------------------------------------------------------------------------
  # Node agent (Restic/Kopia for file-system backups)
  # ---------------------------------------------------------------------------
  nodeAgent:
    enable: false
    uploaderType: kopia
    # Options: restic, kopia
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
    tolerations: []
    # - key: node-role.kubernetes.io/infra
    #   operator: Exists
    #   effect: NoSchedule
    nodeSelector: {}

  # ---------------------------------------------------------------------------
  # Backup storage locations
  # ---------------------------------------------------------------------------
  backupLocations: []
  # - name: default
  #   provider: aws
  #   default: true
  #   bucket: my-backup-bucket
  #   prefix: velero
  #   region: us-east-1
  #   credentialName: cloud-credentials
  #   credentialKey: cloud
  #   config: {}
  #   # s3ForcePathStyle: "true"
  #   # s3Url: "https://s3.example.com"

  # ---------------------------------------------------------------------------
  # Volume snapshot locations
  # ---------------------------------------------------------------------------
  snapshotLocations: []
  # - name: default
  #   provider: aws
  #   region: us-east-1
  #   config: {}
