{{- if .Values.image.include }}
apiVersion: config.openshift.io/v1
kind: Image
metadata:
  name: cluster
spec:
  {{- if .Values.image.additionalTrustedCA.name }}
  additionalTrustedCA:
    name: {{ .Values.image.additionalTrustedCA.name }}
  {{- end }}
  registrySources:
    {{- if .Values.image.allowedRegistries }}
    allowedRegistries:
      {{- toYaml .Values.image.allowedRegistries | nindent 6 }}
    {{- end }}
    {{- if .Values.image.blockedRegistries }}
    blockedRegistries:
      {{- toYaml .Values.image.blockedRegistries | nindent 6 }}
    {{- end }}
    {{- if .Values.image.registrySources.insecureRegistries }}
    insecureRegistries:
      {{- toYaml .Values.image.registrySources.insecureRegistries | nindent 6 }}
    {{- end }}
    {{- if .Values.image.registrySources.containerRuntimeSearchRegistries }}
    containerRuntimeSearchRegistries:
      {{- toYaml .Values.image.registrySources.containerRuntimeSearchRegistries | nindent 6 }}
    {{- end }}
{{- end }}
