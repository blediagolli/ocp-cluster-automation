{{- if .Values.scheduler.include }}
apiVersion: config.openshift.io/v1
kind: Scheduler
metadata:
  name: cluster
spec:
  profile: {{ .Values.scheduler.profile }}
  {{- if .Values.scheduler.customProfiles }}
  profileCustomizations:
    {{- range .Values.scheduler.customProfiles }}
    - schedulerName: {{ .name }}
      {{- if .pluginConfig }}
      pluginConfig:
        {{- toYaml .pluginConfig | nindent 8 }}
      {{- end }}
      {{- if .plugins }}
      plugins:
        {{- toYaml .plugins | nindent 8 }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
