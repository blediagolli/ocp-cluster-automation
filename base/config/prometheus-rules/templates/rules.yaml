{{- if .Values.prometheusRules.include }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: custom-cluster-alerts
  namespace: {{ .Values.prometheusRules.namespace }}
spec:
  groups:
  {{- if .Values.prometheusRules.etcd.include }}
  - name: etcd.custom.rules
    rules:
      - alert: EtcdHighCommitDurations
        expr: histogram_quantile(0.99, rate(etcd_disk_backend_commit_duration_seconds_bucket[5m])) > {{ .Values.prometheusRules.etcd.highCommitDuration }}
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: etcd commit durations are high
          description: etcd 99th percentile commit duration is above {{ .Values.prometheusRules.etcd.highCommitDuration }}s
      - alert: EtcdHighFsyncDurations
        expr: histogram_quantile(0.99, rate(etcd_disk_wal_fsync_duration_seconds_bucket[5m])) > {{ .Values.prometheusRules.etcd.highFsyncDuration }}
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: etcd fsync durations are high
          description: etcd 99th percentile WAL fsync duration is above {{ .Values.prometheusRules.etcd.highFsyncDuration }}s
      - alert: EtcdMemberCommunicationSlow
        expr: histogram_quantile(0.99, rate(etcd_network_peer_round_trip_time_seconds_bucket[5m])) > {{ .Values.prometheusRules.etcd.memberCommunicationSlow }}
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: etcd member communication is slow
          description: etcd 99th percentile peer RTT is above {{ .Values.prometheusRules.etcd.memberCommunicationSlow }}s
  {{- end }}
  {{- if .Values.prometheusRules.apiServer.include }}
  - name: apiserver.custom.rules
    rules:
      - alert: APIServerErrorRateHigh
        expr: sum(rate(apiserver_request_total{code=~"5.."}[5m])) / sum(rate(apiserver_request_total[5m])) > {{ .Values.prometheusRules.apiServer.errorRateThreshold }}
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: API server error rate is high
          description: API server 5xx error rate exceeds {{ .Values.prometheusRules.apiServer.errorRateThreshold }}
      - alert: APIServerLatencyHigh
        expr: histogram_quantile(0.99, sum(rate(apiserver_request_duration_seconds_bucket{verb!="WATCH"}[5m])) by (le, resource)) > {{ .Values.prometheusRules.apiServer.latencyThreshold }}
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: API server latency is high
          description: API server 99th percentile request latency exceeds {{ .Values.prometheusRules.apiServer.latencyThreshold }}s
  {{- end }}
  {{- if .Values.prometheusRules.kubelet.include }}
  - name: kubelet.custom.rules
    rules:
      - alert: KubeletRuntimeErrors
        expr: rate(kubelet_runtime_operations_errors_total[5m]) > {{ .Values.prometheusRules.kubelet.runtimeErrorRate }}
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Kubelet runtime errors on {{ "{{" }} $labels.node {{ "}}" }}"
          description: Kubelet runtime error rate exceeds threshold
      - alert: KubeletPodStartupLatency
        expr: histogram_quantile(0.99, rate(kubelet_pod_worker_duration_seconds_bucket[5m])) > {{ .Values.prometheusRules.kubelet.podStartupLatency }}
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Pod startup latency high on {{ "{{" }} $labels.node {{ "}}" }}"
          description: 99th percentile pod startup latency exceeds {{ .Values.prometheusRules.kubelet.podStartupLatency }}s
  {{- end }}
  {{- if .Values.prometheusRules.node.include }}
  - name: node.custom.rules
    rules:
      - alert: NodeHighCPU
        expr: (1 - avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) * 100 > {{ .Values.prometheusRules.node.cpuThreshold }}
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "High CPU on {{ "{{" }} $labels.instance {{ "}}" }}"
          description: "CPU usage above {{ .Values.prometheusRules.node.cpuThreshold }}%"
      - alert: NodeHighMemory
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > {{ .Values.prometheusRules.node.memoryThreshold }}
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "High memory on {{ "{{" }} $labels.instance {{ "}}" }}"
          description: "Memory usage above {{ .Values.prometheusRules.node.memoryThreshold }}%"
      - alert: NodeDiskRunningFull
        expr: (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 > {{ .Values.prometheusRules.node.diskThreshold }}
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Disk running full on {{ "{{" }} $labels.instance {{ "}}" }}"
          description: "Root disk usage above {{ .Values.prometheusRules.node.diskThreshold }}%"
      - alert: NodeDiskWillFillIn7Days
        expr: predict_linear(node_filesystem_avail_bytes{mountpoint="/"}[6h], {{ mul .Values.prometheusRules.node.diskPredictionDays 86400 }}) < 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Disk predicted to fill in {{ .Values.prometheusRules.node.diskPredictionDays }} days on {{ "{{" }} $labels.instance {{ "}}" }}"
  {{- end }}
  {{- if .Values.prometheusRules.pvc.include }}
  - name: pvc.custom.rules
    rules:
      - alert: PVCUsageHigh
        expr: (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) * 100 > {{ .Values.prometheusRules.pvc.usageThreshold }}
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "PVC {{ "{{" }} $labels.persistentvolumeclaim {{ "}}" }} in {{ "{{" }} $labels.namespace {{ "}}" }} usage high"
          description: "PVC usage above {{ .Values.prometheusRules.pvc.usageThreshold }}%"
  {{- end }}
  {{- if .Values.prometheusRules.pod.include }}
  - name: pod.custom.rules
    rules:
      - alert: PodCrashLooping
        expr: increase(kube_pod_container_status_restarts_total[1h]) > {{ .Values.prometheusRules.pod.restartThreshold }}
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ "{{" }} $labels.pod {{ "}}" }} in {{ "{{" }} $labels.namespace {{ "}}" }} is crash looping"
          description: "Pod restarted more than {{ .Values.prometheusRules.pod.restartThreshold }} times in the last hour"
      - alert: PodOOMKilled
        expr: increase(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[1h]) > {{ .Values.prometheusRules.pod.oomKillThreshold }}
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ "{{" }} $labels.pod {{ "}}" }} in {{ "{{" }} $labels.namespace {{ "}}" }} OOMKilled"
  {{- end }}
  {{- if .Values.prometheusRules.cluster.include }}
  - name: cluster.custom.rules
    rules:
      - alert: NodeNotReady
        expr: kube_node_status_condition{condition="Ready",status="true"} == 0
        for: {{ .Values.prometheusRules.cluster.nodeNotReadyMinutes }}m
        labels:
          severity: critical
        annotations:
          summary: "Node {{ "{{" }} $labels.node {{ "}}" }} is not ready"
      - alert: ClockSkewDetected
        expr: abs(node_timex_offset_seconds) > {{ .Values.prometheusRules.cluster.clockSkewSeconds }}
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Clock skew detected on {{ "{{" }} $labels.instance {{ "}}" }}"
  {{- end }}
{{- end }}
