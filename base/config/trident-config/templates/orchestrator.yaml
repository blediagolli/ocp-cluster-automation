{{- if .Values.tridentOrchestrator.include }}
apiVersion: trident.netapp.io/v1
kind: TridentOrchestrator
metadata:
  name: {{ .Values.tridentOrchestrator.name }}
spec:
  IPv6: false
  debug: {{ .Values.tridentOrchestrator.debug }}
  namespace: {{ .Values.tridentOrchestrator.namespace }}
  silenceAutosupport: false
{{- end }}
