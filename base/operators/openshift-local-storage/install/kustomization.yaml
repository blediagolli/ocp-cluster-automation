apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No instance CR: LocalVolume / LocalVolumeSet are node-topology specific and
# belong in a cluster-specific overlay, not the shared base.
resources:
  - namespace.yaml
  - operatorgroup.yaml
  - subscription.yaml

labels:
  - includeSelectors: false
    pairs:
      operator: openshift-local-storage
