# EXAMPLE — not wired into any kustomization.
#
# Starting point for shared RBAC across operator namespaces, e.g. an aggregated
# ClusterRole that grants a platform team read access to every operator's
# resources. Add to `resources:` in base/kustomization.yaml once you need it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: multi-cluster-config-viewer
  labels:
    rbac.authorization.k8s.io/aggregate-to-view: "true"
rules:
  - apiGroups: ["operators.coreos.com"]
    resources: ["subscriptions", "clusterserviceversions", "installplans", "operatorgroups"]
    verbs: ["get", "list", "watch"]
