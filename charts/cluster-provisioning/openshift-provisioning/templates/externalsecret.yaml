{{- /* BMC credentials (shared default) */}}
{{- if and .Values.provision.include (eq (include "cluster.isAgent" .) "true") ($es.bmcCreds).path }}
{{- $platformCfg := index .Values .Values.cluster.platform }}
{{- range $platformCfg.hosts }}
{{- if not (and .bmcUsername .bmcPassword) }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}-bmc-credentials
  namespace: {{ $.Values.cluster.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  refreshInterval: {{ $es.refreshInterval }}
