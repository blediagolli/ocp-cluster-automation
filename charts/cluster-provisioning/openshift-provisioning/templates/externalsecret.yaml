{{- $es := .Values.externalSecrets -}}
{{- if $es.enabled -}}

{{- /* Pull secret */}}
{{- if and .Values.provision.include ($es.pullSecret).path }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.cluster.name }}-pull-secret
  namespace: {{ .Values.cluster.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    name: {{ $es.secretStoreRef.name }}
    kind: {{ $es.secretStoreRef.kind }}
  target:
    name: {{ .Values.cluster.name }}-pull-secret
    template:
      type: kubernetes.io/dockerconfigjson
  data:
    {{- range $es.pullSecret.properties }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ $es.pullSecret.path }}
        property: {{ .property }}
    {{- end }}
---
{{- end }}

{{- /* AWS credentials */}}
{{- if and .Values.provision.include (eq .Values.cluster.platform "aws") ($es.awsCreds).path }}
