{{- if and .Values.provision.include (eq .Values.cluster.platform "aws") .Values.aws.accessKeyID }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.cluster.name }}-aws-creds
  namespace: {{ .Values.cluster.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
type: Opaque
stringData:
  aws_access_key_id: {{ .Values.aws.accessKeyID }}
  aws_secret_access_key: {{ .Values.aws.secretAccessKey }}
{{- end }}
