{{- if and .Values.provision.include (eq .Values.cluster.platform "aws") }}
{{- $secrets := .Values.secrets | default dict }}
{{- $s := $secrets.awsCreds | default dict }}
{{- $source := $s.source | default $secrets.source }}
{{- $cname := .Values.cluster.name }}
{{- if eq $source "externalSecret" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $cname }}-aws-creds
  namespace: {{ $cname }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: {{ $s.refreshInterval | default $secrets.refreshInterval }}
  secretStoreRef:
    {{- toYaml ($s.secretStoreRef | default $secrets.secretStoreRef) | nindent 4 }}
  target:
    name: {{ $cname }}-aws-creds
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
  data:
    {{- range $s.properties }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ required "secrets.awsCreds.path is required when source is externalSecret" $s.path }}
        property: {{ .property | default .secretKey }}
    {{- end }}
{{- else if eq $source "inline" }}
{{- /* Absent rather than an error when there is nothing to write: an AWS IPI
       cluster using the installer's own credentials has no accessKeyID. */}}
{{- if .Values.aws.accessKeyID }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $cname }}-aws-creds
  namespace: {{ $cname }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
type: Opaque
stringData:
  aws_access_key_id: {{ .Values.aws.accessKeyID | quote }}
  aws_secret_access_key: {{ required "aws.secretAccessKey is required alongside aws.accessKeyID" .Values.aws.secretAccessKey | quote }}
{{- end }}
{{- else if ne $source "existing" }}
{{- fail (printf "secrets.awsCreds.source: expected existing, externalSecret or inline — got %q" $source) }}
{{- end }}
{{- end }}
