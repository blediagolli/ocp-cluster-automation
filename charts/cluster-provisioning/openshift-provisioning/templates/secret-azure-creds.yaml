{{- if and .Values.provision.include (eq .Values.cluster.platform "azure") }}
{{- $secrets := .Values.secrets | default dict }}
{{- $s := $secrets.azureCreds | default dict }}
{{- $source := $s.source | default $secrets.source }}
{{- $cname := .Values.cluster.name }}
{{- /* One key, osServicePrincipal.json, for the same reason as gcp-creds:
       it is the only name Hive looks for. Store the service principal as a
       single JSON document in the backend and map it through as one
       property -- not as four, one per field. Four discrete keys read
       correctly into the Secret and then Hive finds nothing it recognises,
       which surfaces as an authentication failure rather than as a missing
       key. The four fields the document must carry are subscriptionId,
       tenantId, clientId and clientSecret; see
       docs/cluster-provisioning/azure.md for how to produce it. */}}
{{- if eq $source "externalSecret" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $cname }}-azure-creds
  namespace: {{ $cname }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: {{ $s.refreshInterval | default $secrets.refreshInterval }}
  secretStoreRef:
    {{- toYaml ($s.secretStoreRef | default $secrets.secretStoreRef) | nindent 4 }}
  target:
    name: {{ $cname }}-azure-creds
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
  data:
    {{- range $s.properties }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ required "secrets.azureCreds.path is required when source is externalSecret" $s.path }}
        property: {{ .property | default .secretKey }}
    {{- end }}
{{- else if eq $source "inline" }}
{{- /* Absent rather than an error when there is nothing to write, as with
       aws-creds and gcp-creds: a cluster whose service principal Secret is
       already in the namespace has no servicePrincipalJSON here. */}}
{{- if .Values.azure.servicePrincipalJSON }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $cname }}-azure-creds
  namespace: {{ $cname }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
type: Opaque
stringData:
  {{- /* quote rather than a block scalar, for the reasoning spelled out in
         secret-gcp-creds.yaml: quote is fmt.Sprintf("%q"), which renders the
         document as a single-line YAML double-quoted scalar whose escapes
         round-trip byte for byte, while a block scalar depends on how the
         JSON happened to be indented when it was pasted in. */}}
  osServicePrincipal.json: {{ .Values.azure.servicePrincipalJSON | quote }}
{{- end }}
{{- else if ne $source "existing" }}
{{- fail (printf "secrets.azureCreds.source: expected existing, externalSecret or inline — got %q" $source) }}
{{- end }}
{{- end }}
