{{- if and .Values.provision.include (eq .Values.cluster.platform "baremetal") }}
{{- range .Values.baremetal.hosts }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}-bmc-credentials
  namespace: {{ $.Values.cluster.name }}
  annotations:
    helm.sh/hook-weight: "355"
type: Opaque
stringData:
  username: {{ .bmcUsername | default $.Values.baremetal.bmc.username }}
  password: {{ .bmcPassword | default $.Values.baremetal.bmc.password }}
{{- end }}
{{- end }}
