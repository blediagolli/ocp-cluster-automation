{{- if and .Values.provision.include (eq (include "cluster.isAgent" .) "true") }}
{{- $secrets := .Values.secrets | default dict }}
{{- $s := $secrets.bmcCreds | default dict }}
{{- $cname := .Values.cluster.name }}
{{- $platformCfg := index .Values .Values.cluster.platform }}
{{- $defaultBmc := $platformCfg.bmc | default dict }}
{{- /* One Secret per bare metal host. The source is decided per host, not per
       cluster: a host that spells out its own bmcUsername/bmcPassword is
       inline even when the rest come from the backend, because the shared
       backend path holds one credential and that host is the exception. */}}
{{- range $platformCfg.hosts }}
{{- $source := $s.source | default $secrets.source }}
{{- if and .bmcUsername .bmcPassword }}
{{- $source = "inline" }}
{{- end }}
{{- $user := .bmcUsername | default ($defaultBmc.username | default "") }}
{{- $pass := .bmcPassword | default ($defaultBmc.password | default "") }}
{{- if eq $source "externalSecret" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}-bmc-credentials
  namespace: {{ $cname }}
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  refreshInterval: {{ $s.refreshInterval | default $secrets.refreshInterval }}
  secretStoreRef:
    {{- toYaml ($s.secretStoreRef | default $secrets.secretStoreRef) | nindent 4 }}
  target:
    name: {{ .name }}-bmc-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
  data:
    {{- range $s.properties }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ required "secrets.bmcCreds.path is required when source is externalSecret" $s.path }}
        property: {{ .property | default .secretKey }}
    {{- end }}
{{- else if eq $source "inline" }}
{{- if $user }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}-bmc-credentials
  namespace: {{ $cname }}
  annotations:
    argocd.argoproj.io/sync-wave: "6"
type: Opaque
stringData:
  username: {{ $user | quote }}
  password: {{ required (printf "a BMC password is required for host %s — set bmcPassword on the host or a shared bmc.password" .name) $pass | quote }}
{{- end }}
{{- else if ne $source "existing" }}
{{- fail (printf "secrets.bmcCreds.source: expected existing, externalSecret or inline — got %q" $source) }}
{{- end }}
{{- end }}
{{- end }}
