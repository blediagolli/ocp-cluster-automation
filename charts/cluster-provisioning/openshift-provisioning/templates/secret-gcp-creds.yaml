{{- if and .Values.provision.include (eq .Values.cluster.platform "gcp") }}
{{- $secrets := .Values.secrets | default dict }}
{{- $s := $secrets.gcpCreds | default dict }}
{{- $source := $s.source | default $secrets.source }}
{{- $cname := .Values.cluster.name }}
{{- /* One key, and its name is not ours to pick: Hive looks for
       osServiceAccount.json and nothing else. So unlike aws-creds, which
       maps two properties out of the backend into two keys, an
       externalSecret here has to land the whole key file under that single
       secretKey -- not the individual fields of the JSON. */}}
{{- if eq $source "externalSecret" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $cname }}-gcp-creds
  namespace: {{ $cname }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: {{ $s.refreshInterval | default $secrets.refreshInterval }}
  secretStoreRef:
    {{- toYaml ($s.secretStoreRef | default $secrets.secretStoreRef) | nindent 4 }}
  target:
    name: {{ $cname }}-gcp-creds
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
  data:
    {{- range $s.properties }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ required "secrets.gcpCreds.path is required when source is externalSecret" $s.path }}
        property: {{ .property | default .secretKey }}
    {{- end }}
{{- else if eq $source "inline" }}
{{- /* Absent rather than an error when there is nothing to write, the same
       as aws-creds: a cluster whose service account Secret is already in the
       namespace has no serviceAccountJSON here. */}}
{{- if .Values.gcp.serviceAccountJSON }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $cname }}-gcp-creds
  namespace: {{ $cname }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
type: Opaque
stringData:
  {{- /* quote, not a block scalar, even though the value is multi-line.
         quote is fmt.Sprintf("%q"): it renders the whole key file as a
         single-line YAML double-quoted scalar, escaping the JSON's own
         double quotes as \" , its newlines as \n and its backslashes as \\ .
         All three are valid YAML escapes, so the file round-trips byte for
         byte -- including the literal \n sequences inside "private_key",
         which become \\n in YAML and come back out as \n for the JSON
         parser. A block scalar would instead depend on the indentation of
         whatever was pasted into provision.yaml. cluster.sshPrivateKey, also
         multi-line, is handled exactly this way. */}}
  osServiceAccount.json: {{ .Values.gcp.serviceAccountJSON | quote }}
{{- end }}
{{- else if ne $source "existing" }}
{{- fail (printf "secrets.gcpCreds.source: expected existing, externalSecret or inline — got %q" $source) }}
{{- end }}
{{- end }}
