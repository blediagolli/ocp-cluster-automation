{{- if and .Values.provision.include (eq (include "cluster.isIPI" .) "true") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.cluster.name }}-install-config
  namespace: {{ .Values.cluster.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
stringData:
  install-config.yaml: |-
    apiVersion: v1
    metadata:
      name: {{ .Values.cluster.name }}
    baseDomain: {{ .Values.cluster.baseDomain }}
    networking:
      networkType: {{ .Values.cluster.networkType }}
    controlPlane:
      hyperthreading: Enabled
      name: master
      replicas: {{ .Values.masters.count }}
      {{- if eq .Values.cluster.platform "vsphere" }}
      platform:
        vsphere:
          cpus: {{ .Values.vsphere.masters.cpus }}
          coresPerSocket: {{ .Values.vsphere.masters.coresPerSocket }}
          memoryMB: {{ .Values.vsphere.masters.memoryMB }}
          osDisk:
            diskSizeGB: {{ .Values.vsphere.masters.diskGB }}
      {{- else if eq .Values.cluster.platform "aws" }}
      platform:
        aws:
          type: {{ .Values.aws.masters.instanceType }}
          {{- if .Values.aws.masters.zones }}
          zones:
            {{- toYaml .Values.aws.masters.zones | nindent 12 }}
          {{- end }}
          rootVolume:
            size: {{ .Values.aws.masters.rootVolume.size }}
            type: {{ .Values.aws.masters.rootVolume.type }}
      {{- end }}
    compute:
      - hyperthreading: Enabled
        name: worker
        replicas: {{ .Values.workers.count }}
        {{- if eq (int .Values.workers.count) 0 }}
        {{- /* Sizing for a pool that will never have a machine in it is not
               just noise: the installer validates instance types and volume
               sizes it is given, so a stale worker type on a single-node or
               compact cluster can fail an install that was never going to
               create a worker. `platform: {}` is what the single-node
               install-config in the OpenShift docs carries.

               Zones are the exception, and on AWS they have to be kept. The
               machine pools are what tell the installer which AZs the VPC
               spans -- controlPlane.zones constrains where nodes land, not
               the network. An empty compute platform means "no constraint",
               so the installer subnets every AZ in the region and hangs a
               NAT gateway, and therefore an Elastic IP, off each one. A
               single-node cluster would burn three EIPs against a default
               regional quota of five to reach AZs it has no machine in.
               Echoing the master zones collapses the VPC to those AZs
               without naming an instance type the installer would check. */}}
        {{- if and (eq .Values.cluster.platform "aws") .Values.aws.masters.zones }}
        platform:
          aws:
            zones:
              {{- toYaml .Values.aws.masters.zones | nindent 14 }}
        {{- else }}
        platform: {}
        {{- end }}
        {{- else if eq .Values.cluster.platform "vsphere" }}
        platform:
          vsphere:
            cpus: {{ .Values.vsphere.workers.cpus }}
            coresPerSocket: {{ .Values.vsphere.workers.coresPerSocket }}
            memoryMB: {{ .Values.vsphere.workers.memoryMB }}
            osDisk:
              diskSizeGB: {{ .Values.vsphere.workers.diskGB }}
        {{- else if eq .Values.cluster.platform "aws" }}
        platform:
          aws:
            type: {{ .Values.aws.workers.instanceType }}
            {{- if .Values.aws.workers.zones }}
            zones:
              {{- toYaml .Values.aws.workers.zones | nindent 14 }}
            {{- end }}
            rootVolume:
              size: {{ .Values.aws.workers.rootVolume.size }}
              type: {{ .Values.aws.workers.rootVolume.type }}
        {{- end }}
    {{- if eq .Values.cluster.platform "vsphere" }}
    platform:
      vsphere:
        vCenter: {{ .Values.vsphere.vcenter }}
        username: {{ .Values.vsphere.username }}
        password: {{ .Values.vsphere.password }}
        datacenter: {{ .Values.vsphere.datacenter }}
        defaultDatastore: {{ .Values.vsphere.datastore }}
        cluster: {{ .Values.vsphere.cluster }}
        folder: {{ .Values.vsphere.folder }}
        apiVIP: {{ .Values.vsphere.apiVIP }}
        ingressVIP: {{ .Values.vsphere.ingressVIP }}
        network: {{ .Values.vsphere.network }}
    {{- else if eq .Values.cluster.platform "aws" }}
    platform:
      aws:
        region: {{ .Values.aws.region }}
    {{- end }}
    {{- if .Values.cluster.fips }}
    fips: true
    {{- end }}
    {{- if .Values.proxy.enabled }}
    proxy:
      httpProxy: {{ .Values.proxy.httpProxy | quote }}
      httpsProxy: {{ .Values.proxy.httpsProxy | quote }}
      noProxy: {{ .Values.proxy.noProxy | quote }}
    {{- end }}
    pullSecret: ""
    {{- if .Values.imageContentSources.enabled }}
    imageContentSources:
      - mirrors:
          - {{ .Values.imageContentSources.mirror }}
        source: quay.io/openshift-release-dev/ocp-release
      - mirrors:
          - {{ .Values.imageContentSources.mirror }}
        source: quay.io/openshift-release-dev/ocp-v4.0-art-dev
    {{- end }}
    sshKey: {{ .Values.cluster.sshPublicKey }}
    {{- if .Values.cluster.additionalTrustBundle }}
    additionalTrustBundle: {{ .Values.cluster.additionalTrustBundle | toYaml | indent 4 }}
    {{- end }}
{{- end }}
