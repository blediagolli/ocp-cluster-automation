{{- if and .Values.provision.include (eq (include "cluster.isIPI" .) "true") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.cluster.name }}-install-config
  namespace: {{ .Values.cluster.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
stringData:
  install-config.yaml: |-
    apiVersion: v1
    metadata:
      name: {{ .Values.cluster.name }}
    baseDomain: {{ .Values.cluster.baseDomain }}
    networking:
      networkType: {{ .Values.cluster.networkType }}
    controlPlane:
      hyperthreading: Enabled
      name: master
      replicas: {{ .Values.masters.count }}
      {{- if eq .Values.cluster.platform "vsphere" }}
      platform:
        vsphere:
          cpus: {{ .Values.vsphere.masters.cpus }}
          coresPerSocket: {{ .Values.vsphere.masters.coresPerSocket }}
          memoryMB: {{ .Values.vsphere.masters.memoryMB }}
          osDisk:
            diskSizeGB: {{ .Values.vsphere.masters.diskGB }}
      {{- else if eq .Values.cluster.platform "aws" }}
      platform:
        aws:
          type: {{ .Values.aws.masters.instanceType }}
          {{- if .Values.aws.masters.zones }}
          zones:
            {{- toYaml .Values.aws.masters.zones | nindent 12 }}
          {{- end }}
          rootVolume:
            size: {{ .Values.aws.masters.rootVolume.size }}
            type: {{ .Values.aws.masters.rootVolume.type }}
      {{- else if eq .Values.cluster.platform "gcp" }}
      platform:
        gcp:
          type: {{ .Values.gcp.masters.machineType }}
          {{- if .Values.gcp.masters.zones }}
          zones:
            {{- toYaml .Values.gcp.masters.zones | nindent 12 }}
          {{- end }}
          osDisk:
            diskType: {{ .Values.gcp.masters.osDisk.diskType }}
            diskSizeGB: {{ .Values.gcp.masters.osDisk.diskSizeGB }}
      {{- else if eq .Values.cluster.platform "azure" }}
      platform:
        azure:
          type: {{ .Values.azure.masters.vmSize }}
          {{- if .Values.azure.masters.zones }}
          {{- /* Ranged and quoted rather than `toYaml`, which the other
                 platforms use. Azure availability zones are "1", "2", "3" --
                 bare digits, so YAML parses an unquoted list as integers and
                 the installer rejects it against a []string field. Writing
                 them quoted in provision.yaml would be enough, except that
                 the one spelling a reader naturally reaches for is the one
                 that breaks, and it breaks inside the Hive pod rather than
                 at render time. Quote them here so either spelling works. */}}
          zones:
            {{- range .Values.azure.masters.zones }}
            - {{ . | quote }}
            {{- end }}
          {{- end }}
          osDisk:
            diskType: {{ .Values.azure.masters.osDisk.diskType }}
            diskSizeGB: {{ .Values.azure.masters.osDisk.diskSizeGB }}
      {{- end }}
    compute:
      - hyperthreading: Enabled
        name: worker
        replicas: {{ .Values.workers.count }}
        {{- if eq (int .Values.workers.count) 0 }}
        {{- /* Sizing for a pool that will never have a machine in it is not
               just noise: the installer validates instance types and volume
               sizes it is given, so a stale worker type on a single-node or
               compact cluster can fail an install that was never going to
               create a worker. `platform: {}` is what the single-node
               install-config in the OpenShift docs carries.

               Zones are the exception, and on AWS they have to be kept. The
               machine pools are what tell the installer which AZs the VPC
               spans -- controlPlane.zones constrains where nodes land, not
               the network. An empty compute platform means "no constraint",
               so the installer subnets every AZ in the region and hangs a
               NAT gateway, and therefore an Elastic IP, off each one. A
               single-node cluster would burn three EIPs against a default
               regional quota of five to reach AZs it has no machine in.
               Echoing the master zones collapses the VPC to those AZs
               without naming an instance type the installer would check.

               GCP is deliberately not in that condition, and the reason is
               worth writing down because the two shapes look identical. GCP
               subnets are regional, not zonal: the installer makes one VPC
               with a master subnet and a worker subnet and hangs a single
               regional Cloud NAT off one Cloud Router, whatever zones the
               machine pools name. Zones there are instance placement and
               nothing else, so an unbounded compute pool costs no addresses
               -- while naming zones for a pool that will never have a
               machine still gets them validated against the region, which is
               a failure mode bought for nothing. GCP gets platform: {} like
               vSphere. Do not "fix" this to match AWS.

               Azure is on the GCP side of that line, for the same reason
               reached a different way: a vnet is regional and its subnets
               are regional too, so zones do not multiply anything in the
               network. Outbound is a single load balancer or NAT gateway per
               cluster, not one per zone. AWS remains the only platform here
               where the compute pool is load-bearing for the network. */}}
        {{- if and (eq .Values.cluster.platform "aws") .Values.aws.masters.zones }}
        platform:
          aws:
            zones:
              {{- toYaml .Values.aws.masters.zones | nindent 14 }}
        {{- else }}
        platform: {}
        {{- end }}
        {{- else if eq .Values.cluster.platform "vsphere" }}
        platform:
          vsphere:
            cpus: {{ .Values.vsphere.workers.cpus }}
            coresPerSocket: {{ .Values.vsphere.workers.coresPerSocket }}
            memoryMB: {{ .Values.vsphere.workers.memoryMB }}
            osDisk:
              diskSizeGB: {{ .Values.vsphere.workers.diskGB }}
        {{- else if eq .Values.cluster.platform "aws" }}
        platform:
          aws:
            type: {{ .Values.aws.workers.instanceType }}
            {{- if .Values.aws.workers.zones }}
            zones:
              {{- toYaml .Values.aws.workers.zones | nindent 14 }}
            {{- end }}
            rootVolume:
              size: {{ .Values.aws.workers.rootVolume.size }}
              type: {{ .Values.aws.workers.rootVolume.type }}
        {{- else if eq .Values.cluster.platform "gcp" }}
        platform:
          gcp:
            type: {{ .Values.gcp.workers.machineType }}
            {{- if .Values.gcp.workers.zones }}
            zones:
              {{- toYaml .Values.gcp.workers.zones | nindent 14 }}
            {{- end }}
            osDisk:
              diskType: {{ .Values.gcp.workers.osDisk.diskType }}
              diskSizeGB: {{ .Values.gcp.workers.osDisk.diskSizeGB }}
        {{- else if eq .Values.cluster.platform "azure" }}
        platform:
          azure:
            type: {{ .Values.azure.workers.vmSize }}
            {{- if .Values.azure.workers.zones }}
            zones:
              {{- range .Values.azure.workers.zones }}
              - {{ . | quote }}
              {{- end }}
            {{- end }}
            osDisk:
              diskType: {{ .Values.azure.workers.osDisk.diskType }}
              diskSizeGB: {{ .Values.azure.workers.osDisk.diskSizeGB }}
        {{- end }}
    {{- if eq .Values.cluster.platform "vsphere" }}
    platform:
      vsphere:
        vCenter: {{ .Values.vsphere.vcenter }}
        username: {{ .Values.vsphere.username }}
        password: {{ .Values.vsphere.password }}
        datacenter: {{ .Values.vsphere.datacenter }}
        defaultDatastore: {{ .Values.vsphere.datastore }}
        cluster: {{ .Values.vsphere.cluster }}
        folder: {{ .Values.vsphere.folder }}
        apiVIP: {{ .Values.vsphere.apiVIP }}
        ingressVIP: {{ .Values.vsphere.ingressVIP }}
        network: {{ .Values.vsphere.network }}
    {{- else if eq .Values.cluster.platform "aws" }}
    platform:
      aws:
        region: {{ .Values.aws.region }}
    {{- else if eq .Values.cluster.platform "gcp" }}
    platform:
      gcp:
        {{- /* Required rather than defaulted. An empty projectID is accepted
               by the YAML and then fails inside the Hive provisioning pod
               with a GCP API error about an empty project path -- hours
               later and nowhere near provision.yaml. */}}
        projectID: {{ required "gcp.projectID is required for a GCP IPI cluster" .Values.gcp.projectID }}
        region: {{ .Values.gcp.region }}
        {{- /* Shared or pre-existing VPC. All three go together: naming a
               network without both subnets leaves the installer with nowhere
               to put nodes, and it reports that as a missing-subnet error
               against a network it did not create. Leave all three empty,
               the normal case, and the installer builds its own. */}}
        {{- if .Values.gcp.network }}
        network: {{ .Values.gcp.network }}
        controlPlaneSubnet: {{ required "gcp.controlPlaneSubnet is required alongside gcp.network" .Values.gcp.controlPlaneSubnet }}
        computeSubnet: {{ required "gcp.computeSubnet is required alongside gcp.network" .Values.gcp.computeSubnet }}
        {{- end }}
    {{- else if eq .Values.cluster.platform "azure" }}
    platform:
      azure:
        {{- /* No subscriptionId or tenantId here, and that is not an
               oversight worth correcting: install-config has no field for
               either. They live in the credentials file alongside the client
               secret, so the subscription a cluster lands in is a property
               of which Secret you point it at, not of this file. */}}
        baseDomainResourceGroupName: {{ required "azure.baseDomainResourceGroupName is required for an Azure IPI cluster" .Values.azure.baseDomainResourceGroupName }}
        region: {{ .Values.azure.region }}
        {{- if .Values.azure.cloudName }}
        cloudName: {{ .Values.azure.cloudName }}
        {{- end }}
        {{- /* Pre-existing vnet. Four fields, not GCP's three: Azure keeps
               the network in a resource group that is usually not the
               cluster's own, so the group has to be named separately from
               the vnet inside it. All four go together. */}}
        {{- if .Values.azure.virtualNetwork }}
        networkResourceGroupName: {{ required "azure.networkResourceGroupName is required alongside azure.virtualNetwork" .Values.azure.networkResourceGroupName }}
        virtualNetwork: {{ .Values.azure.virtualNetwork }}
        controlPlaneSubnet: {{ required "azure.controlPlaneSubnet is required alongside azure.virtualNetwork" .Values.azure.controlPlaneSubnet }}
        computeSubnet: {{ required "azure.computeSubnet is required alongside azure.virtualNetwork" .Values.azure.computeSubnet }}
        {{- end }}
        {{- /* Loadbalancer (the installer's default when unset) |
               UserDefinedRouting. The latter is for clusters with no public
               egress, where a firewall or NVA already routes outbound
               traffic -- choose it and the installer builds no outbound
               load balancer, so a cluster with no other route out cannot
               reach Quay and the install hangs pulling release images. */}}
        {{- if .Values.azure.outboundType }}
        outboundType: {{ .Values.azure.outboundType }}
        {{- end }}
    {{- end }}
    {{- /* Mint by default, which is what the installer does with no field at
           all. Manual is the first half of Workload Identity Federation: it
           stops the Cloud Credential Operator minting service accounts and
           makes the cluster expect credentials it was handed. The other half
           -- ccoctl-generated manifests and a bound service account signing
           key -- the chart does not template yet, so setting this alone
           gives a cluster whose operators have no credentials at all. See
           docs/cluster-provisioning/gcp.md. */}}
    {{- if and (eq .Values.cluster.platform "gcp") .Values.gcp.credentialsMode }}
    credentialsMode: {{ .Values.gcp.credentialsMode }}
    {{- else if and (eq .Values.cluster.platform "azure") .Values.azure.credentialsMode }}
    {{- /* Same field, same half-finished story as GCP above: Manual is the
           first half of Azure AD Workload Identity and the ccoctl manifests
           that complete it are not templated. See
           docs/cluster-provisioning/azure.md. */}}
    credentialsMode: {{ .Values.azure.credentialsMode }}
    {{- end }}
    {{- if .Values.cluster.fips }}
    fips: true
    {{- end }}
    {{- if .Values.proxy.enabled }}
    proxy:
      httpProxy: {{ .Values.proxy.httpProxy | quote }}
      httpsProxy: {{ .Values.proxy.httpsProxy | quote }}
      noProxy: {{ .Values.proxy.noProxy | quote }}
    {{- end }}
    pullSecret: ""
    {{- if .Values.imageContentSources.enabled }}
    imageContentSources:
      - mirrors:
          - {{ .Values.imageContentSources.mirror }}
        source: quay.io/openshift-release-dev/ocp-release
      - mirrors:
          - {{ .Values.imageContentSources.mirror }}
        source: quay.io/openshift-release-dev/ocp-v4.0-art-dev
    {{- end }}
    sshKey: {{ .Values.cluster.sshPublicKey }}
    {{- if .Values.cluster.additionalTrustBundle }}
    additionalTrustBundle: {{ .Values.cluster.additionalTrustBundle | toYaml | indent 4 }}
    {{- end }}
{{- end }}
