{{- if .Values.provision.include }}
{{- $secrets := .Values.secrets | default dict }}
{{- $s := $secrets.pullSecret | default dict }}
{{- $source := $s.source | default $secrets.source }}
{{- $cname := .Values.cluster.name }}
{{- /* Every credential this chart creates follows the same three-way shape:
       source: externalSecret fetches it from a secrets manager, inline writes
       it from values, existing leaves it to something else.

       This chart defaults to inline rather than existing, because the Secrets
       live in a namespace this chart creates — nothing else is going to put
       them there — and because provisioning credentials have always come from
       provision.yaml. Set secrets.source: externalSecret to flip the whole
       cluster over, or set source on one credential.

       Inline values keep their existing homes (cluster.pullSecret, aws.*,
       vsphere.*, per-host bmcUsername/bmcPassword): those same fields feed
       install-config and the ClusterDeployment, so duplicating them under a
       secret spec would be two places to get wrong. */}}
{{- if eq $source "externalSecret" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $cname }}-pull-secret
  namespace: {{ $cname }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: {{ $s.refreshInterval | default $secrets.refreshInterval }}
  secretStoreRef:
    {{- toYaml ($s.secretStoreRef | default $secrets.secretStoreRef) | nindent 4 }}
  target:
    name: {{ $cname }}-pull-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
  data:
    {{- range $s.properties }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ required "secrets.pullSecret.path is required when source is externalSecret" $s.path }}
        property: {{ .property | default .secretKey }}
    {{- end }}
{{- else if eq $source "inline" }}
{{- /* imageContentSources builds the dockerconfigjson from a mirror
       registry's credentials instead of taking one wholesale. It is written
       as plain JSON rather than base64 into `data`; same Secret either way. */}}
{{- $pull := ternary (include "imagePullSecretJSON" .) .Values.cluster.pullSecret .Values.imageContentSources.enabled }}
{{- if $pull }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $cname }}-pull-secret
  namespace: {{ $cname }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: {{ $pull | quote }}
{{- end }}
{{- else if ne $source "existing" }}
{{- fail (printf "secrets.pullSecret.source: expected existing, externalSecret or inline — got %q" $source) }}
{{- end }}
{{- end }}
