{{- if and .Values.provision.include (eq (include "cluster.isIPI" .) "true") }}
{{- $secrets := .Values.secrets | default dict }}
{{- $s := $secrets.sshPrivateKey | default dict }}
{{- $source := $s.source | default $secrets.source }}
{{- $cname := .Values.cluster.name }}
{{- if eq $source "externalSecret" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $cname }}-ssh-private-key
  namespace: {{ $cname }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: {{ $s.refreshInterval | default $secrets.refreshInterval }}
  secretStoreRef:
    {{- toYaml ($s.secretStoreRef | default $secrets.secretStoreRef) | nindent 4 }}
  target:
    name: {{ $cname }}-ssh-private-key
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
  data:
    {{- range $s.properties }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ required "secrets.sshPrivateKey.path is required when source is externalSecret" $s.path }}
        property: {{ .property | default .secretKey }}
    {{- end }}
{{- else if eq $source "inline" }}
{{- if .Values.cluster.sshPrivateKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $cname }}-ssh-private-key
  namespace: {{ $cname }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
type: Opaque
stringData:
  ssh-privatekey: {{ .Values.cluster.sshPrivateKey | quote }}
{{- end }}
{{- else if ne $source "existing" }}
{{- fail (printf "secrets.sshPrivateKey.source: expected existing, externalSecret or inline — got %q" $source) }}
{{- end }}
{{- end }}
