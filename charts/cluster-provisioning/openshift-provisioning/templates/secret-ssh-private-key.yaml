{{- if and .Values.provision.include (eq (include "cluster.isIPI" .) "true") .Values.cluster.sshPrivateKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.cluster.name }}-ssh-private-key
  namespace: {{ .Values.cluster.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
type: Opaque
stringData:
  ssh-privatekey: {{- .Values.cluster.sshPrivateKey | toYaml | indent 2 }}
{{- end }}
