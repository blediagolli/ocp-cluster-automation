{{- if and .Values.provision.include (eq .Values.cluster.platform "vsphere") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.cluster.name }}-vsphere-certs
  namespace: {{ .Values.cluster.name }}
  annotations:
    helm.sh/hook-weight: "355"
type: Opaque
stringData:
  .cacert: {{- .Values.vsphere.cacertificate | toYaml | indent 2 }}
{{- end }}
