{{- if and .Values.provision.include (eq .Values.cluster.platform "vsphere") }}
{{- $secrets := .Values.secrets | default dict }}
{{- $s := $secrets.vsphereCerts | default dict }}
{{- $source := $s.source | default $secrets.source }}
{{- $cname := .Values.cluster.name }}
{{- /* The key is .cacert with a leading dot — Hive looks for that exact name. */}}
{{- if eq $source "externalSecret" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $cname }}-vsphere-certs
  namespace: {{ $cname }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: {{ $s.refreshInterval | default $secrets.refreshInterval }}
  secretStoreRef:
    {{- toYaml ($s.secretStoreRef | default $secrets.secretStoreRef) | nindent 4 }}
  target:
    name: {{ $cname }}-vsphere-certs
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
  data:
    {{- range $s.properties }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ required "secrets.vsphereCerts.path is required when source is externalSecret" $s.path }}
        property: {{ .property | default .secretKey }}
    {{- end }}
{{- else if eq $source "inline" }}
{{- if .Values.vsphere.cacertificate }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $cname }}-vsphere-certs
  namespace: {{ $cname }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
type: Opaque
stringData:
  .cacert: {{ .Values.vsphere.cacertificate | quote }}
{{- end }}
{{- else if ne $source "existing" }}
{{- fail (printf "secrets.vsphereCerts.source: expected existing, externalSecret or inline — got %q" $source) }}
{{- end }}
{{- end }}
