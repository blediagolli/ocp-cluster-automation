{{- if and .Values.provision.include (eq (include "cluster.isAgent" .) "true") .Values.vsphereControlPlane.enabled }}
{{- $secrets := .Values.secrets | default dict }}
{{- $s := $secrets.vsphereControlPlaneCreds | default dict }}
{{- $source := $s.source | default $secrets.source }}
{{- $cname := .Values.cluster.name }}
{{- if eq $source "externalSecret" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $cname }}-vsphere-cp-creds
  namespace: {{ $cname }}
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  refreshInterval: {{ $s.refreshInterval | default $secrets.refreshInterval }}
  secretStoreRef:
    {{- toYaml ($s.secretStoreRef | default $secrets.secretStoreRef) | nindent 4 }}
  target:
    name: {{ $cname }}-vsphere-cp-creds
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
  data:
    {{- range $s.properties }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ required "secrets.vsphereControlPlaneCreds.path is required when source is externalSecret" $s.path }}
        property: {{ .property | default .secretKey }}
    {{- end }}
{{- else if eq $source "inline" }}
{{- if .Values.vsphereControlPlane.username }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $cname }}-vsphere-cp-creds
  namespace: {{ $cname }}
  annotations:
    argocd.argoproj.io/sync-wave: "6"
type: Opaque
stringData:
  username: {{ .Values.vsphereControlPlane.username | quote }}
  password: {{ required "vsphereControlPlane.password is required alongside vsphereControlPlane.username" .Values.vsphereControlPlane.password | quote }}
{{- end }}
{{- else if ne $source "existing" }}
{{- fail (printf "secrets.vsphereControlPlaneCreds.source: expected existing, externalSecret or inline — got %q" $source) }}
{{- end }}
{{- end }}
