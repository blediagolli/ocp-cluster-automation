{{- if and .Values.provision.include (eq .Values.cluster.platform "vsphere") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.cluster.name }}-vsphere-creds
  namespace: {{ .Values.cluster.name }}
  annotations:
    helm.sh/hook-weight: "355"
type: Opaque
stringData:
  username: {{ .Values.vsphere.username }}
  password: {{ .Values.vsphere.password }}
{{- end }}
