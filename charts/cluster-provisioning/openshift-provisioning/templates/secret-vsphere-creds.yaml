{{- if and .Values.provision.include (eq .Values.cluster.platform "vsphere") (eq (include "cluster.useExternalSecret" (dict "root" . "key" "vsphereCreds")) "false") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.cluster.name }}-vsphere-creds
  namespace: {{ .Values.cluster.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
type: Opaque
stringData:
  username: {{ .Values.vsphere.username }}
  password: {{ .Values.vsphere.password }}
{{- end }}
