fleet:
  operatorClusterType: dev
  operatorProfile: ocp-4.22

# Node counts. Three topologies are supported, and the master count is what
# selects between them — there is no separate mode flag to fall out of step
# with the replica counts the installer actually reads:
#
#   3 masters / N workers   standard
#   3 masters / 0 workers   compact — workloads run on the control plane
#   1 master  / 0 workers   single-node OpenShift (SNO)
#
# A single master with workers alongside it is not a topology; the chart
# fails the render rather than letting it fail inside a Hive pod hours later.
# Either count at 0 workers drops the worker MachinePool entirely and strips
# the compute pool in install-config down to nothing but its zones — on AWS
# those zones are what bound the AZs the VPC spans, so dropping them too
# would subnet every AZ in the region and burn an Elastic IP per NAT gateway.
#
# SNO sizing is a floor, not a default: the single node runs the control
# plane and the workload, so it needs at least 8 vCPU / 32 GiB / 120 GB of
# disk. On AWS that is m5.2xlarge or larger. On an agent-based platform also
# set <platform>.provisionRequirements.controlPlaneAgents to 1.
masters:
  count: 3

workers:
  count: 3

