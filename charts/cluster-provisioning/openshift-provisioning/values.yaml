  #     bmcPassword: ""        # per-host override (falls back to none.bmc.password)

# vSphere control plane automation (agent-based mixed cluster: vSphere VMs + bare metal workers)
vsphereControlPlane:
  enabled: false
  automation: govc  # govc or ansible
  simulator:
    enabled: false  # deploy vcsim for testing (no real vCenter needed)
    image: "docker.io/vmware/vcsim:latest"
  images:
    govc: "quay.io/openshift/origin-cli:latest"
    ansible: "quay.io/ansible/ansible-runner:latest"
  govcVersion: "v0.46.2"
  vcenter: ""
  username: ""
  password: ""
  insecure: true
  datacenter: ""
  datastore: ""
  cluster: ""
  network: ""
  folder: ""
  resourcePool: ""
  masters:
    count: 3
    cpus: 4
    memoryMB: 16384
    diskGB: 120

# Networking (agent-based platforms)
networking:
  clusterNetwork:
    - cidr: 10.128.0.0/14
      hostPrefix: 23
    # - cidr: "fd01::/48"      # dual-stack
    #   hostPrefix: 64
  serviceNetwork:
    - 172.30.0.0/16
    # - "fd02::/112"           # dual-stack
  machineNetwork: []
  # machineNetwork:
  #   - cidr: 10.206.220.0/24
  #   - cidr: "2610:30:401C:2352::/64"  # dual-stack

# Disconnected registry (optional)
imageContentSources:
  enabled: false
  # mirror: registry.disconnected.example.com/openshift4
  # registry: registry.disconnected.example.com
  # username: registry-user
  # password: registry-password
  # email: platform@example.com
