# Where this chart's credentials come from. Every entry below is a spec in the
# shared shape — see docs/cluster-configuration/secrets.md, which every chart
# in this repo that creates a Secret follows.
#
# `source` is the chart-wide default and each credential can override it:
#   inline          read the value out of the fields it already lives in
#                   (cluster.pullSecret, aws.*, vsphere.*, per-host bmc*).
#                   The default here, unlike elsewhere, because provisioning
#                   credentials have always come from provision.yaml.
#   externalSecret  render an ExternalSecret; set `path` and `properties`.
#   existing        render nothing and expect the Secret to be there. Rarely
#                   right for this chart: the namespace is created by it.
#
# Replaces externalSecrets.enabled plus a per-credential path check. A
# credential with no inline value and source: inline is skipped, not an error —
# an AWS IPI cluster using the installer's own credentials has no accessKeyID.
secrets:
  source: inline
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  refreshInterval: 1h
  # Pull secret
  pullSecret: {}
  #   source: externalSecret
  #   path: secret/data/openshift/pull-secret
  #   properties:
  #     - secretKey: .dockerconfigjson
  #       property: .dockerconfigjson
  # AWS IPI credentials
  awsCreds: {}
  #   path: secret/data/aws/credentials
  #   properties:
  #     - secretKey: aws_access_key_id
  #       property: aws_access_key_id
  #     - secretKey: aws_secret_access_key
  #       property: aws_secret_access_key
  # vSphere IPI credentials
  vsphereCreds: {}
  #   path: secret/data/vsphere/credentials
  #   properties:
  #     - secretKey: username
  #       property: username
  #     - secretKey: password
  #       property: password
  # vSphere IPI CA certificate
  vsphereCerts: {}
  #   path: secret/data/vsphere/ca
  #   properties:
  #     - secretKey: .cacert
  #       property: cacert
  # vSphere control plane credentials (agent-based mixed cluster)
  vsphereControlPlaneCreds: {}
  #   path: secret/data/vsphere-cp/credentials
  #   properties:
  #     - secretKey: username
  #       property: username
  #     - secretKey: password
  #       property: password
  # BMC credentials (shared default for all bare metal hosts)
  bmcCreds: {}
  #   path: secret/data/bmc/credentials
  #   properties:
  #     - secretKey: username
  #       property: username
  #     - secretKey: password
  #       property: password
  # SSH private key (IPI platforms)
  sshPrivateKey: {}
  #   path: secret/data/openshift/ssh
  #   properties:
  #     - secretKey: ssh-privatekey
  #       property: ssh-privatekey
