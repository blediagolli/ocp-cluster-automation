    image: "docker.io/vmware/vcsim:latest"
  # Optional ignition override for CP InfraEnv (overrides top-level ignitionConfigOverride for CP nodes)
  ignitionConfigOverride: ""
  images:
    govc: "quay.io/openshift/origin-cli:latest"
    ansible: "quay.io/ansible/ansible-runner:latest"
  govcVersion: "v0.46.2"
  vcenter: ""
  username: ""
