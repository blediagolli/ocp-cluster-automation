provision:
  include: false

cluster:
  name: example
  baseDomain: example.com
  # vsphere | aws | baremetal | none
  platform: vsphere
  environment: dev
  clusterSet: default
  imageSetRef: ""
  networkType: OVNKubernetes
  sshPublicKey: ""
  sshPrivateKey: ""
  pullSecret: ""
  additionalTrustBundle: ""
  fips: false
  # additionalTrustBundle: |
  #   -----BEGIN CERTIFICATE-----
  #   MIIDkTCCAnmgAwIBAgI...
  #   -----END CERTIFICATE-----

# Proxy (all platforms — IPI: install-config; agent-based: AgentClusterInstall + InfraEnv)
proxy:
  enabled: false
  # httpProxy: "http://proxy.internal.example.com:3128"
  # httpsProxy: "http://proxy.internal.example.com:3128"
  # noProxy: ".internal.example.com,.cluster.local,10.128.0.0/14,172.30.0.0/16"

# NTP (agent-based platforms — added to InfraEnv)
ntp:
  enabled: false
  # sources:
  #   - ntp1.internal.example.com
  #   - ntp2.internal.example.com

# Ignition override for discovery ISO (agent-based platforms — added to InfraEnv)
ignitionConfigOverride:
  enabled: false
  # config: '{"ignition":{"version":"3.1.0"},"storage":{"files":[{"path":"/etc/pki/ca-trust/source/anchors/internal-ca.pem","mode":420,"contents":{"source":"data:text/plain;base64,LS0tLS1C..."}}]}}'

