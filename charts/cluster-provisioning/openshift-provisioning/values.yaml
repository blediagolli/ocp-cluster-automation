fleet:
  operatorClusterType: dev
  operatorProfile: ocp-4.22

masters:
  count: 3

workers:
  count: 3

# --- Platform: vSphere (IPI) ---
vsphere:
  vcenter: ""
  username: ""
  password: ""
  datacenter: ""
  datastore: ""
  cluster: ""
  folder: ""
  network: ""
  cacertificate: ""
  apiVIP: ""
  ingressVIP: ""
  masters:
    cpus: 4
    coresPerSocket: 2
    memoryMB: 16384
    diskGB: 120
  workers:
    cpus: 4
    coresPerSocket: 2
    memoryMB: 16384
    diskGB: 120

# --- Platform: AWS (IPI) ---
aws:
  accessKeyID: ""
  secretAccessKey: ""
  region: us-east-1
  masters:
    instanceType: m5.xlarge
    # zones:
    #   - us-east-1a
    #   - us-east-1b
    #   - us-east-1c
    zones: []
    rootVolume:
      size: 120
      type: gp3
  workers:
    instanceType: m5.xlarge
    # zones:
    #   - us-east-1a
    #   - us-east-1b
    #   - us-east-1c
    zones: []
    rootVolume:
      size: 120
      type: gp3

