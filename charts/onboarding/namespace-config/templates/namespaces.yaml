{{- range .Values.team.namespaces }}
{{- $size := index $.Values.namespaceSizes .size }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .name }}
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
  labels:
    argocd.argoproj.io/managed-by: {{ $.Values.team.name }}-gitops
    namespace-size: {{ .size }}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: team-quota
  namespace: {{ .name }}
  labels:
    namespace-size: {{ .size }}
spec:
  hard:
    {{- toYaml $size.resourceQuota.hard | nindent 4 }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: team-limits
  namespace: {{ .name }}
  labels:
    namespace-size: {{ .size }}
spec:
  limits:
    {{- toYaml $size.limitRange.limits | nindent 4 }}
{{- end }}
