{{- range $name, $operator := .Values.operators }}
{{- if and $operator.include (not $operator.skipNamespace) }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $operator.namespace }}
  labels:
    app.kubernetes.io/managed-by: multi-cluster-config
    operator: {{ $name }}
    {{- with $operator.namespaceLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $operator.namespaceAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- end }}
{{- end }}
