{{- if .Values.consolePlugins.include }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: acm-console-plugins
  namespace: {{ .Values.multiClusterHub.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: acm-console-plugins
  annotations:
    argocd.argoproj.io/sync-wave: "3"
rules:
  - apiGroups:
      - operator.openshift.io
    resources:
      - consoles
    verbs:
      - get
      - patch
  - apiGroups:
      - console.openshift.io
    resources:
      - consoleplugins
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: acm-console-plugins-binding
  annotations:
    argocd.argoproj.io/sync-wave: "3"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: acm-console-plugins
subjects:
  - kind: ServiceAccount
    name: acm-console-plugins
    namespace: {{ .Values.multiClusterHub.namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: acm-console-plugins
  namespace: {{ .Values.multiClusterHub.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: Replace=true
spec:
  backoffLimit: 4
  template:
    spec:
      serviceAccountName: acm-console-plugins
      restartPolicy: OnFailure
      containers:
        - name: enable-plugins
          image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
          command:
            - /bin/bash
            - -c
            - |
              PLUGINS="{{ join " " .Values.consolePlugins.plugins }}"
              CURRENT=$(oc get console.operator.openshift.io cluster -o jsonpath='{.spec.plugins}')
              for plugin in $PLUGINS; do
                echo "Waiting for ConsolePlugin ${plugin}..."
                until oc get consoleplugin "${plugin}" &>/dev/null; do
                  echo "ConsolePlugin ${plugin} not yet available, retrying in 10s..."
                  sleep 10
                done
                if echo "${CURRENT}" | grep -q "${plugin}"; then
                  echo "Plugin ${plugin} already registered."
                else
                  echo "Enabling ${plugin} console plugin..."
                  oc patch console.operator.openshift.io cluster \
                    --type=json \
                    -p "[{\"op\": \"add\", \"path\": \"/spec/plugins/-\", \"value\": \"${plugin}\"}]" 2>/dev/null || true
                  CURRENT=$(oc get console.operator.openshift.io cluster -o jsonpath='{.spec.plugins}')
                fi
              done

              echo "Current console plugins: ${CURRENT}"
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      terminationGracePeriodSeconds: 0
{{- end }}
