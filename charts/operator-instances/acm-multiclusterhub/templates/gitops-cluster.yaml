{{- if .Values.gitopsCluster.include }}
apiVersion: cluster.open-cluster-management.io/v1beta2
kind: ManagedClusterSetBinding
metadata:
  name: {{ .Values.gitopsCluster.clusterSet }}
  namespace: {{ .Values.gitopsCluster.argoNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  clusterSet: {{ .Values.gitopsCluster.clusterSet }}
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: {{ .Values.gitopsCluster.placementName }}
  namespace: {{ .Values.gitopsCluster.argoNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: environment
              operator: "In"
              values:
                {{- toYaml .Values.gitopsCluster.matchEnvironments | nindent 16 }}
---
apiVersion: apps.open-cluster-management.io/v1beta1
kind: GitOpsCluster
metadata:
  name: {{ .Values.gitopsCluster.name }}
  namespace: {{ .Values.gitopsCluster.argoNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  argoServer:
    cluster: local-cluster
    argoNamespace: {{ .Values.gitopsCluster.argoNamespace }}
  placementRef:
    kind: Placement
    apiVersion: cluster.open-cluster-management.io/v1beta1
    name: {{ .Values.gitopsCluster.placementName }}
    namespace: {{ .Values.gitopsCluster.argoNamespace }}
{{- end }}
