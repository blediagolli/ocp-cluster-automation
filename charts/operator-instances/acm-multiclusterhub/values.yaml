multiClusterHub:
  include: false
  name: multiclusterhub
  namespace: open-cluster-management
  availabilityConfig: High
  disableHubSelfManagement: false
  localClusterName: local-cluster
  overrides:
    components:
      - name: app-lifecycle
        enabled: true
      - name: cluster-lifecycle
        enabled: true
      - name: console
        enabled: true
      - name: grc
        enabled: true
      - name: insights
        enabled: true
      - name: multicluster-engine
        enabled: true
      - name: multicluster-observability
        enabled: true
      - name: search
        enabled: true
      - name: submariner-addon
        enabled: true
      - name: volsync
        enabled: true
      - name: cluster-backup
        enabled: false
      - name: fine-grained-rbac
        enabled: false
      - name: siteconfig
        enabled: false
      - name: cnv-mtv-integrations
        enabled: false

assistedService:
  include: false
  databaseStorage: 10Gi
  filesystemStorage: 100Gi
  imageStorage: 50Gi
  logLevel: info
  isoImageType: minimal-iso

hiveConfig:
  include: false
  logLevel: debug
  targetNamespace: hive
  featureGates:
    - AlphaAgentInstallStrategy
  provisioning:
    provisioningNetwork: Disabled
    watchAllNamespaces: true

gitopsCluster:
  include: false
  name: argo-acm-clusters
  argoNamespace: openshift-gitops
  placementName: default
  clusterSet: default
  matchEnvironments:
    - dev
    - prod

consolePlugins:
  include: false
  plugins:
    - acm
    - mce
