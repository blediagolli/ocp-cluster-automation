{{- if .Values.multiClusterObservability.include }}
apiVersion: observability.open-cluster-management.io/v1beta2
kind: MultiClusterObservability
metadata:
  name: {{ .Values.multiClusterObservability.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  enableDownsampling: {{ .Values.multiClusterObservability.enableDownsampling }}
  observabilityAddonSpec:
    enableMetrics: true
    interval: {{ .Values.multiClusterObservability.observabilityAddonSpec.interval }}
    scrapeSizeLimitBytes: {{ .Values.multiClusterObservability.observabilityAddonSpec.scrapeSizeLimitBytes }}
    workers: {{ .Values.multiClusterObservability.observabilityAddonSpec.workers }}
  storageConfig:
    alertmanagerStorageSize: {{ .Values.multiClusterObservability.alertmanagerStorageSize }}
    metricObjectStorage:
      key: {{ .Values.objectStorage.key }}
      name: {{ .Values.objectStorage.secretName }}
    storageClass: {{ .Values.cluster.storageClass }}
    compactStorageSize: {{ .Values.multiClusterObservability.compactStorageSize }}
    receiveStorageSize: {{ .Values.multiClusterObservability.receiveStorageSize }}
    ruleStorageSize: {{ .Values.multiClusterObservability.ruleStorageSize }}
    storeStorageSize: {{ .Values.multiClusterObservability.storeStorageSize }}
{{- end }}
