{{- if and .Values.central.include .Values.oidc.include .Values.oidc.keycloakClient.include }}
{{- $centralUrl := printf "https://central-%s.%s" .Values.central.namespace .Values.cluster.baseDomain }}
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakRealmImport
metadata:
  name: {{ .Values.oidc.keycloakClient.realmImportName | default (printf "acs-%s" .Values.oidc.keycloakClient.realm) }}
  namespace: {{ .Values.oidc.keycloakClient.namespace }}
spec:
  keycloakCRName: keycloak
  realm:
    id: {{ .Values.oidc.keycloakClient.realm }}
    realm: {{ .Values.oidc.keycloakClient.realm }}
    enabled: true
    clients:
      - clientId: {{ .Values.oidc.clientId }}
        enabled: true
        protocol: openid-connect
        clientAuthenticatorType: client-secret
        secret: {{ .Values.oidc.clientSecret }}
        publicClient: false
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        redirectUris:
          - '{{ $centralUrl }}/sso/providers/oidc/callback'
        webOrigins:
          - '{{ $centralUrl }}'
{{- end }}
