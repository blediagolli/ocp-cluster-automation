{{- if and .Values.securedCluster.include .Values.securedCluster.consolePlugin.include }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: acs-console-plugin
  namespace: {{ .Values.securedCluster.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: acs-console-plugin
  annotations:
    argocd.argoproj.io/sync-wave: "3"
rules:
  - apiGroups:
      - operator.openshift.io
    resources:
      - consoles
    verbs:
      - get
      - patch
  - apiGroups:
      - console.openshift.io
    resources:
      - consoleplugins
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: acs-console-plugin-binding
  annotations:
    argocd.argoproj.io/sync-wave: "3"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: acs-console-plugin
subjects:
  - kind: ServiceAccount
    name: acs-console-plugin
    namespace: {{ .Values.securedCluster.namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: acs-console-plugin
  namespace: {{ .Values.securedCluster.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: Replace=true
spec:
  backoffLimit: 4
  template:
    spec:
      serviceAccountName: acs-console-plugin
      restartPolicy: OnFailure
      containers:
        - name: enable-plugin
          image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
          command:
            - /bin/bash
            - -c
            - |
              PLUGIN="advanced-cluster-security"
              echo "Waiting for ConsolePlugin ${PLUGIN}..."
              until oc get consoleplugin "${PLUGIN}" &>/dev/null; do
                echo "ConsolePlugin ${PLUGIN} not yet available, retrying in 10s..."
                sleep 10
              done
              echo "ConsolePlugin ${PLUGIN} is available."

              CURRENT=$(oc get console.operator.openshift.io cluster -o jsonpath='{.spec.plugins}')
              if echo "${CURRENT}" | grep -q "${PLUGIN}"; then
                echo "Plugin ${PLUGIN} already registered."
              else
                echo "Enabling ${PLUGIN} console plugin..."
                oc patch console.operator.openshift.io cluster \
                  --type=json \
                  -p "[{\"op\": \"add\", \"path\": \"/spec/plugins/-\", \"value\": \"${PLUGIN}\"}]"
              fi

              CURRENT=$(oc get console.operator.openshift.io cluster -o jsonpath='{.spec.plugins}')
              echo "Current console plugins: ${CURRENT}"
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      terminationGracePeriodSeconds: 0
{{- end }}
