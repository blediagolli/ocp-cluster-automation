selfSignedIssuer:
  include: false
  name: selfsigned
caIssuer:
  include: false
  name: cluster-ca
  secretName: cluster-ca-key-pair
  duration: 17520h
  renewBefore: 2160h
caBundle:
  include: false
  configMapName: custom-ca-bundle
  namespace: openshift-config
acmeIssuer:
  include: false
  name: YOUR_CLUSTER_ISSUER
  server: https://acme-v02.api.YOUR_CLUSTER_ISSUER.org/directory
  email: ""
  privateKeySecretName: YOUR_CLUSTER_ISSUER-account-key
  dns01:
    region: us-east-1
    hostedZoneID: ""
    credentialsSecretName: cert-manager-dns01-credentials
    recursiveNameserversOnly: false
apiCert:
  include: false
  namespace: openshift-config
  duration: 8760h
  renewBefore: 720h
  issuerName: cluster-ca
ingressCert:
  include: false
  namespace: openshift-ingress
  duration: 8760h
  renewBefore: 720h
  issuerName: cluster-ca
