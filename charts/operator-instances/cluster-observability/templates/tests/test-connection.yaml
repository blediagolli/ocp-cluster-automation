apiVersion: v1
kind: Pod
metadata:
  name: "{{ .Release.Name }}-test"
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  serviceAccountName: default
  containers:
    - name: test
      image: registry.redhat.io/openshift4/ose-cli:latest
      command:
        - /bin/bash
        - -c
        - |
          FAILED=0
          {{- range $name := list "dashboards" "troubleshootingPanel" "distributedTracing" "logging" "monitoring" }}
          {{- $plugin := index $.Values.uiPlugins $name }}
          {{- if $plugin.include }}
          {{- $crName := $name }}
          {{- if eq $name "troubleshootingPanel" }}{{ $crName = "troubleshooting-panel" }}{{- end }}
          {{- if eq $name "distributedTracing" }}{{ $crName = "distributed-tracing" }}{{- end }}
          echo "--- Checking UIPlugin {{ $crName }} ---"
          STATUS=$(oc get uiplugin {{ $crName }} -o jsonpath='{.status.conditions[?(@.type=="Available")].status}' 2>/dev/null)
          if [ "$STATUS" = "True" ]; then
            echo "  PASS: UIPlugin {{ $crName }} Available=True"
          else
            echo "  FAIL: UIPlugin {{ $crName }} Available=$STATUS (expected True)"
            FAILED=1
          fi
          {{- end }}
          {{- end }}
          exit $FAILED
