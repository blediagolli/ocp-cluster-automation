{{- if .Values.uiPlugins.distributedTracing.include }}
apiVersion: observability.openshift.io/v1alpha1
kind: UIPlugin
metadata:
  name: distributed-tracing
spec:
  type: DistributedTracing
  {{- with .Values.uiPlugins.distributedTracing.timeout }}
  distributedTracing:
    timeout: {{ . }}
  {{- end }}
{{- end }}
