scanSetting:
  include: false
  name: default
  namespace: openshift-compliance
  # Automatically apply remediations from scan results
  autoApplyRemediations: false
  rawResultStorage:
    pvAccessModes:
      - ReadWriteOnce
    rotation: 3
    size: 1Gi
    tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/master
        operator: Exists
      - effect: NoExecute
        key: node.kubernetes.io/not-ready
        operator: Exists
        tolerationSeconds: 300
      - effect: NoExecute
        key: node.kubernetes.io/unreachable
        operator: Exists
        tolerationSeconds: 300
  roles:
    - master
    - worker
  scanTolerations:
    - operator: Exists
  schedule: "0 1 * * *"
  showNotApplicable: false
  strictNodeScan: true
scanSettingBinding:
  include: false
  name: stig
  namespace: openshift-compliance
  profiles:
    - name: ocp4-stig
      kind: Profile
      apiGroup: compliance.openshift.io/v1alpha1
    - name: ocp4-stig-node
      kind: Profile
      apiGroup: compliance.openshift.io/v1alpha1
    - name: rhcos4-stig
      kind: Profile
      apiGroup: compliance.openshift.io/v1alpha1
    # Additional profiles available:
    # - name: ocp4-cis
    #   kind: Profile
    #   apiGroup: compliance.openshift.io/v1alpha1
    # - name: ocp4-cis-node
    #   kind: Profile
    #   apiGroup: compliance.openshift.io/v1alpha1
    # - name: ocp4-pci-dss
    #   kind: Profile
    #   apiGroup: compliance.openshift.io/v1alpha1
    # Use kind: TailoredProfile to reference a tailored profile:
    # - name: custom-stig
    #   kind: TailoredProfile
    #   apiGroup: compliance.openshift.io/v1alpha1
