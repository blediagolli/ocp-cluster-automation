{{- if .Values.realm.include }}
{{- $clientList := list }}
{{- range $name, $client := .Values.realm.clients }}
{{- if $client.include }}
{{- $c := dict "clientId" $client.clientId "enabled" true "protocol" "openid-connect" "clientAuthenticatorType" "client-secret" "secret" $client.clientSecret "publicClient" $client.publicClient "standardFlowEnabled" $client.standardFlowEnabled "directAccessGrantsEnabled" $client.directAccessGrantsEnabled "redirectUris" $client.redirectUris "webOrigins" $client.webOrigins }}
{{- if $client.serviceAccountsEnabled }}
{{- $_ := set $c "serviceAccountsEnabled" $client.serviceAccountsEnabled }}
{{- end }}
{{- if $client.defaultClientScopes }}
{{- $_ := set $c "defaultClientScopes" $client.defaultClientScopes }}
{{- end }}
{{- if $client.optionalClientScopes }}
{{- $_ := set $c "optionalClientScopes" $client.optionalClientScopes }}
{{- end }}
{{- if $client.protocolMappers }}
{{- $_ := set $c "protocolMappers" $client.protocolMappers }}
{{- end }}
{{- $clientList = append $clientList $c }}
{{- end }}
{{- end }}
{{- $payload := dict "ifResourceExists" "OVERWRITE" "clients" $clientList }}
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-client-sync-{{ $payload | toJson | sha256sum | trunc 8 }}
  namespace: {{ .Values.keycloak.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: client-sync
          image: registry.redhat.io/openshift4/ose-cli:latest
          env:
            - name: KC_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.name }}-initial-admin
                  key: username
            - name: KC_ADMIN_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.name }}-initial-admin
                  key: password
          command:
            - /bin/bash
            - -e
            - -c
            - |
              KC_URL="https://{{ .Values.keycloak.name }}.{{ .Values.keycloak.namespace }}.svc.cluster.local:8443"
              REALM="{{ .Values.realm.name }}"

              for i in $(seq 1 30); do
                if curl -skf "$KC_URL/realms/master" > /dev/null 2>&1; then
                  echo "Keycloak is ready"
                  break
                fi
                echo "Waiting for Keycloak... ($i/30)"
                sleep 10
              done

              TOKEN=$(curl -skf "$KC_URL/realms/master/protocol/openid-connect/token" \
                -d "client_id=admin-cli" \
                -d "username=$KC_ADMIN_USER" \
                -d "password=$KC_ADMIN_PASS" \
                -d "grant_type=password" | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")

              HTTP_CODE=$(curl -sk -o /tmp/result.json -w "%{http_code}" -X POST "$KC_URL/admin/realms/$REALM/partialImport" \
                -H "Authorization: Bearer $TOKEN" \
                -H "Content-Type: application/json" \
                -d '{{ $payload | toJson }}')

              echo "HTTP $HTTP_CODE: $(cat /tmp/result.json)"

              if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
                echo "Client sync completed successfully"
              else
                echo "Client sync failed"
                exit 1
              fi
{{- end }}
