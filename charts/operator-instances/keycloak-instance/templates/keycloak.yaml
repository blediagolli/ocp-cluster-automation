{{- if .Values.keycloak.include }}
{{- $hostname := .Values.keycloak.hostname | default (printf "sso.%s" .Values.cluster.baseDomain) }}
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: {{ .Values.keycloak.name }}
  namespace: {{ .Values.keycloak.namespace }}
spec:
  instances: {{ .Values.keycloak.instances }}
  hostname:
    hostname: {{ $hostname }}
  {{- if .Values.keycloak.db.host }}
  db:
    vendor: {{ .Values.keycloak.db.vendor }}
    host: {{ .Values.keycloak.db.host }}
    database: {{ .Values.keycloak.db.database }}
    usernameSecret:
      name: {{ .Values.keycloak.db.usernameSecret.name }}
      key: {{ .Values.keycloak.db.usernameSecret.key }}
    passwordSecret:
      name: {{ .Values.keycloak.db.passwordSecret.name }}
      key: {{ .Values.keycloak.db.passwordSecret.key }}
  {{- end }}
{{- end }}
