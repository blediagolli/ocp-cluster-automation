{{- if .Values.realm.include }}
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakRealmImport
metadata:
  name: {{ .Values.realm.name }}
  namespace: {{ .Values.keycloak.namespace }}
spec:
  keycloakCRName: {{ .Values.keycloak.name }}
  realm:
    id: {{ .Values.realm.name }}
    realm: {{ .Values.realm.name }}
    enabled: true
    {{- with .Values.realm.groups }}
    groups:
      {{- range . }}
      - name: {{ .name }}
      {{- end }}
    {{- end }}
    {{- with .Values.realm.users }}
    users:
      {{- range . }}
      - username: {{ .username }}
        enabled: true
        {{- with .email }}
        email: {{ . }}
        emailVerified: true
        {{- end }}
        {{- with .firstName }}
        firstName: {{ . }}
        {{- end }}
        {{- with .lastName }}
        lastName: {{ . }}
        {{- end }}
        {{- with .credentials }}
        credentials:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .realmRoles }}
        realmRoles:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .groups }}
        groups:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- end }}
    {{- end }}
    clients:
      {{- range $name, $client := .Values.realm.clients }}
      {{- if $client.include }}
      - clientId: {{ $client.clientId }}
        enabled: true
        protocol: openid-connect
        clientAuthenticatorType: client-secret
        secret: {{ $client.clientSecret }}
        publicClient: {{ $client.publicClient }}
        standardFlowEnabled: {{ $client.standardFlowEnabled }}
        directAccessGrantsEnabled: {{ $client.directAccessGrantsEnabled }}
        {{- with $client.serviceAccountsEnabled }}
        serviceAccountsEnabled: {{ . }}
        {{- end }}
        redirectUris:
          {{- toYaml $client.redirectUris | nindent 10 }}
        webOrigins:
          {{- toYaml $client.webOrigins | nindent 10 }}
        {{- with $client.defaultClientScopes }}
        defaultClientScopes:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $client.optionalClientScopes }}
        optionalClientScopes:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $client.protocolMappers }}
        protocolMappers:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- end }}
      {{- end }}
{{- end }}
