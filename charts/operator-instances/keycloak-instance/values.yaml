keycloak:
  include: false
  createNamespace: false
  name: keycloak
  namespace: keycloak
  instances: 1
  hostname: ""
  db:
    vendor: postgres
    host: ""
    database: keycloak
    usernameSecret:
      name: ""
      key: username
    passwordSecret:
      name: ""
      key: password

realm:
  include: false
  name: sso
  clients:
