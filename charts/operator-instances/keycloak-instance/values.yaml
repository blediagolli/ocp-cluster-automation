      include: false
      clientId: quay
      clientSecret: ""
      publicClient: false
      standardFlowEnabled: true
      directAccessGrantsEnabled: false
      redirectUris: []
      webOrigins: []
    stackrox:
      include: false
      clientId: stackrox
      clientSecret: ""
      publicClient: false
      standardFlowEnabled: true
      directAccessGrantsEnabled: false
      redirectUris: []
      webOrigins: []
