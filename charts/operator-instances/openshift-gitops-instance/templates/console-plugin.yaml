{{- if .Values.consolePlugin.include }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitops-console-plugin
  namespace: {{ .Values.argocd.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gitops-console-plugin
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
rules:
  - apiGroups:
      - operator.openshift.io
    resources:
      - consoles
    verbs:
      - get
      - patch
  - apiGroups:
      - console.openshift.io
    resources:
      - consoleplugins
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gitops-console-plugin-binding
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gitops-console-plugin
subjects:
  - kind: ServiceAccount
    name: gitops-console-plugin
    namespace: {{ .Values.argocd.namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gitops-console-plugin
  namespace: {{ .Values.argocd.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      serviceAccountName: gitops-console-plugin
      restartPolicy: OnFailure
      containers:
        - name: enable-plugin
          image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
          command:
            - /bin/bash
            - -c
            - |
              {{- range .Values.consolePlugin.plugins }}
              echo "Waiting for ConsolePlugin {{ . }}..."
              until oc get consoleplugin "{{ . }}" &>/dev/null; do
                echo "ConsolePlugin {{ . }} not yet available, retrying in 10s..."
                sleep 10
              done
              echo "ConsolePlugin {{ . }} is available."

              echo "Enabling {{ . }} console plugin..."
              oc patch console.operator.openshift.io cluster \
                --type=json \
                -p '[{"op": "add", "path": "/spec/plugins/-", "value": "{{ . }}"}]' 2>/dev/null || true
              {{- end }}

              CURRENT=$(oc get console.operator.openshift.io cluster -o jsonpath='{.spec.plugins}')
              echo "Current console plugins: ${CURRENT}"
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      terminationGracePeriodSeconds: 0
{{- end }}
