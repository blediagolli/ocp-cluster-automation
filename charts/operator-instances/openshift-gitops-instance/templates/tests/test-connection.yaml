apiVersion: v1
kind: Pod
metadata:
  name: "{{ .Release.Name }}-test"
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  serviceAccountName: default
  containers:
    - name: test
      image: registry.redhat.io/openshift4/ose-cli:latest
      command:
        - /bin/bash
        - -c
        - |
          FAILED=0
          {{- if .Values.argocd.include }}
          echo "--- Checking ArgoCD CR ---"
          PHASE=$(oc get argocd {{ .Values.argocd.name }} -n {{ .Values.argocd.namespace }} -o jsonpath='{.status.phase}' 2>/dev/null)
          if [ "$PHASE" = "Available" ]; then
            echo "  PASS: ArgoCD {{ .Values.argocd.name }} phase=Available"
          else
            echo "  FAIL: ArgoCD {{ .Values.argocd.name }} phase=$PHASE (expected Available)"
            FAILED=1
          fi
          {{- end }}
          {{- if .Values.appProject.include }}
          echo "--- Checking AppProject ---"
          if oc get appproject {{ .Values.appProject.name }} -n {{ .Values.argocd.namespace }} &>/dev/null; then
            echo "  PASS: AppProject {{ .Values.appProject.name }} exists"
          else
            echo "  FAIL: AppProject {{ .Values.appProject.name }} not found"
            FAILED=1
          fi
          {{- end }}
          exit $FAILED
