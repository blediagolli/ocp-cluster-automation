{{- if .Values.quayRegistry.include }}
apiVersion: quay.redhat.com/v1
kind: QuayRegistry
metadata:
  name: {{ .Values.quayRegistry.name }}
  namespace: {{ .Values.quayRegistry.namespace }}
spec:
  configBundleSecret: quay-registry-config-bundle
  components:
    - kind: quay
      managed: {{ .Values.quayRegistry.components.quay.managed }}
      {{- if .Values.quayRegistry.components.quay.managed }}
      overrides:
        replicas: {{ .Values.quayRegistry.components.quay.replicas }}
        {{- with .Values.quayRegistry.components.quay.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- if .Values.quayRegistry.scheduling.include }}
        {{- with .Values.quayRegistry.scheduling.affinity }}
        affinity:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.quayRegistry.scheduling.tolerations }}
        tolerations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- end }}
      {{- end }}
    - kind: clair
      managed: {{ .Values.quayRegistry.components.clair.managed }}
      {{- if .Values.quayRegistry.components.clair.managed }}
      overrides:
        {{- with .Values.quayRegistry.components.clair.replicas }}
        replicas: {{ . }}
        {{- end }}
        {{- with .Values.quayRegistry.components.clair.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- if .Values.quayRegistry.scheduling.include }}
        {{- with .Values.quayRegistry.scheduling.affinity }}
        affinity:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.quayRegistry.scheduling.tolerations }}
        tolerations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- end }}
      {{- end }}
    - kind: clairpostgres
      managed: {{ .Values.quayRegistry.components.clairPostgres.managed }}
      {{- if .Values.quayRegistry.components.clairPostgres.managed }}
      overrides:
        {{- with .Values.quayRegistry.components.clairPostgres.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.quayRegistry.components.clairPostgres.volumeSize }}
        volumeSize: {{ . }}
        {{- end }}
        {{- if .Values.quayRegistry.scheduling.include }}
        {{- with .Values.quayRegistry.scheduling.affinity }}
        affinity:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.quayRegistry.scheduling.tolerations }}
        tolerations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- end }}
      {{- end }}
    - kind: postgres
      managed: {{ .Values.quayRegistry.components.postgres.managed }}
      {{- if .Values.quayRegistry.components.postgres.managed }}
      overrides:
        {{- with .Values.quayRegistry.components.postgres.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.quayRegistry.components.postgres.volumeSize }}
        volumeSize: {{ . }}
        {{- end }}
        {{- if .Values.quayRegistry.scheduling.include }}
        {{- with .Values.quayRegistry.scheduling.affinity }}
        affinity:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.quayRegistry.scheduling.tolerations }}
        tolerations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- end }}
      {{- end }}
    - kind: objectstorage
      {{- if .Values.quayRegistry.externalStorage.include }}
      managed: false
      {{- else }}
      managed: {{ .Values.quayRegistry.components.objectstorage.managed }}
      {{- end }}
      {{- if and .Values.quayRegistry.components.objectstorage.managed (not .Values.quayRegistry.externalStorage.include) .Values.quayRegistry.scheduling.include }}
      overrides:
        {{- with .Values.quayRegistry.scheduling.affinity }}
        affinity:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.quayRegistry.scheduling.tolerations }}
        tolerations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- end }}
    - kind: redis
      managed: {{ .Values.quayRegistry.components.redis.managed }}
      {{- if .Values.quayRegistry.components.redis.managed }}
      overrides:
        {{- with .Values.quayRegistry.components.redis.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- if .Values.quayRegistry.scheduling.include }}
        {{- with .Values.quayRegistry.scheduling.affinity }}
        affinity:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.quayRegistry.scheduling.tolerations }}
        tolerations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- end }}
      {{- end }}
    - kind: horizontalpodautoscaler
      managed: {{ .Values.quayRegistry.components.hpa.managed }}
    - kind: route
      managed: {{ .Values.quayRegistry.components.route.managed }}
    - kind: mirror
      managed: {{ .Values.quayRegistry.components.mirror.managed }}
      {{- if .Values.quayRegistry.components.mirror.managed }}
      overrides:
        {{- with .Values.quayRegistry.components.mirror.replicas }}
        replicas: {{ . }}
        {{- end }}
        {{- with .Values.quayRegistry.components.mirror.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- if .Values.quayRegistry.scheduling.include }}
        {{- with .Values.quayRegistry.scheduling.affinity }}
        affinity:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.quayRegistry.scheduling.tolerations }}
        tolerations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- end }}
      {{- end }}
    - kind: monitoring
      managed: {{ .Values.quayRegistry.components.monitoring.managed }}
    - kind: tls
      {{- if .Values.quayRegistry.customTls.include }}
      managed: false
      {{- else }}
      managed: {{ .Values.quayRegistry.components.tls.managed }}
      {{- end }}
{{- end }}
