{{- $v := index .Values .Chart.Name }}
{{- if and $v.objectStorage.include $v.multiClusterObservability.include }}
{{- if $v.objectStorage.objectBucketClaim.include }}
apiVersion: batch/v1
kind: Job
metadata:
  name: observability-wire-thanos-secret
  namespace: {{ $v.multiClusterObservability.namespace }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 10
  template:
    spec:
      serviceAccountName: observability-setup
      restartPolicy: OnFailure
      containers:
        - name: wire-thanos
          image: {{ $v.setupImage | default "registry.redhat.io/openshift4/ose-cli:latest" }}
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              TARGET_NS="{{ $v.multiClusterObservability.namespace }}"
              OBC_NAME="{{ $v.objectStorage.objectBucketClaim.name }}"
              SECRET_NAME="{{ $v.objectStorage.secretName }}"
              CA_FILE="{{ $v.objectStorage.httpConfig.tlsConfig.caFile }}"

              echo "Waiting for OBC ${OBC_NAME} to be Bound..."
              for i in $(seq 1 60); do
                PHASE=$(oc get obc "${OBC_NAME}" -n "${TARGET_NS}" -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
                if [ "${PHASE}" = "Bound" ]; then
                  echo "OBC is Bound."
                  break
                fi
                echo "  OBC phase: ${PHASE:-NotFound}, waiting..."
                sleep 5
              done

              if [ "${PHASE}" != "Bound" ]; then
                echo "ERROR: OBC did not reach Bound state"
                exit 1
              fi

              ACCESS_KEY=$(oc get secret "${OBC_NAME}" -n "${TARGET_NS}" -o jsonpath='{.data.AWS_ACCESS_KEY_ID}' | base64 -d)
              SECRET_KEY=$(oc get secret "${OBC_NAME}" -n "${TARGET_NS}" -o jsonpath='{.data.AWS_SECRET_ACCESS_KEY}' | base64 -d)
              BUCKET=$(oc get configmap "${OBC_NAME}" -n "${TARGET_NS}" -o jsonpath='{.data.BUCKET_NAME}')
              HOST=$(oc get configmap "${OBC_NAME}" -n "${TARGET_NS}" -o jsonpath='{.data.BUCKET_HOST}')
              PORT=$(oc get configmap "${OBC_NAME}" -n "${TARGET_NS}" -o jsonpath='{.data.BUCKET_PORT}')
              ENDPOINT="${HOST}:${PORT}"

              echo "Bucket: ${BUCKET}"
              echo "Endpoint: ${ENDPOINT}"

              cat <<EOSECRET | oc apply -f -
              apiVersion: v1
              kind: Secret
              metadata:
                name: ${SECRET_NAME}
                namespace: ${TARGET_NS}
              type: Opaque
              stringData:
                thanos.yaml: |
                  type: s3
                  config:
                    bucket: ${BUCKET}
                    endpoint: ${ENDPOINT}
                    insecure: false
                    access_key: ${ACCESS_KEY}
                    secret_key: ${SECRET_KEY}
                    http_config:
                      tls_config:
                        ca_file: ${CA_FILE}
              EOSECRET
              echo "Thanos secret created from OBC credentials."
{{- else }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $v.objectStorage.secretName }}
  namespace: {{ $v.multiClusterObservability.namespace }}
type: Opaque
stringData:
  thanos.yaml: |
    type: s3
    config:
      bucket: {{ $v.objectStorage.bucket }}
      endpoint: {{ $v.objectStorage.endpoint }}
      insecure: {{ $v.objectStorage.insecure | toString | lower }}
      access_key: {{ $v.objectStorage.accessKey }}
      secret_key: {{ $v.objectStorage.secretKey }}
      http_config:
        tls_config:
          ca_file: {{ $v.objectStorage.httpConfig.tlsConfig.caFile }}
{{- end }}
{{- end }}
