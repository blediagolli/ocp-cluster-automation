{{- $v := index .Values .Chart.Name }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ .Release.Name }}-mch-test"
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  serviceAccountName: default
  containers:
    - name: test
      image: registry.redhat.io/openshift4/ose-cli:latest
      command:
        - /bin/bash
        - -c
        - |
          FAILED=0
          {{- if $v.multiClusterHub.include }}
          echo "--- Checking MultiClusterHub ---"
          PHASE=$(oc get multiclusterhub {{ $v.multiClusterHub.name }} -n {{ $v.multiClusterHub.namespace }} -o jsonpath='{.status.phase}' 2>/dev/null)
          if [ "$PHASE" = "Running" ]; then
            echo "  PASS: MCH {{ $v.multiClusterHub.name }} phase=Running"
          else
            echo "  FAIL: MCH {{ $v.multiClusterHub.name }} phase=$PHASE (expected Running)"
            FAILED=1
          fi
          {{- end }}
          {{- if $v.gitopsCluster.include }}
          echo "--- Checking GitOpsCluster ---"
          if oc get gitopscluster {{ $v.gitopsCluster.name }} -n {{ $v.gitopsCluster.argoNamespace }} &>/dev/null; then
            echo "  PASS: GitOpsCluster {{ $v.gitopsCluster.name }} exists"
          else
            echo "  FAIL: GitOpsCluster {{ $v.gitopsCluster.name }} not found"
            FAILED=1
          fi
          {{- end }}
          exit $FAILED
