{{- $v := index .Values .Chart.Name }}
{{- if $v.defaultTLS.include }}
{{- $s := $v.defaultTLS.secret }}
{{- if eq $s.source "externalSecret" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $v.defaultTLS.secretName }}
  namespace: {{ $v.central.namespace }}
spec:
  refreshInterval: {{ $s.refreshInterval }}
  secretStoreRef:
    {{- toYaml $s.secretStoreRef | nindent 4 }}
  target:
    name: {{ $v.defaultTLS.secretName }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      {{- /* type only. With no template.data, ESO writes the fetched keys
             straight through under the secretKey names below. */}}
      type: kubernetes.io/tls
  data:
    {{- range $s.properties }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ required "advanced-cluster-security.defaultTLS.secret.path is required when source is externalSecret" $s.path }}
        property: {{ .property | default .secretKey }}
    {{- end }}
{{- else if eq $s.source "inline" }}
{{- $data := $s.data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $v.defaultTLS.secretName }}
  namespace: {{ $v.central.namespace }}
type: kubernetes.io/tls
stringData:
  tls.crt: {{ required "advanced-cluster-security.defaultTLS.secret.data.\"tls.crt\" is required when source is inline" (index $data "tls.crt") | quote }}
  tls.key: {{ required "advanced-cluster-security.defaultTLS.secret.data.\"tls.key\" is required when source is inline" (index $data "tls.key") | quote }}
{{- else if ne $s.source "existing" }}
{{- fail (printf "advanced-cluster-security.defaultTLS.secret.source: expected existing, externalSecret or inline — got %q" $s.source) }}
{{- end }}
{{- end }}
