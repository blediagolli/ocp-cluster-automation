{{- $v := index .Values .Chart.Name }}
{{- if and $v.costManagementMetrics.include (eq $v.costManagementMetrics.authentication.type "service-account") }}
{{- $s := $v.costManagementMetrics.secret }}
{{- $name := $v.costManagementMetrics.authentication.secretName }}
{{- $ns := $v.costManagementMetrics.namespace }}
{{- /* The operator reads client_id and client_secret with UNDERSCORES. The
       Cost Management UI's oauth2-proxy Secret on the server side uses
       client-id and client-secret with hyphens for the same two values, and
       the two are not interchangeable — hence the explicit secretKey names
       in values rather than letting the backend's property names through.

       The clientId is not a secret, so it is written here as a literal and
       only client_secret is fetched. Listing client_id in `properties`
       instead moves it to the backend, and then the literal has to go or the
       two would both claim the key. */}}
{{- $fetchesClientId := false }}
{{- range ($s.properties | default list) }}
{{- if eq .secretKey "client_id" }}{{- $fetchesClientId = true }}{{- end }}
{{- end }}
{{- if eq $s.source "externalSecret" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
spec:
  refreshInterval: {{ $s.refreshInterval }}
  secretStoreRef:
    {{- toYaml $s.secretStoreRef | nindent 4 }}
  target:
    name: {{ $name }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        {{- if not $fetchesClientId }}
        client_id: {{ $v.costManagementMetrics.authentication.clientId | quote }}
        {{- end }}
        {{- /* One ESO placeholder per fetched key, filled at sync time. The
               printf is what keeps Helm from expanding it. */}}
        {{- range $s.properties }}
        {{ .secretKey }}: {{ printf "{{ .%s }}" .secretKey | quote }}
        {{- end }}
  data:
    {{- range $s.properties }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ required "cost-management-metrics.costManagementMetrics.secret.path is required when source is externalSecret" $s.path }}
        property: {{ .property | default .secretKey }}
    {{- end }}
{{- else if eq $s.source "inline" }}
{{- $data := $s.data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
stringData:
  {{- /* No backend here, so clientId is always the literal from values. */}}
  client_id: {{ $v.costManagementMetrics.authentication.clientId | quote }}
  client_secret: {{ required "cost-management-metrics.costManagementMetrics.secret.data.client_secret is required when source is inline" $data.client_secret | quote }}
{{- else if ne $s.source "existing" }}
{{- fail (printf "cost-management-metrics.costManagementMetrics.secret.source: expected existing, externalSecret or inline — got %q" $s.source) }}
{{- end }}
{{- end }}
