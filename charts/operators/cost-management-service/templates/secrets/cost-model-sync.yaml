{{- $v := index .Values .Chart.Name }}
{{- $cms := $v.costManagementService }}
{{- if and $cms.include $cms.costModel.include }}
{{- $s := $cms.costModel.auth.secret }}
{{- $name := $cms.costModel.auth.secretName }}
{{- /* Service-account credentials for the cost model sync Job. Underscored
       keys, matching what the Metrics Operator's own Secret uses, because by
       default this is the same Keycloak client — the Job just needs a copy in
       this namespace, since a pod cannot mount a Secret from another one.

       Same backend property as that copy on purpose: two properties would be
       two things to rotate, and a stale one shows up only as invalid_client. */}}
{{- if eq $s.source "externalSecret" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ $cms.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: {{ $s.refreshInterval }}
  secretStoreRef:
    {{- toYaml $s.secretStoreRef | nindent 4 }}
  target:
    name: {{ $name }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        client_id: {{ $cms.costModel.auth.clientId | quote }}
        client_secret: "{{ `{{ .client_secret }}` }}"
  data:
    {{- range $s.properties }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ required "cost-management-service.costModel.auth.secret.path is required when source is externalSecret" $s.path }}
        property: {{ .property | default .secretKey }}
    {{- end }}
{{- else if eq $s.source "inline" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $cms.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
stringData:
  client_id: {{ $cms.costModel.auth.clientId | quote }}
  client_secret: {{ required "cost-management-service.costModel.auth.secret.data.client_secret is required when source is inline" ($s.data | default dict).client_secret | quote }}
{{- else if ne $s.source "existing" }}
{{- fail (printf "cost-management-service.costModel.auth.secret.source: expected existing, externalSecret or inline — got %q" $s.source) }}
{{- end }}
{{- end }}
