{{- $v := index .Values .Chart.Name }}
{{- $cms := $v.costManagementService }}
{{- /* Object storage, for the external-S3 path only. Key names are fixed by
       the CRD as access-key / secret-key — not the AWS_* spelling an OBC
       uses. On the bundled path Discovery finds the OBC's own Secret and
       none of this runs. */}}
{{- if and $cms.include (not $cms.objectStorage.include) }}
{{- $s := $cms.objectStorage.secret }}
{{- if and (ne $s.source "existing") (not $cms.objectStorage.secretName) }}
{{- fail "costManagementService.objectStorage.secretName is required when objectStorage.include is false — the CR has to name the Secret, and Discovery only fills it in on the bundled-OBC path." }}
{{- end }}
{{- if eq $s.source "externalSecret" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $cms.objectStorage.secretName }}
  namespace: {{ $cms.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: {{ $s.refreshInterval }}
  secretStoreRef:
    {{- toYaml $s.secretStoreRef | nindent 4 }}
  target:
    name: {{ $cms.objectStorage.secretName }}
    creationPolicy: Owner
  data:
    {{- range $s.properties }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ required "cost-management-service.objectStorage.secret.path is required when source is externalSecret" $s.path }}
        property: {{ .property | default .secretKey }}
    {{- end }}
{{- else if eq $s.source "inline" }}
{{- $data := $s.data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $cms.objectStorage.secretName }}
  namespace: {{ $cms.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
stringData:
  access-key: {{ required "cost-management-service.objectStorage.secret.data.access-key is required when source is inline" (index $data "access-key") | quote }}
  secret-key: {{ required "cost-management-service.objectStorage.secret.data.secret-key is required when source is inline" (index $data "secret-key") | quote }}
{{- else if ne $s.source "existing" }}
{{- fail (printf "cost-management-service.objectStorage.secret.source: expected existing, externalSecret or inline — got %q" $s.source) }}
{{- end }}
{{- end }}
