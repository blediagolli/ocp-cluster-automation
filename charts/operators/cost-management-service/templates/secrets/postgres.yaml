{{- $v := index .Values .Chart.Name }}
{{- $cms := $v.costManagementService }}
{{- if $cms.include }}
{{- $s := $cms.postgres.secret }}
{{- /* The database Secret the CR points at. Its key names are fixed by the
       CRD, not by us: koku-user, koku-password, rbac-user, rbac-password,
       plus ros-* and kruize-* when ros.enabled. postgres-user and
       postgres-password are only read by the bundled-Postgres init path, but
       the bootstrap Job needs the owner credentials anyway and this is the
       Secret that already carries them.

       Usernames are not fetched: the bootstrap Job and the CNPG Cluster both
       need them at render time, and a username is not a secret. Same split
       the keycloak chart uses.

       Note the two spellings. The Secret's keys are hyphenated because the
       CRD says so (koku-password); the fetched keys are underscored
       (koku_password) because that is what the ESO placeholders and the
       inline `data` map use. */}}
{{- $roles := include "cost-management-service.dbRoles" $ | fromYamlArray }}
{{- /* basic-auth is not cosmetic: CNPG rejects an Opaque Secret for the owner
       credentials. The extra keys ride along fine. */}}
{{- if eq $s.source "externalSecret" }}
{{- $path := required "cost-management-service.postgres.secret.path is required when source is externalSecret" $s.path }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $cms.postgres.secretName }}
  namespace: {{ $cms.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: {{ $s.refreshInterval }}
  secretStoreRef:
    {{- toYaml $s.secretStoreRef | nindent 4 }}
  target:
    name: {{ $cms.postgres.secretName }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        {{- /* Backticks and printf keep Helm from expanding these: they are
               ESO placeholders, filled at sync time from the keys below. */}}
        username: {{ $cms.postgres.username | quote }}
        password: "{{ `{{ .password }}` }}"
        postgres-user: {{ $cms.postgres.username | quote }}
        postgres-password: "{{ `{{ .password }}` }}"
        {{- range $roles }}
        {{ .userKey }}: {{ .user | quote }}
        {{ .userKey | replace "-user" "-password" }}: {{ printf "{{ .%s }}" (.userKey | replace "-user" "_password") | quote }}
        {{- end }}
  data:
    - secretKey: password
      remoteRef:
        key: {{ $path }}
        property: {{ $s.passwordProperty | default "password" }}
    {{- range $roles }}
    - secretKey: {{ .userKey | replace "-user" "_password" }}
      remoteRef:
        key: {{ $path }}
        property: {{ .passwordProperty }}
    {{- end }}
{{- else if eq $s.source "inline" }}
{{- $data := $s.data | default dict }}
{{- $password := required "cost-management-service.postgres.secret.data.password is required when source is inline" $data.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $cms.postgres.secretName }}
  namespace: {{ $cms.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
type: kubernetes.io/basic-auth
stringData:
  username: {{ $cms.postgres.username | quote }}
  password: {{ $password | quote }}
  postgres-user: {{ $cms.postgres.username | quote }}
  postgres-password: {{ $password | quote }}
  {{- range $roles }}
  {{- $key := .userKey | replace "-user" "_password" }}
  {{ .userKey }}: {{ .user | quote }}
  {{ .userKey | replace "-user" "-password" }}: {{ required (printf "cost-management-service.postgres.secret.data.%s is required when source is inline" $key) (index $data $key) | quote }}
  {{- end }}
{{- else if ne $s.source "existing" }}
{{- fail (printf "cost-management-service.postgres.secret.source: expected existing, externalSecret or inline — got %q" $s.source) }}
{{- end }}
{{- end }}
