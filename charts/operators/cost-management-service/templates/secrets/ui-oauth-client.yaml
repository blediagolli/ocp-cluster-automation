{{- $v := index .Values .Chart.Name }}
{{- $cms := $v.costManagementService }}
{{- if $cms.include }}
{{- $s := $cms.ui.secret }}
{{- $name := include "cost-management-service.uiOauthSecretName" . }}
{{- /* UI oauth2-proxy client. Hyphenated keys, fixed by the CRD. The same
       backend property backs the keycloak chart's cost-management-ui client,
       so issuer and consumer cannot drift.

       The client ID is written here, not fetched: it is not a secret and it
       has to match the keycloak chart's clientId, which is also templated.
       Keeping it out of the backend means there is one place it can be
       wrong, not two. */}}
{{- if eq $s.source "externalSecret" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ $cms.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: {{ $s.refreshInterval }}
  secretStoreRef:
    {{- toYaml $s.secretStoreRef | nindent 4 }}
  target:
    name: {{ $name }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        client-id: {{ $cms.ui.clientId | quote }}
        client-secret: "{{ `{{ .client_secret }}` }}"
  data:
    {{- range $s.properties }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ required "cost-management-service.ui.secret.path is required when source is externalSecret" $s.path }}
        property: {{ .property | default .secretKey }}
    {{- end }}
{{- else if eq $s.source "inline" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $cms.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
stringData:
  client-id: {{ $cms.ui.clientId | quote }}
  client-secret: {{ required "cost-management-service.ui.secret.data.client_secret is required when source is inline" ($s.data | default dict).client_secret | quote }}
{{- else if ne $s.source "existing" }}
{{- fail (printf "cost-management-service.ui.secret.source: expected existing, externalSecret or inline — got %q" $s.source) }}
{{- end }}
{{- end }}
