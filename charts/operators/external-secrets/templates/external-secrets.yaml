{{- $v := index .Values .Chart.Name }}
{{- /* Arbitrary secrets, for values that have no chart of their own. Each
       entry reads the same as the secret blocks in every other chart — and
       the same entry works on a cluster with no secrets manager by switching
       `source` to inline.

       `include: false` still skips an entry outright. That is not the same as
       source: existing, which means "the Secret is someone else's job": an
       entry with include false is off, spec and all. */}}
{{- range $v.secrets }}
{{- if .include }}
{{- if eq .source "externalSecret" }}
{{- $path := required (printf "external-secrets.secrets[%s].path is required when source is externalSecret" .name) .path }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
spec:
  refreshInterval: {{ .refreshInterval | default "1h" }}
  secretStoreRef:
    {{- toYaml (.secretStoreRef | default $v.secretStoreRef) | nindent 4 }}
  target:
    name: {{ .name }}
    creationPolicy: Owner
    {{- with .type }}
    template:
      engineVersion: v2
      type: {{ . }}
    {{- end }}
  data:
    {{- range .properties }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ $path }}
        property: {{ .property | default .secretKey }}
    {{- end }}
{{- else if eq .source "inline" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
{{- with .type }}
type: {{ . }}
{{- end }}
stringData:
  {{- range $key, $value := .data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- else if ne .source "existing" }}
{{- fail (printf "external-secrets.secrets[%s].source: expected existing, externalSecret or inline — got %q" .name .source) }}
{{- end }}
{{- end }}
{{- end }}
