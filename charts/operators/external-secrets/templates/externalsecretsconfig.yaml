{{- $v := index .Values .Chart.Name }}
{{- if $v.externalSecretsConfig.include }}
# The Red Hat External Secrets Operator ships only a controller-manager. The
# controller that actually reconciles SecretStore / ExternalSecret resources is
# an operand, and it is not deployed until this singleton CR exists. Without
# it, ExternalSecrets and SecretStores are accepted by the API server and then
# sit with an empty status forever, which looks like a Vault problem but is not.
apiVersion: operator.openshift.io/v1alpha1
kind: ExternalSecretsConfig
metadata:
  # Cluster-scoped singleton; the operator only reconciles the one named cluster.
  name: cluster
  annotations:
    # Ahead of any ExternalSecret so the controller exists to reconcile them.
    argocd.argoproj.io/sync-wave: "-20"
spec:
  appConfig:
    logLevel: {{ $v.externalSecretsConfig.logLevel }}
    {{- with $v.externalSecretsConfig.operatingNamespace }}
    operatingNamespace: {{ . }}
    {{- end }}
    {{- with $v.externalSecretsConfig.nodeSelector }}
    nodeSelector:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $v.externalSecretsConfig.tolerations }}
    tolerations:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $v.externalSecretsConfig.resources }}
    resources:
      {{- toYaml . | nindent 6 }}
    {{- end }}
{{- end }}
