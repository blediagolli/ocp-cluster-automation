{{- $v := index .Values .Chart.Name }}
{{- if $v.postgres.include }}
{{- $s := $v.postgres.secret }}
{{- $name := include "keycloak.postgresSecretName" . }}
{{- $ns := include "operator.crNamespace" . }}
{{- /* Earliest wave: the StatefulSet (-5) and the Keycloak CR (0) both mount
       this Secret, and ESO needs a moment to reconcile it.

       username is not a secret, so it is written here rather than fetched —
       but it lands in the same Secret so the StatefulSet and the Keycloak CR
       reference one object. */}}
{{- if eq $s.source "externalSecret" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: {{ $s.refreshInterval }}
  secretStoreRef:
    {{- toYaml $s.secretStoreRef | nindent 4 }}
  target:
    name: {{ $name }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: {{ $v.postgres.username | quote }}
        {{- /* The backticks keep Helm from expanding this: it is an ESO
               template placeholder, substituted at sync time from the
               fetched key below. Same trick wherever ESO templates appear. */}}
        password: "{{ `{{ .password }}` }}"
  data:
    {{- range $s.properties }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ required "keycloak.postgres.secret.path is required when source is externalSecret" $s.path }}
        property: {{ .property | default .secretKey }}
    {{- end }}
{{- else if eq $s.source "inline" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
stringData:
  username: {{ $v.postgres.username | quote }}
  password: {{ required "keycloak.postgres.secret.data.password is required when source is inline" $s.data.password | quote }}
{{- else if ne $s.source "existing" }}
{{- fail (printf "keycloak.postgres.secret.source: expected existing, externalSecret or inline — got %q" $s.source) }}
{{- end }}
{{- end }}
