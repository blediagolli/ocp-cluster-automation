{{- $v := index .Values .Chart.Name }}
{{- if $v.realm.include }}
{{- $s := $v.realm.secret }}
{{- /* One credential per confidential client and one per user that should
       have a password. The key set is derived from the realm rather than
       written in values, so it is computed here and used by both modes. */}}
{{- $keys := list }}
{{- range $name, $client := $v.realm.clients }}
{{- if and $client.include (not $client.publicClient) }}
{{- $k := printf "client-%s" $name }}
{{- $keys = append $keys (dict "secretKey" $k "property" ($client.secretProperty | default $k)) }}
{{- end }}
{{- end }}
{{- range $v.realm.users }}
{{- if .passwordProperty }}
{{- $keys = append $keys (dict "secretKey" (printf "user-%s" .username) "property" .passwordProperty) }}
{{- end }}
{{- end }}
{{- if $keys }}
{{- $secretName := include "keycloak.realmSecretName" . }}
{{- $ns := include "operator.crNamespace" . }}
{{- if eq $s.source "externalSecret" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secretName }}
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: {{ $s.refreshInterval }}
  secretStoreRef:
    {{- toYaml $s.secretStoreRef | nindent 4 }}
  target:
    name: {{ $secretName }}
    creationPolicy: Owner
  data:
    {{- range $keys }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ required "keycloak.realm.secret.path is required when source is externalSecret" $s.path }}
        property: {{ .property }}
    {{- end }}
{{- else if eq $s.source "inline" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
stringData:
  {{- /* Every derived key has to be supplied. A missing one would mount as an
         empty value and the realm-sync Job would set that client secret to
         "", so it fails the render instead. */}}
  {{- $data := $s.data | default dict }}
  {{- range $keys }}
  {{ .secretKey }}: {{ required (printf "keycloak.realm.secret.data.%s is required when source is inline" .secretKey) (index $data .secretKey) | quote }}
  {{- end }}
{{- else if ne $s.source "existing" }}
{{- fail (printf "keycloak.realm.secret.source: expected existing, externalSecret or inline — got %q" $s.source) }}
{{- end }}
{{- end }}
{{- end }}
