{{- $v := index .Values .Chart.Name }}
{{- if $v.bgpPeers.include }}
{{- range $v.bgpPeers.peers }}
apiVersion: metallb.io/v1beta2
kind: BGPPeer
metadata:
  name: {{ .name }}
  namespace: {{ $v.metallb.namespace }}
spec:
  myASN: {{ .myASN }}
  peerASN: {{ .peerASN }}
  peerAddress: {{ .peerAddress }}
  {{- if .peerPort }}
  peerPort: {{ .peerPort }}
  {{- end }}
---
{{- end }}
{{- end }}
