{{- $v := index .Values .Chart.Name }}
{{- if $v.ipAddressPools.include }}
{{- range $v.ipAddressPools.pools }}
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: {{ .name }}
  namespace: {{ $v.metallb.namespace }}
spec:
  addresses:
    {{- range .addresses }}
    - {{ . }}
    {{- end }}
---
{{- end }}
{{- end }}
