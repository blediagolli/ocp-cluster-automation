{{- $v := index .Values .Chart.Name }}
{{- if $v.consolePlugins.include }}
{{- $ns := $v.consolePlugins.namespace | default $v.operator.namespace }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: odf-console-plugins
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: odf-console-plugins
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups:
      - operator.openshift.io
    resources:
      - consoles
    verbs:
      - get
      - patch
  - apiGroups:
      - console.openshift.io
    resources:
      - consoleplugins
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: odf-console-plugins-binding
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: odf-console-plugins
subjects:
  - kind: ServiceAccount
    name: odf-console-plugins
    namespace: {{ $ns }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: odf-console-plugins
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    # A Job's spec.selector is generated by the controller and immutable, so a
    # bare `kubectl replace` of a Job that already exists fails with
    # `spec.selector: Required value ... field is immutable`. Force makes it
    # replace --force, i.e. delete and recreate, which is what Replace meant
    # here all along. This Job is idempotent, so re-running it is free.
    argocd.argoproj.io/sync-options: Replace=true,Force=true
spec:
  backoffLimit: 4
  template:
    spec:
      serviceAccountName: odf-console-plugins
      restartPolicy: OnFailure
      containers:
        - name: enable-plugins
          image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
          command:
            - /bin/bash
            - -c
            - |
              set -o pipefail
              PLUGINS="{{ join " " $v.consolePlugins.plugins }}"
              # Bounded, unlike the equivalent job in the ACM chart. The
              # ConsolePlugin CRs are created by the ODF operator, so one that
              # never appears means the operator did not install or renamed its
              # plugin between releases. Hanging on that holds the Application
              # Progressing forever and reports nothing; failing says which
              # plugin and why.
              DEADLINE=$(( SECONDS + {{ int $v.consolePlugins.waitSeconds }} ))

              for plugin in $PLUGINS; do
                echo "Waiting for ConsolePlugin ${plugin}..."
                until oc get consoleplugin "${plugin}" &>/dev/null; do
                  if [ "${SECONDS}" -ge "${DEADLINE}" ]; then
                    echo "ERROR: ConsolePlugin ${plugin} did not appear within {{ int $v.consolePlugins.waitSeconds }}s."
                    echo "       The ODF operator creates it; check the CSV in {{ $ns }}"
                    echo "       and whether the plugin was renamed in this ODF release:"
                    oc get consoleplugin -o name || true
                    exit 1
                  fi
                  sleep 10
                done

                if oc get console.operator.openshift.io cluster \
                     -o jsonpath='{.spec.plugins}' | grep -q "\"${plugin}\""; then
                  echo "Plugin ${plugin} already registered."
                  continue
                fi

                echo "Enabling ${plugin} console plugin..."
                # `add` to /spec/plugins/- appends, but only if the array
                # exists. On a console that has never had a plugin the field is
                # absent and the op fails, so create it first. `test` guards the
                # create against clobbering a list that is already there.
                oc patch console.operator.openshift.io cluster --type=json -p \
                  '[{"op":"test","path":"/spec/plugins","value":null},{"op":"add","path":"/spec/plugins","value":[]}]' \
                  >/dev/null 2>&1 || true
                oc patch console.operator.openshift.io cluster --type=json -p \
                  "[{\"op\": \"add\", \"path\": \"/spec/plugins/-\", \"value\": \"${plugin}\"}]"

                # Verify rather than trust. The equivalent ACM job ends its
                # patch with `|| true`, which turns a rejected patch into a
                # successful Job and a plugin that silently never loads.
                if ! oc get console.operator.openshift.io cluster \
                       -o jsonpath='{.spec.plugins}' | grep -q "\"${plugin}\""; then
                  echo "ERROR: patch reported success but ${plugin} is not in .spec.plugins."
                  exit 1
                fi
              done

              echo "Current console plugins: $(oc get console.operator.openshift.io cluster -o jsonpath='{.spec.plugins}')"
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      terminationGracePeriodSeconds: 0
{{- end }}
