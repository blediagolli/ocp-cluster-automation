# Whether this chart installs its operator, or only configures one that is
# already there. Set per cluster in conf.yaml, which every operator
# Application reads; false drops the Namespace, OperatorGroup and
# Subscriptions and keeps the CRs. Replaces conf.yaml's deployOperators,
# which used to switch a whole Application on and off.
installOperators: true

# All of this chart's values nest under the chart name, so a shared
# operators.yaml can carry several operators without their `operator:`
# blocks colliding. A per-operator file uses the identical shape, which is
# what lets a block move between the two by cut-and-paste.
#
# The templates reach them with `index .Values .Chart.Name`, so the chart
# directory name and this top-level key must stay in step.
odf:
  operator:
    # --- facts about this operator, not settings ---
    # Values only so that namespace.yaml, operatorgroup.yaml and
    # subscription.yaml stay byte-identical across every chart under
    # charts/operators/. Overriding them per cluster is not meaningful.
    namespace: openshift-storage
    operatorGroup: openshift-storage-operator
    package: odf-operator
    sourceNamespace: openshift-marketplace
    # Does not support the AllNamespaces install mode: a global OperatorGroup
    # leaves the CSV Failed with UnsupportedOperatorGroup. Hence a dedicated
    # namespace and a targetNamespaces OperatorGroup.
    clusterScoped: false
    skipNamespace: false
    skipOperatorGroup: false
    namespaceLabels: {}
    namespaceAnnotations: {}

    # --- the parts you actually set ---
    channel: stable
    source: redhat-operators
    installPlanApproval: Automatic
    # Pin to a specific CSV instead of taking the channel head.
    startingCSV: ""

  # Namespace for the CRs below. Empty inherits operator.namespace.
  namespace: ""
  # Only consulted when namespace above differs from operator.namespace.
  createNamespace: false

  storageCluster:
    include: false
    name: ocs-storagecluster
    namespace: openshift-storage
    deviceSets:
      count: 1
      replicas: 3
      storageSize: 512Gi
      storageClassName: gp3-csi
    encryption:
      clusterWide: true
      # OSD key rotation. This becomes a CronJob schedule, so it must be five
      # cron fields or an "@" macro — "weekly" without the @ is rejected by the
      # CronJob API and silently wedges the OSD reconcile.
      keyRotationSchedule: "@weekly"
    resourceProfile: balanced
    # Which nodes ODF runs on. When empty, ODF requires nodes carrying
    # cluster.ocs.openshift.io/openshift-storage and its pods stay Pending until
    # something applies that label. Set a selector over labels the nodes already
    # have to avoid mutating Node objects outside of git.
    labelSelector: {}
  # Registers ODF's console plugins with the cluster console.
  #
  # The operator creates the ConsolePlugin objects on its own, but **does not
  # enable them** — `console.operator.openshift.io/cluster` `.spec.plugins` is a
  # single shared list that several operators append to, and nothing appends for
  # you outside the web console's install wizard, where it is the "Console
  # plugin: Enable" checkbox. Install the Subscription from git and the plugin
  # exists, is Available, and never loads. That is the whole reason this block
  # exists.
  #
  # It cannot be declared as a manifest for the same reason: the list is shared,
  # so owning it in git would fight whichever other chart added the last entry.
  # Hence a Job that appends, the same pattern as the acm and openshift-gitops
  # charts.
  consolePlugins:
    include: false
    # Both are real and separate. odf-console is the storage UI from
    # odf-operator; odf-client-console comes with the ocs-client-operator that
    # odf-operator pulls in as a dependency, and it appears a few minutes later
    # than the first. Listing a plugin that this ODF release does not ship makes
    # the Job fail rather than hang.
    plugins:
      - odf-console
      - odf-client-console
    # Empty inherits operator.namespace.
    namespace: ""
    # How long to wait for each ConsolePlugin to appear before failing. Measured
    # at 20-23 minutes from Subscription to both plugins existing on a cluster
    # installing ODF for the first time, so this is deliberately generous; it is
    # a deadline for "the operator is not coming", not a timeout for slowness.
    waitSeconds: 1800
  csiTolerations:
    include: false
    tolerations:
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
