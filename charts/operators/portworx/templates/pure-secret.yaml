{{- $v := index .Values .Chart.Name }}
{{- if $v.pureSecret.include }}
{{- $ps := $v.pureSecret }}
{{- $ns := include "operator.crNamespace" . }}

{{- /* pure.json is assembled from values, but every APIToken is left as an
       ESO placeholder rather than a real token: the arrays and their topology
       are configuration and belong in git, the credentials are not. ESO
       substitutes them at sync time from the path below.

       The token is carried through toJson as a __PXTOKEN__<key>__ sentinel
       and swapped for the ESO action afterwards, because the two escaping
       rules collide: toJson would turn the action's own quotes into \" and a
       backslash is a parse error inside a Go template action, so ESO would
       reject the template rather than render it. The sentinel is bare word
       characters, which toJson passes through untouched.

       The action is `index . "key"` rather than `.key` because tokenKeys are
       conventionally hyphenated and Go templates reject a hyphen in
       dot-notation field access.

       The result is not valid JSON until ESO substitutes, which is fine —
       ESO treats the template as text, and only the output has to parse. */}}
{{- $arrays := list }}
{{- $tokenKeys := list }}
{{- range $ps.flashArrays }}
  {{- $key := required "portworx.pureSecret.flashArrays[].tokenKey is required" .tokenKey }}
  {{- $entry := dict "MgmtEndPoint" (required "portworx.pureSecret.flashArrays[].endpoint is required" .endpoint)
                     "APIToken" (printf "__PXTOKEN__%s__" $key) }}
  {{- with .labels }}{{ $_ := set $entry "Labels" . }}{{ end }}
  {{- $arrays = append $arrays $entry }}
  {{- $tokenKeys = append $tokenKeys $key }}
{{- end }}
{{- $blades := list }}
{{- range $ps.flashBlades }}
  {{- $key := required "portworx.pureSecret.flashBlades[].tokenKey is required" .tokenKey }}
  {{- $entry := dict "MgmtEndPoint" (required "portworx.pureSecret.flashBlades[].endpoint is required" .endpoint)
                     "APIToken" (printf "__PXTOKEN__%s__" $key) }}
  {{- with .nfsEndpoint }}{{ $_ := set $entry "NFSEndPoint" . }}{{ end }}
  {{- $blades = append $blades $entry }}
  {{- $tokenKeys = append $tokenKeys $key }}
{{- end }}
{{- if and (not $arrays) (not $blades) }}
  {{- fail "portworx.pureSecret.include is true but neither flashArrays nor flashBlades has an entry — Portworx would start with a pure.json that names no backend" }}
{{- end }}
{{- $pureJson := dict }}
{{- with $arrays }}{{ $_ := set $pureJson "FlashArrays" . }}{{ end }}
{{- with $blades }}{{ $_ := set $pureJson "FlashBlades" . }}{{ end }}
{{- $rendered := toJson $pureJson }}
{{- range $tokenKeys }}
  {{- $rendered = $rendered | replace (printf "__PXTOKEN__%s__" .) (printf "{{ index . %q }}" .) }}
{{- end }}

{{- if eq $ps.source "externalSecret" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $ps.name }}
  namespace: {{ $ns }}
  annotations:
    {{- /* Ahead of the StorageCluster at wave 0: Portworx reads pure.json on
           startup and comes up with no backend if it is not there yet. */}}
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ $ps.externalSecret.refreshInterval }}
  secretStoreRef:
    {{- toYaml $ps.externalSecret.secretStoreRef | nindent 4 }}
  target:
    name: {{ $ps.name }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        pure.json: |
          {{- $rendered | nindent 10 }}
  data:
    {{- range $ps.flashArrays }}
    - secretKey: {{ .tokenKey }}
      remoteRef:
        key: {{ required "portworx.pureSecret.externalSecret.path is required when source is externalSecret" $ps.externalSecret.path }}
        property: {{ .tokenKey }}
    {{- end }}
    {{- range $ps.flashBlades }}
    - secretKey: {{ .tokenKey }}
      remoteRef:
        key: {{ required "portworx.pureSecret.externalSecret.path is required when source is externalSecret" $ps.externalSecret.path }}
        property: {{ .tokenKey }}
    {{- end }}
{{- else if ne $ps.source "existing" }}
{{- fail (printf "portworx.pureSecret.source: expected existing or externalSecret — got %q" $ps.source) }}
{{- end }}
{{- end }}
