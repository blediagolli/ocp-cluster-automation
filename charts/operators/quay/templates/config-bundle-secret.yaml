{{- $v := index .Values .Chart.Name }}
{{- /* The config bundle body is defined once and emitted into either a plain
       Secret or an ExternalSecret target template, depending on whether OIDC
       is on. When it is, the bundle carries the OIDC client secret, which
       lives in Vault next to the Keycloak realm that issued it — so ESO has
       to render the bundle and substitute the credential at sync time. */}}
{{- define "quay.configBundle" -}}
{{- $v := index .Values .Chart.Name -}}
{{- with $v.quayRegistry.config.serverHostname }}
SERVER_HOSTNAME: {{ . }}
PREFERRED_URL_SCHEME: https
{{- end }}
SUPER_USERS:
{{- range $v.quayRegistry.config.superUsers }}
  - {{ . }}
{{- end }}
FEATURE_USER_INITIALIZE: {{ $v.quayRegistry.config.userInitialize }}
FEATURE_USER_CREATION: {{ $v.quayRegistry.config.userCreation }}
FEATURE_DIRECT_LOGIN: {{ not $v.quayRegistry.oidc.include }}
FEATURE_GENERAL_OCI_SUPPORT: {{ $v.quayRegistry.config.ociSupport }}
FEATURE_ANONYMOUS_ACCESS: {{ $v.quayRegistry.config.anonymousAccess }}
FEATURE_PROXY_STORAGE: {{ $v.quayRegistry.config.proxyStorage }}
FEATURE_QUOTA_MANAGEMENT: {{ $v.quayRegistry.config.quotas.include }}
FEATURE_AUTO_PRUNE: {{ $v.quayRegistry.config.autoPrune }}
FEATURE_GARBAGE_COLLECTION: {{ $v.quayRegistry.config.garbageCollection }}
FEATURE_RATE_LIMITS: {{ $v.quayRegistry.config.rateLimits.include }}
{{- if $v.quayRegistry.config.teamSyncing.include }}
FEATURE_TEAM_SYNCING: true
FEATURE_NONSUPERUSER_TEAM_SYNCING_SETUP: {{ $v.quayRegistry.config.teamSyncing.nonSuperuserSetup }}
TEAM_RESYNC_STALE_TIME: {{ $v.quayRegistry.config.teamSyncing.resyncStaleTime }}
{{- else }}
FEATURE_TEAM_SYNCING: false
{{- end }}
{{- if $v.quayRegistry.config.actionLogRotation.include }}
FEATURE_ACTION_LOG_ROTATION: true
ACTION_LOG_ARCHIVE_PATH: {{ $v.quayRegistry.config.actionLogRotation.archivePath }}
ACTION_LOG_ARCHIVE_LOCATION: {{ $v.quayRegistry.config.actionLogRotation.archiveLocation }}
{{- else }}
FEATURE_ACTION_LOG_ROTATION: false
{{- end }}
{{- if $v.quayRegistry.components.mirror.managed }}
FEATURE_REPO_MIRROR: true
{{- end }}
DEFAULT_TAG_EXPIRATION: {{ $v.quayRegistry.config.tagExpiration.default }}
TAG_EXPIRATION_OPTIONS:
{{- range $v.quayRegistry.config.tagExpiration.options }}
  - {{ . }}
{{- end }}
ALLOW_PULLS_WITHOUT_STRICT_LOGGING: {{ $v.quayRegistry.config.allowPullsWithoutStrictLogging }}
BROWSER_API_CALLS_XHR_ONLY: {{ $v.quayRegistry.config.browserApiCallsXhrOnly }}
CREATE_PRIVATE_REPO_ON_PUSH: {{ $v.quayRegistry.config.createPrivateOnPush }}
{{- if $v.quayRegistry.config.restrictedUsers.include }}
FEATURE_RESTRICTED_USERS: true
RESTRICTED_USERS_WHITELIST:
{{- range $v.quayRegistry.config.restrictedUsers.whitelist }}
  - {{ . }}
{{- end }}
{{- end }}
{{- if $v.quayRegistry.config.quotas.include }}
DEFAULT_SYSTEM_REJECT_QUOTA_BYTES: {{ $v.quayRegistry.config.quotas.defaultSystemRejectBytes | int64 }}
{{- end }}
{{- if $v.quayRegistry.externalDatabase.include }}
DB_URI: postgresql://{{ $v.quayRegistry.externalDatabase.username }}:{{ $v.quayRegistry.externalDatabase.password }}@{{ $v.quayRegistry.externalDatabase.host }}:{{ $v.quayRegistry.externalDatabase.port }}/{{ $v.quayRegistry.externalDatabase.name }}?sslmode={{ $v.quayRegistry.externalDatabase.sslMode }}
{{- end }}
{{- if $v.quayRegistry.externalStorage.include }}
DISTRIBUTED_STORAGE_CONFIG:
  {{ $v.quayRegistry.externalStorage.storageName }}:
    - {{ $v.quayRegistry.externalStorage.type }}
    -
      {{- toYaml $v.quayRegistry.externalStorage.config | nindent 6 }}
DISTRIBUTED_STORAGE_DEFAULT_LOCATIONS:
  - {{ $v.quayRegistry.externalStorage.storageName }}
DISTRIBUTED_STORAGE_PREFERENCE:
  - {{ $v.quayRegistry.externalStorage.storageName }}
{{- end }}
{{- if $v.quayRegistry.oidc.include }}
{{ upper $v.quayRegistry.oidc.provider }}_LOGIN_CONFIG:
  CLIENT_ID: {{ $v.quayRegistry.oidc.clientId }}
  {{- /* Substituted by ESO from Vault, not by Helm — see the ExternalSecret below. */}}
  CLIENT_SECRET: {{ `{{ .clientSecret }}` }}
  OIDC_SERVER: {{ $v.quayRegistry.oidc.server }}
  SERVICE_NAME: {{ $v.quayRegistry.oidc.provider }}
  LOGIN_SCOPES:
  {{- range $v.quayRegistry.oidc.loginScopes }}
    - {{ . }}
  {{- end }}
  VERIFIED_EMAIL_CLAIM_NAME: {{ $v.quayRegistry.oidc.verifiedEmailClaimName }}
{{- end }}
{{- end }}
{{- if $v.quayRegistry.include }}
{{- $ns := $v.quayRegistry.namespace }}
{{- $tls := $v.quayRegistry.customTls }}
{{- $blob := include "quay.configBundle" . | trim }}
{{- /* The bundle is generated config, so the chart always produces it. Only
       the OIDC client secret inside it comes from anywhere else: with OIDC on
       the secret's source decides where, with OIDC off there is no
       placeholder in the bundle and it is a plain Secret regardless. */}}
{{- $s := ternary $v.quayRegistry.oidc.secret (dict "source" "inline") $v.quayRegistry.oidc.include }}
{{- if eq $s.source "externalSecret" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: quay-registry-config-bundle
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ $s.refreshInterval }}
  secretStoreRef:
    {{- toYaml $s.secretStoreRef | nindent 4 }}
  target:
    name: quay-registry-config-bundle
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        {{- /* The CLIENT_SECRET placeholder inside the bundle is left alone
               here; ESO fills it from the key fetched below at sync time. */}}
        config.yaml: |
          {{- $blob | nindent 10 }}
        {{- if $tls.include }}
        ssl.cert: |
          {{- $tls.cert | trim | nindent 10 }}
        ssl.key: |
          {{- $tls.key | trim | nindent 10 }}
        {{- end }}
  data:
    {{- range $s.properties }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ required "quay.quayRegistry.oidc.secret.path is required when source is externalSecret" $s.path }}
        property: {{ .property | default .secretKey }}
    {{- end }}
{{- else if eq $s.source "inline" }}
{{- if $v.quayRegistry.oidc.include }}
{{- $clientSecret := required "quay.quayRegistry.oidc.secret.data.clientSecret is required when source is inline" ($s.data | default dict).clientSecret }}
{{- $blob = $blob | replace "{{ .clientSecret }}" $clientSecret }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: quay-registry-config-bundle
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  config.yaml: |
    {{- $blob | nindent 4 }}
  {{- if $tls.include }}
  ssl.cert: |
    {{- $tls.cert | trim | nindent 4 }}
  ssl.key: |
    {{- $tls.key | trim | nindent 4 }}
  {{- end }}
{{- else if ne $s.source "existing" }}
{{- fail (printf "quay.quayRegistry.oidc.secret.source: expected existing, externalSecret or inline — got %q" $s.source) }}
{{- end }}
{{- end }}
