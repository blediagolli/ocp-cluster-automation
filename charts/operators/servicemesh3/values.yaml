# Whether this chart installs its operator, or only configures one that is
# already there. Set per cluster in conf.yaml, which every operator
# Application reads; false drops the Namespace, OperatorGroup and
# Subscriptions and keeps the CRs. Replaces conf.yaml's deployOperators,
# which used to switch a whole Application on and off.
installOperators: true

# All of this chart's values nest under the chart name, so a shared
# operators.yaml can carry several operators without their `operator:`
# blocks colliding. A per-operator file uses the identical shape, which is
# what lets a block move between the two by cut-and-paste.
#
# The templates reach them with `index .Values .Chart.Name`, so the chart
# directory name and this top-level key must stay in step.
servicemesh3:
  operator:
    # --- facts about this operator, not settings ---
    # Values only so that namespace.yaml, operatorgroup.yaml and
    # subscription.yaml stay byte-identical across every chart under
    # charts/operators/. Overriding them per cluster is not meaningful.
    namespace: openshift-operators
    operatorGroup: ""
    package: servicemeshoperator3
    sourceNamespace: openshift-marketplace
    # Installed into openshift-operators, which already exists and already
    # has a global OperatorGroup, so this chart creates neither.
    clusterScoped: false
    skipNamespace: true
    skipOperatorGroup: true
    namespaceLabels: {}
    namespaceAnnotations: {}

    # --- the parts you actually set ---
    # No catalogue default was ever recorded for this operator — the old
    # chart carried a change-me tripwire. The template `required`s it, so
    # the failure is at render rather than a Subscription that installs
    # nothing and reports no error.
    channel: ""
    source: redhat-operators
    installPlanApproval: Automatic
    # Pin to a specific CSV instead of taking the channel head.
    startingCSV: ""

  # Additional operators this capability needs, installed into the same
  # namespace. Subscription only — see templates/install/extra-subscriptions.yaml for
  # why they must not bring an OperatorGroup of their own. Each entry takes
  # the same keys as operator: above.
  extraOperators:
    # The Kiali CR below is a kiali-ossm CR, not a servicemeshoperator3 one.
    # Both install into openshift-operators, which already has its own global
    # OperatorGroup, so neither brings one.
    kiali:
      # Off by default, as the separate `kiali` entry in operator-deployment.yaml
      # was. A cluster that wants the Kiali CR turns this on with it.
      include: false
      package: kiali-ossm
      # No catalogue default was ever recorded — the old chart carried a
      # change-me tripwire.
      channel: ""
      source: redhat-operators
      sourceNamespace: openshift-marketplace
      installPlanApproval: Automatic
      startingCSV: ""

  # Namespace for the CRs below. Empty inherits operator.namespace.
  namespace: ""
  # Only consulted when namespace above differs from operator.namespace.
  createNamespace: false

  # ---- from charts/operator-instances/servicemesh3-instance ----
  mesh:
    include: false
    name: basic
    namespace: istio-system
    version: "3.0"
    mode: ambient
    addons:
      grafana:
        enabled: true
      jaeger:
        name: jaeger
        install:
          storage:
            type: Memory
            memory:
              maxTraces: 100000
          ingress:
            enabled: true
      kiali:
        enabled: true
        name: kiali
      prometheus:
        enabled: true
    gateways:
      egress:
        enabled: true
      ingress:
        enabled: true
        namespace: istio-system
        type: ClusterIP
    general:
      logging:
        componentLevels:
          default: info
      validationMessages: true
    proxy:
      logging:
        level: info
      networking:
        trafficControl:
          inbound: {}
          outbound:
            policy: ALLOW_ANY

  # ---- from charts/operator-instances/servicemesh-ambient ----
  istioCNI:
    include: false
    name: default
    namespace: istio-cni
    version: v1.28-latest
    profile: ambient
  istio:
    include: false
    name: default
    namespace: istio-system
    version: v1.28-latest
    profile: ambient
  ztunnel:
    include: false
    name: default
    namespace: ztunnel
    profile: ambient
  kiali:
    include: false
    name: kiali
    namespace: istio-system
    authStrategy: openshift
  namespaces:
    include: false
