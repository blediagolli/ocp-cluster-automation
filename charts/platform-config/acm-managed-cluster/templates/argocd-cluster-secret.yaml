{{- if and .Values.managedCluster.include .Values.managedCluster.autoImport.include }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.cluster.name }}-argocd-register
  namespace: {{ .Values.cluster.name }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ .Values.cluster.name }}-argocd-register
      containers:
        - name: register
          image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
          env:
            - name: CLUSTER_NAME
              value: {{ .Values.cluster.name }}
            - name: CLUSTER_SERVER
              value: {{ .Values.cluster.address }}
            - name: SECRET_NAME
              value: {{ .Values.managedCluster.autoImport.kubeconfig.secretName }}
            - name: GITOPS_NS
              value: openshift-gitops
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              echo "Checking if ArgoCD cluster secret already exists..."
              if oc get secret "${CLUSTER_NAME}-cluster-secret" -n "${GITOPS_NS}" &>/dev/null; then
                echo "ArgoCD cluster secret already exists, skipping."
                exit 0
              fi

              echo "Reading token from kubeconfig secret..."
              KUBECONFIG_RAW=$(oc get secret "${SECRET_NAME}" -n "${CLUSTER_NAME}" -o jsonpath='{.data.kubeconfig}' | base64 -d)
              TOKEN=$(echo "${KUBECONFIG_RAW}" | grep 'token:' | tail -1 | sed 's/.*token: *//')

              if [ -z "${TOKEN}" ]; then
                echo "ERROR: Could not extract token from kubeconfig secret"
                exit 1
              fi

              echo "Creating ArgoCD cluster secret for ${CLUSTER_NAME}..."
              cat <<EOSECRET | oc apply -f -
              apiVersion: v1
              kind: Secret
              metadata:
                name: ${CLUSTER_NAME}-cluster-secret
                namespace: ${GITOPS_NS}
                labels:
                  argocd.argoproj.io/secret-type: cluster
              type: Opaque
              stringData:
                name: ${CLUSTER_NAME}
                server: ${CLUSTER_SERVER}
                config: |
                  {
                    "bearerToken": "${TOKEN}",
                    "tlsClientConfig": {
                      "insecure": true
                    }
                  }
              EOSECRET
              echo "ArgoCD cluster secret created."
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      terminationGracePeriodSeconds: 0
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.cluster.name }}-argocd-register
  namespace: {{ .Values.cluster.name }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.cluster.name }}-argocd-register
  namespace: {{ .Values.cluster.name }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.cluster.name }}-argocd-register
  namespace: {{ .Values.cluster.name }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.cluster.name }}-argocd-register
subjects:
  - kind: ServiceAccount
    name: {{ .Values.cluster.name }}-argocd-register
    namespace: {{ .Values.cluster.name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.cluster.name }}-argocd-register
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.cluster.name }}-argocd-register
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.cluster.name }}-argocd-register
subjects:
  - kind: ServiceAccount
    name: {{ .Values.cluster.name }}-argocd-register
    namespace: {{ .Values.cluster.name }}
{{- end }}
