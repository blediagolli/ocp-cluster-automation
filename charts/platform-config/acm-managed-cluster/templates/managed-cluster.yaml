{{- if .Values.managedCluster.include }}
apiVersion: cluster.open-cluster-management.io/v1
kind: ManagedCluster
metadata:
  name: {{ .Values.cluster.name }}
  labels:
    name: {{ .Values.cluster.name }}
    environment: {{ .Values.cluster.environment }}
    vendor: {{ .Values.managedCluster.vendor }}
    cloud: {{ .Values.managedCluster.cloudProvider | default "auto-detect" }}
    cluster.open-cluster-management.io/clusterset: {{ .Values.managedCluster.clusterSet }}
    {{- range $key, $value := .Values.managedCluster.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  hubAcceptsClient: {{ .Values.managedCluster.hubAcceptsClient }}
{{- end }}
