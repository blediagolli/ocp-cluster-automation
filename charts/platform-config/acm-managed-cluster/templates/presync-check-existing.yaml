{{- if .Values.managedCluster.include }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.cluster.name }}-import-check
  namespace: {{ .Values.cluster.name }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 60
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.cluster.name }}-import-check
      containers:
        - name: check
          image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
          env:
            - name: CLUSTER_NAME
              value: {{ .Values.cluster.name }}
          command:
            - /bin/bash
            - -c
            - |
              if oc get managedcluster "${CLUSTER_NAME}" &>/dev/null; then
                echo "ERROR: ManagedCluster '${CLUSTER_NAME}' already exists in ACM."
                echo "This cluster was likely provisioned by ACM or imported through another method."
                echo "Importing it again will cause conflicts. Remove deployImport from conf.yaml."
                exit 1
              fi
              echo "ManagedCluster '${CLUSTER_NAME}' does not exist — safe to import."
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      terminationGracePeriodSeconds: 0
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.cluster.name }}-import-check
  namespace: {{ .Values.cluster.name }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.cluster.name }}-import-check
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
rules:
  - apiGroups: ["cluster.open-cluster-management.io"]
    resources: ["managedclusters"]
    resourceNames: [{{ .Values.cluster.name | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.cluster.name }}-import-check
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.cluster.name }}-import-check
subjects:
  - kind: ServiceAccount
    name: {{ .Values.cluster.name }}-import-check
    namespace: {{ .Values.cluster.name }}
{{- end }}
