{{- if .Values.etcdBackup.include }}
{{- if eq .Values.etcdBackup.storage.type "pvc" }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.etcdBackup.storage.pvc.name }}
  namespace: {{ .Values.etcdBackup.namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.etcdBackup.storage.pvc.storageClass }}
  storageClassName: {{ .Values.etcdBackup.storage.pvc.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.etcdBackup.storage.pvc.size }}
{{- end }}
{{- if eq .Values.etcdBackup.storage.type "obc" }}
---
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: {{ .Values.etcdBackup.storage.obc.name }}
  namespace: {{ .Values.etcdBackup.namespace }}
spec:
  storageClassName: {{ .Values.etcdBackup.storage.obc.storageClass }}
  generateBucketName: {{ .Values.etcdBackup.storage.obc.bucketPrefix }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: etcd-backup
  namespace: {{ .Values.etcdBackup.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: etcd-backup
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
{{- if eq .Values.etcdBackup.storage.type "obc" }}
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: etcd-backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: etcd-backup
subjects:
  - kind: ServiceAccount
    name: etcd-backup
    namespace: {{ .Values.etcdBackup.namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: etcd-backup-script
  namespace: {{ .Values.etcdBackup.namespace }}
data:
  backup.sh: |
    #!/bin/bash
    set -euo pipefail

    NAMESPACE="openshift-etcd"
    STORAGE_TYPE="{{ .Values.etcdBackup.storage.type }}"
    RETENTION={{ .Values.etcdBackup.retentionCount }}
    TIMESTAMP=$(date +%Y%m%d-%H%M%S)

    echo "=== etcd backup starting ==="
    echo "Storage: ${STORAGE_TYPE}"
    echo "Retention: ${RETENTION}"
    echo ""

    # --- Find an etcd pod to exec into ---
    ETCD_POD=$(oc get pods -n ${NAMESPACE} -l app=etcd \
      --field-selector=status.phase=Running \
      -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)

    if [ -z "${ETCD_POD}" ]; then
      echo "ERROR: No running etcd pod found in ${NAMESPACE}"
      exit 1
    fi
    echo "Using etcd pod: ${ETCD_POD}"

    ETCD_EP=$(oc exec -n ${NAMESPACE} ${ETCD_POD} -c etcd -- \
      printenv ETCDCTL_ENDPOINTS 2>/dev/null || echo "https://localhost:2379")
    ETCD_EP_SINGLE=$(echo "${ETCD_EP}" | cut -d',' -f1)

    run_etcdctl() {
      oc exec -n ${NAMESPACE} ${ETCD_POD} -c etcd -- \
        env -u ETCDCTL_ENDPOINTS etcdctl "$@"
    }

    # --- Pre-backup health check ---
    echo "--- Cluster health ---"
    if ! run_etcdctl --endpoints="${ETCD_EP}" endpoint health --cluster; then
      echo "ERROR: Cluster is not healthy. Aborting backup."
      exit 1
    fi
    echo ""

    # --- Take snapshot ---
    SNAPSHOT_PATH="/tmp/etcd-snapshot-$(date +%s).db"
    echo "Taking snapshot to ${SNAPSHOT_PATH} inside ${ETCD_POD}..."
    run_etcdctl --endpoints="${ETCD_EP_SINGLE}" snapshot save "${SNAPSHOT_PATH}"
    echo ""

    # --- Copy snapshot out of etcd pod ---
    LOCAL_SNAPSHOT="/tmp/snapshot.db"
    echo "Copying snapshot from etcd pod..."
    oc cp "${NAMESPACE}/${ETCD_POD}:${SNAPSHOT_PATH}" "${LOCAL_SNAPSHOT}" -c etcd

    SNAPSHOT_SIZE=$(stat -c %s "${LOCAL_SNAPSHOT}" 2>/dev/null || stat -f %z "${LOCAL_SNAPSHOT}" 2>/dev/null || echo "0")
    if [ "${SNAPSHOT_SIZE}" -eq 0 ]; then
      echo "ERROR: Snapshot file is empty"
      exit 1
    fi
    echo "Snapshot size: $(( SNAPSHOT_SIZE / 1024 / 1024 ))MB"

    # --- Clean up remote snapshot ---
    oc exec -n ${NAMESPACE} ${ETCD_POD} -c etcd -- rm -f "${SNAPSHOT_PATH}" 2>/dev/null || true

    # --- Generate metadata ---
    ETCD_VERSION=$(run_etcdctl --endpoints="${ETCD_EP_SINGLE}" version 2>/dev/null | head -1 || echo "unknown")
    MEMBER_COUNT=$(run_etcdctl --endpoints="${ETCD_EP_SINGLE}" member list -w simple 2>/dev/null | wc -l | tr -d ' ')

    cat > /tmp/metadata.txt <<METAEOF
    timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)
    etcd_pod: ${ETCD_POD}
    snapshot_size_bytes: ${SNAPSHOT_SIZE}
    etcd_version: ${ETCD_VERSION}
    cluster_members: ${MEMBER_COUNT}
    METAEOF

    {{- if eq .Values.etcdBackup.storage.type "pvc" }}
    # === PVC storage ===
    BACKUP_DIR=/backup/${TIMESTAMP}
    mkdir -p "${BACKUP_DIR}"
    mv "${LOCAL_SNAPSHOT}" "${BACKUP_DIR}/snapshot.db"
    mv /tmp/metadata.txt "${BACKUP_DIR}/metadata.txt"

    BACKUP_COUNT=$(ls -dt /backup/*/ 2>/dev/null | wc -l | tr -d ' ')
    if [ "${BACKUP_COUNT}" -gt "${RETENTION}" ]; then
      REMOVE_COUNT=$((BACKUP_COUNT - RETENTION))
      echo "Removing ${REMOVE_COUNT} old backup(s)..."
      ls -dt /backup/*/ | tail -n +$((RETENTION + 1)) | xargs rm -rf || true
    fi

    echo ""
    echo "=== etcd backup complete ==="
    echo "Backup: ${BACKUP_DIR}"
    echo "Backups on disk: $(ls -dt /backup/*/ 2>/dev/null | wc -l | tr -d ' ')/${RETENTION}"
    {{- end }}

    {{- if eq .Values.etcdBackup.storage.type "obc" }}
    # === Object Bucket storage ===
    OBC_NAME="{{ .Values.etcdBackup.storage.obc.name }}"
    OBC_NAMESPACE="{{ .Values.etcdBackup.namespace }}"

    # OBC creates a Secret and ConfigMap with the same name as the OBC
    export AWS_ACCESS_KEY_ID=$(oc get secret "${OBC_NAME}" -n "${OBC_NAMESPACE}" -o jsonpath='{.data.AWS_ACCESS_KEY_ID}' | base64 -d)
    export AWS_SECRET_ACCESS_KEY=$(oc get secret "${OBC_NAME}" -n "${OBC_NAMESPACE}" -o jsonpath='{.data.AWS_SECRET_ACCESS_KEY}' | base64 -d)
    export BUCKET_NAME=$(oc get configmap "${OBC_NAME}" -n "${OBC_NAMESPACE}" -o jsonpath='{.data.BUCKET_NAME}')
    export BUCKET_HOST=$(oc get configmap "${OBC_NAME}" -n "${OBC_NAMESPACE}" -o jsonpath='{.data.BUCKET_HOST}')
    export BUCKET_PORT=$(oc get configmap "${OBC_NAME}" -n "${OBC_NAMESPACE}" -o jsonpath='{.data.BUCKET_PORT}')

    echo "Bucket: ${BUCKET_NAME}"
    echo "Endpoint: https://${BUCKET_HOST}:${BUCKET_PORT}"
    echo ""

    # Upload snapshot
    echo "Uploading snapshot to s3://${BUCKET_NAME}/etcd-backup/${TIMESTAMP}/snapshot.db..."
    python3 /scripts/s3upload.py "${LOCAL_SNAPSHOT}" "etcd-backup/${TIMESTAMP}/snapshot.db"
    echo "Upload complete"

    # Upload metadata
    echo "Uploading metadata..."
    python3 /scripts/s3upload.py /tmp/metadata.txt "etcd-backup/${TIMESTAMP}/metadata.txt"
    echo "Metadata uploaded"

    # --- Retention ---
    echo ""
    echo "Applying retention (keep ${RETENTION})..."
    python3 /scripts/s3upload.py --retention "${RETENTION}"

    echo ""
    echo "=== etcd backup complete ==="
    echo "Backup: s3://${BUCKET_NAME}/etcd-backup/${TIMESTAMP}/"
    {{- end }}
{{- if eq .Values.etcdBackup.storage.type "obc" }}
  s3upload.py: |
    #!/usr/bin/env python3
    import hashlib, hmac, os, sys, ssl, xml.etree.ElementTree as ET
    from datetime import datetime, timezone
    from urllib.request import Request, urlopen
    from urllib.parse import quote

    host = os.environ["BUCKET_HOST"]
    port = os.environ["BUCKET_PORT"]
    bucket = os.environ["BUCKET_NAME"]
    access_key = os.environ["AWS_ACCESS_KEY_ID"]
    secret_key = os.environ["AWS_SECRET_ACCESS_KEY"]
    endpoint = f"https://{host}:{port}"
    region = "us-east-1"

    ctx = ssl.create_default_context()
    ca = "/run/secrets/kubernetes.io/serviceaccount/ca.crt"
    if os.path.exists(ca):
        ctx.load_verify_locations(ca)
    ctx.check_hostname = False
    ctx.verify_mode = ssl.CERT_NONE

    def sign(key, msg):
        return hmac.new(key, msg.encode("utf-8"), hashlib.sha256).digest()

    def get_signature_key(date_stamp):
        k = sign(("AWS4" + secret_key).encode("utf-8"), date_stamp)
        k = sign(k, region)
        k = sign(k, "s3")
        return sign(k, "aws4_request")

    def s3_request(method, path, body=b"", query="", content_type=""):
        now = datetime.now(timezone.utc)
        amz_date = now.strftime("%Y%m%dT%H%M%SZ")
        date_stamp = now.strftime("%Y%m%d")
        payload_hash = hashlib.sha256(body).hexdigest() if method == "PUT" else "UNSIGNED-PAYLOAD"
        h = f"{host}:{port}"
        headers_to_sign = {"host": h, "x-amz-content-sha256": payload_hash, "x-amz-date": amz_date}
        if content_type:
            headers_to_sign["content-type"] = content_type
        signed_headers = ";".join(sorted(headers_to_sign))
        canonical_headers = "".join(f"{k}:{v}\n" for k, v in sorted(headers_to_sign.items()))
        canonical_request = f"{method}\n/{bucket}{path}\n{query}\n{canonical_headers}\n{signed_headers}\n{payload_hash}"
        scope = f"{date_stamp}/{region}/s3/aws4_request"
        string_to_sign = f"AWS4-HMAC-SHA256\n{amz_date}\n{scope}\n{hashlib.sha256(canonical_request.encode()).hexdigest()}"
        signing_key = get_signature_key(date_stamp)
        signature = hmac.new(signing_key, string_to_sign.encode("utf-8"), hashlib.sha256).hexdigest()
        auth = f"AWS4-HMAC-SHA256 Credential={access_key}/{scope}, SignedHeaders={signed_headers}, Signature={signature}"
        url = f"{endpoint}/{bucket}{path}"
        if query:
            url += f"?{query}"
        req = Request(url, data=body if method == "PUT" else None, method=method)
        req.add_header("Authorization", auth)
        req.add_header("x-amz-date", amz_date)
        req.add_header("x-amz-content-sha256", payload_hash)
        if content_type:
            req.add_header("Content-Type", content_type)
        resp = urlopen(req, context=ctx)
        return resp.read()

    if len(sys.argv) >= 2 and sys.argv[1] == "--retention":
        retention = int(sys.argv[2])
        data = s3_request("GET", "/", query="prefix=etcd-backup%2F&delimiter=%2F")
        root = ET.fromstring(data)
        ns = root.tag.split("}")[0] + "}" if "}" in root.tag else ""
        prefixes = sorted([p.text for p in root.iter(f"{ns}Prefix") if p.text and p.text.startswith("etcd-backup/")], reverse=True)
        print(f"Backups in bucket: {len(prefixes)}/{retention}")
        if len(prefixes) > retention:
            for prefix in prefixes[retention:]:
                listing = s3_request("GET", "/", query=f"prefix={quote(prefix, safe='')}")
                lroot = ET.fromstring(listing)
                for key_el in lroot.iter(f"{ns}Key"):
                    key = key_el.text
                    print(f"  Deleting: {key}")
                    s3_request("DELETE", f"/{key}")
    else:
        local_file = sys.argv[1]
        s3_key = sys.argv[2]
        with open(local_file, "rb") as f:
            body = f.read()
        ct = "application/octet-stream" if local_file.endswith(".db") else "text/plain"
        s3_request("PUT", f"/{s3_key}", body=body, content_type=ct)
{{- end }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-backup
  namespace: {{ .Values.etcdBackup.namespace }}
spec:
  schedule: {{ .Values.etcdBackup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      template:
        spec:
          serviceAccountName: etcd-backup
          restartPolicy: OnFailure
          hostNetwork: true
          tolerations:
            {{- toYaml .Values.etcdBackup.tolerations | nindent 12 }}
          nodeSelector:
            node-role.kubernetes.io/control-plane: ""
          containers:
            - name: etcd-backup
              image: {{ .Values.etcdBackup.image }}
              command:
                - /bin/bash
                - /scripts/backup.sh
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                {{- if eq .Values.etcdBackup.storage.type "pvc" }}
                - name: backup-storage
                  mountPath: /backup
                {{- end }}
          volumes:
            - name: scripts
              configMap:
                name: etcd-backup-script
                defaultMode: 0755
            {{- if eq .Values.etcdBackup.storage.type "pvc" }}
            - name: backup-storage
              persistentVolumeClaim:
                claimName: {{ .Values.etcdBackup.storage.pvc.name }}
            {{- end }}
{{- end }}
