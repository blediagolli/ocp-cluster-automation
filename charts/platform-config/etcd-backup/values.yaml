etcdBackup:
  include: false
  namespace: openshift-etcd
  schedule: "0 */6 * * *"
  retentionCount: 7
  # CLI image — only needs `oc` and `curl` for exec/cp into etcd pods
  # and S3 uploads. Compatible across OCP 4.19-4.22.
  image: registry.redhat.io/openshift4/ose-cli:latest
  storage:
    # "pvc" for PersistentVolumeClaim, "obc" for ObjectBucketClaim (ODF)
    type: obc
    pvc:
      name: etcd-backup-pvc
      storageClass: ""
      size: 50Gi
    obc:
      name: etcd-backup-bucket
      storageClass: openshift-storage.noobaa.io
      bucketPrefix: etcd-backup
  tolerations:
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
