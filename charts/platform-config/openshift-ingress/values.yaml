cluster:
  name: ""
  domain: ""

ingress:
  controller:
    include: false
    manageDefault: false
    default:
      placement: node-role.kubernetes.io/infra
      replicas: 2
      endpointPublishingStrategy: HostNetwork
      tolerations:
        - effect: NoSchedule
          operator: Exists
    logging:
      enabled: false
      destination:
        type: Syslog
        syslog:
          address: ""
          port: 10514
    tlsSecurityProfile:
      enabled: false
      type: Custom
      custom:
        ciphers:
          - TLS_AES_128_GCM_SHA256
          - TLS_AES_256_GCM_SHA384
          - ECDHE-ECDSA-AES128-GCM-SHA256
          - ECDHE-RSA-AES128-GCM-SHA256
          - ECDHE-ECDSA-AES256-GCM-SHA384
          - ECDHE-RSA-AES256-GCM-SHA384
        minTLSVersion: VersionTLS12
    http2:
      enabled: false
    hsts:
      enabled: false
      value: "max-age=31536000; includeSubDomains; preload"
    defaultCertificate:
      enabled: false
      name: custom-default-cert
