{{- if .Values.oauth.include }}
{{- $ns := .Values.oauth.clientSecretNamespace }}
{{- $es := .Values.oauth.externalSecret }}
{{- /* The OAuth CR can only point at a Secret in openshift-config — it cannot
       carry a client secret inline. That Secret used to be created by hand
       (`oc create secret generic …`), which left cluster login depending on an
       imperative step nothing in git recorded.

       Now each provider's secret reference doubles as a secrets spec: give it
       a `source` and this chart creates the Secret, from a secrets manager or
       from values. Leave `source` off and the default is `existing`, which is
       the old behaviour — reference a Secret something else created.

       Every provider type OpenShift lets you point at a Secret is covered, not
       just OpenID: the mechanism is the same and the only thing that varies is
       the key name the CR insists on.

       provider type -> (spec block, field holding the Secret reference, the
       key name OpenShift reads out of that Secret). The key name is fixed by
       OpenShift, which is why it is here and not in values. */}}
{{- $byType := dict
      "OpenID"   (list "openID"   "clientSecret" "clientSecret")
      "GitHub"   (list "github"   "clientSecret" "clientSecret")
      "GitLab"   (list "gitlab"   "clientSecret" "clientSecret")
      "Google"   (list "google"   "clientSecret" "clientSecret")
      "LDAP"     (list "ldap"     "bindPassword" "bindPassword")
      "HTPasswd" (list "htpasswd" "fileData"     "htpasswd") }}
{{- range .Values.oauth.identityProviders }}
{{- $map := index $byType .type }}
{{- if $map }}
{{- $ref := index (index . (index $map 0) | default dict) (index $map 1) | default dict }}
{{- if $ref }}
{{- $key := index $map 2 }}
{{- $ctx := printf "oauth.identityProviders[%s].%s.%s" .name (index $map 0) (index $map 1) }}
{{- $source := $ref.source | default "existing" }}
{{- /* Wave -1, ahead of the OAuth CR: referencing a Secret that does not
       exist yet leaves the authentication cluster operator Degraded. */}}
{{- if eq $source "externalSecret" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $ref.name }}
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ $ref.refreshInterval | default $es.refreshInterval }}
  secretStoreRef:
    {{- toYaml ($ref.secretStoreRef | default $es.secretStoreRef) | nindent 4 }}
  target:
    name: {{ $ref.name }}
    creationPolicy: Owner
  data:
    {{- range $ref.properties }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ required (printf "%s.path is required when source is externalSecret" $ctx) $ref.path }}
        property: {{ .property | default .secretKey }}
    {{- end }}
{{- else if eq $source "inline" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $ref.name }}
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
stringData:
  {{ $key }}: {{ required (printf "%s.data.%s is required when source is inline" $ctx $key) (index ($ref.data | default dict) $key) | quote }}
{{- else if ne $source "existing" }}
{{- fail (printf "%s.source: expected existing, externalSecret or inline — got %q" $ctx $source) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
