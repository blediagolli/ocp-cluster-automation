{{- if .Values.template.include }}
apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: {{ .Values.template.name }}
  namespace: {{ .Values.template.namespace }}
parameters:
  - name: PROJECT_NAME
  - name: PROJECT_DISPLAYNAME
  - name: PROJECT_DESCRIPTION
  - name: PROJECT_ADMIN_USER
  - name: PROJECT_REQUESTING_USER
objects:
- apiVersion: project.openshift.io/v1
  kind: Project
  metadata:
    name: ${PROJECT_NAME}
    annotations:
      openshift.io/display-name: ${PROJECT_DISPLAYNAME}
      openshift.io/description: ${PROJECT_DESCRIPTION}
      openshift.io/requester: ${PROJECT_REQUESTING_USER}
{{- range $key, $value := .Values.namespace.annotations }}
      {{ $key }}: {{ $value | quote }}
{{- end }}
{{- $hasLabels := or (not (empty .Values.namespace.labels)) .Values.namespace.podSecurity.enforce .Values.namespace.podSecurity.audit .Values.namespace.podSecurity.warn -}}
{{- if $hasLabels }}
    labels:
{{- range $key, $value := .Values.namespace.labels }}
      {{ $key }}: {{ $value | quote }}
{{- end }}
{{- with .Values.namespace.podSecurity.enforce }}
      pod-security.kubernetes.io/enforce: {{ . | quote }}
{{- end }}
{{- with .Values.namespace.podSecurity.audit }}
      pod-security.kubernetes.io/audit: {{ . | quote }}
{{- end }}
{{- with .Values.namespace.podSecurity.warn }}
      pod-security.kubernetes.io/warn: {{ . | quote }}
{{- end }}
{{- end }}
{{- if .Values.networkPolicy.include }}
{{- if .Values.networkPolicy.defaultDenyIngress }}
- apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata:
    name: default-deny-ingress
    namespace: ${PROJECT_NAME}
  spec:
    podSelector: {}
    policyTypes:
    - Ingress
{{- end }}
{{- if .Values.networkPolicy.allowSameNamespace }}
- apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata:
    name: allow-same-namespace
    namespace: ${PROJECT_NAME}
  spec:
    podSelector: {}
    ingress:
    - from:
      - podSelector: {}
    policyTypes:
    - Ingress
{{- end }}
{{- if .Values.networkPolicy.allowFromOpenShiftIngress }}
- apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata:
    name: allow-from-openshift-ingress
    namespace: ${PROJECT_NAME}
  spec:
    podSelector: {}
    ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            network.openshift.io/policy-group: ingress
    policyTypes:
    - Ingress
{{- end }}
{{- if .Values.networkPolicy.allowFromOpenShiftMonitoring }}
- apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata:
    name: allow-from-openshift-monitoring
    namespace: ${PROJECT_NAME}
  spec:
    podSelector: {}
    ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            network.openshift.io/policy-group: monitoring
    policyTypes:
    - Ingress
{{- end }}
{{- if .Values.networkPolicy.allowFromKubeApiserver }}
- apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata:
    name: allow-from-kube-apiserver
    namespace: ${PROJECT_NAME}
  spec:
    podSelector: {}
    ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            network.openshift.io/policy-group: host-network
    policyTypes:
    - Ingress
{{- end }}
{{- end }}
{{- if .Values.resourceQuota.include }}
- apiVersion: v1
  kind: ResourceQuota
  metadata:
    name: {{ .Values.resourceQuota.name }}
    namespace: ${PROJECT_NAME}
  spec:
    hard:
      {{- toYaml .Values.resourceQuota.hard | nindent 6 }}
{{- end }}
{{- if .Values.limitRange.include }}
- apiVersion: v1
  kind: LimitRange
  metadata:
    name: {{ .Values.limitRange.name }}
    namespace: ${PROJECT_NAME}
  spec:
    limits:
      {{- toYaml .Values.limitRange.limits | nindent 6 }}
{{- end }}
{{- if .Values.roleBindings.include }}
{{- if .Values.roleBindings.adminForRequestingUser }}
- apiVersion: rbac.authorization.k8s.io/v1
  kind: RoleBinding
  metadata:
    name: admin
    namespace: ${PROJECT_NAME}
  roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: admin
  subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: ${PROJECT_ADMIN_USER}
{{- end }}
{{- range .Values.roleBindings.additional }}
- apiVersion: rbac.authorization.k8s.io/v1
  kind: RoleBinding
  metadata:
    name: {{ .name }}
    namespace: ${PROJECT_NAME}
  roleRef:
    {{- toYaml .roleRef | nindent 4 }}
  subjects:
    {{- toYaml .subjects | nindent 4 }}
{{- end }}
{{- end }}
{{- if .Values.serviceAccount.include }}
- apiVersion: v1
  kind: ServiceAccount
  metadata:
    name: {{ .Values.serviceAccount.name }}
    namespace: ${PROJECT_NAME}
    {{- with .Values.serviceAccount.annotations }}
    annotations:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- with .Values.serviceAccount.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.egressFirewall.include }}
- apiVersion: k8s.ovn.org/v1
  kind: EgressFirewall
  metadata:
    name: default
    namespace: ${PROJECT_NAME}
  spec:
    egress:
      {{- toYaml .Values.egressFirewall.rules | nindent 6 }}
{{- end }}
{{- end }}
