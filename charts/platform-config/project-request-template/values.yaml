template:
  include: true
  name: project-request
  namespace: openshift-config

projectConfig:
  include: false
  projectRequestMessage: ""

selfProvisioners:
  include: false

namespace:
  labels: {}
  annotations: {}
  podSecurity:
    enforce: restricted
    audit: restricted
    warn: restricted

networkPolicy:
  include: false
  defaultDenyIngress: true
  allowSameNamespace: true
  allowFromOpenShiftIngress: true
  allowFromOpenShiftMonitoring: true
  allowFromKubeApiserver: true

resourceQuota:
  include: false
  name: default
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "20"
    persistentvolumeclaims: "10"
    requests.storage: 50Gi

limitRange:
  include: false
  name: default
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      max:
        cpu: "4"
        memory: 8Gi
      # Admission floor, not a scheduling hint: a container asking for less is
      # rejected outright. Kept at 10m to match the onboarding tiers in
      # charts/onboarding/namespace-config/values.yaml -- short-lived
      # maintenance Pods ask for very little, and a floor set at a "reasonable
      # workload" figure rejects them.
      min:
        cpu: 10m
        memory: 64Mi

roleBindings:
  include: false
  adminForRequestingUser: true
  additional: []
  # - name: ops-admin
  #   roleRef:
  #     apiGroup: rbac.authorization.k8s.io
  #     kind: ClusterRole
  #     name: admin
  #   subjects:
  #     - apiGroup: rbac.authorization.k8s.io
  #       kind: Group
  #       name: ops-team

serviceAccount:
  include: false
  name: default
  annotations: {}
  imagePullSecrets: []
  # - name: my-registry-secret

egressFirewall:
  include: false
  rules: []
  # - type: Allow
  #   to:
  #     cidrSelector: 0.0.0.0/0
