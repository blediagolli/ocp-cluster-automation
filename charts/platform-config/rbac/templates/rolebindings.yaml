{{- if .Values.roleBindings.include }}
{{- range .Values.roleBindings.bindings }}
{{- if .include }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  {{- if .clusterRole }}
  kind: ClusterRole
  name: {{ .clusterRole }}
  {{- else }}
  kind: Role
  name: {{ .role }}
  {{- end }}
subjects:
  {{- range .subjects }}
  - kind: {{ .kind }}
    name: {{ .name }}
    {{- if eq .kind "ServiceAccount" }}
    namespace: {{ .namespace }}
    {{- else }}
    apiGroup: rbac.authorization.k8s.io
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
