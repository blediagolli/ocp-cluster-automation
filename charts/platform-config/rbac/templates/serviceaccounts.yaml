{{- if .Values.serviceAccounts.include }}
{{- range .Values.serviceAccounts.accounts }}
{{- if .include }}
{{- if .createNamespace }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .namespace }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
{{- if and .token .token.include }}
---
# Long-lived API token. The token controller populates .data on creation; the
# ApplicationSet ignores /data for this secret so the generated token does not
# show as drift.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .token.secretName | default (printf "%s-token" .name) }}
  namespace: {{ .namespace }}
  annotations:
    kubernetes.io/service-account.name: {{ .name }}
type: kubernetes.io/service-account-token
{{- end }}
{{- end }}
{{- end }}
{{- end }}
