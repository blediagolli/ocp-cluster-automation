{{- $provider := .Values.provider -}}
{{- if .Values.certificates.api.include }}
{{- $p := include "tls-certificates.provider" (list .Values.certificates.api.provider $provider) }}
{{- if eq $p "cert-manager" }}
{{- $cm := .Values.certManager -}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.certificates.api.secretName }}
  namespace: {{ .Values.certificates.api.namespace }}
spec:
  secretName: {{ .Values.certificates.api.secretName }}
  commonName: {{ include "tls-certificates.apiCommonName" . }}
  dnsNames:
    {{- include "tls-certificates.apiDnsNames" . | nindent 4 }}
  duration: {{ $cm.duration }}
  renewBefore: {{ $cm.renewBefore }}
  isCA: false
  privateKey:
    algorithm: {{ $cm.privateKey.algorithm }}
    size: {{ $cm.privateKey.size }}
  issuerRef:
    name: {{ $cm.issuerRef.name }}
    kind: {{ $cm.issuerRef.kind }}
    group: cert-manager.io
  usages:
    - server auth
---
{{- end }}
{{- end }}
{{- if .Values.certificates.ingress.include }}
{{- $p := include "tls-certificates.provider" (list .Values.certificates.ingress.provider $provider) }}
{{- if eq $p "cert-manager" }}
{{- $cm := .Values.certManager -}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.certificates.ingress.secretName }}
  namespace: {{ .Values.certificates.ingress.namespace }}
spec:
  secretName: {{ .Values.certificates.ingress.secretName }}
  commonName: {{ include "tls-certificates.ingressCommonName" . | quote }}
  dnsNames:
    {{- include "tls-certificates.ingressDnsNames" . | nindent 4 }}
  duration: {{ $cm.duration }}
  renewBefore: {{ $cm.renewBefore }}
  isCA: false
  privateKey:
    algorithm: {{ $cm.privateKey.algorithm }}
    size: {{ $cm.privateKey.size }}
  issuerRef:
    name: {{ $cm.issuerRef.name }}
    kind: {{ $cm.issuerRef.kind }}
    group: cert-manager.io
  usages:
    - server auth
---
{{- end }}
{{- end }}
{{- if .Values.certificates.ca.include }}
{{- $p := include "tls-certificates.provider" (list .Values.certificates.ca.provider $provider) }}
{{- if eq $p "cert-manager" }}
{{- $cm := .Values.certManager -}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.certificates.ca.configMapName }}
  namespace: {{ .Values.certificates.ca.namespace }}
spec:
  secretName: {{ .Values.certificates.ca.configMapName }}
  commonName: {{ .Values.certificates.ca.configMapName }}
  isCA: true
  duration: {{ $cm.duration }}
  renewBefore: {{ $cm.renewBefore }}
  privateKey:
    algorithm: {{ $cm.privateKey.algorithm }}
    size: {{ $cm.privateKey.size }}
  issuerRef:
    name: {{ $cm.issuerRef.name }}
    kind: {{ $cm.issuerRef.kind }}
    group: cert-manager.io
{{- end }}
{{- end }}
