{{- $provider := .Values.provider -}}
{{- if .Values.certificates.api.include }}
{{- $p := include "tls-certificates.provider" (list .Values.certificates.api.provider $provider) }}
{{- if eq $p "sealed-secret" }}
{{- $data := index .Values.sealedSecret "api" | default dict }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.certificates.api.secretName }}
  namespace: {{ .Values.certificates.api.namespace }}
spec:
  encryptedData:
    tls.crt: {{ index $data "tls.crt" | quote }}
    tls.key: {{ index $data "tls.key" | quote }}
  template:
    metadata:
      name: {{ .Values.certificates.api.secretName }}
      namespace: {{ .Values.certificates.api.namespace }}
    type: kubernetes.io/tls
---
{{- end }}
{{- end }}
{{- if .Values.certificates.ingress.include }}
{{- $p := include "tls-certificates.provider" (list .Values.certificates.ingress.provider $provider) }}
{{- if eq $p "sealed-secret" }}
{{- $data := index .Values.sealedSecret "ingress" | default dict }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.certificates.ingress.secretName }}
  namespace: {{ .Values.certificates.ingress.namespace }}
spec:
  encryptedData:
    tls.crt: {{ index $data "tls.crt" | quote }}
    tls.key: {{ index $data "tls.key" | quote }}
  template:
    metadata:
      name: {{ .Values.certificates.ingress.secretName }}
      namespace: {{ .Values.certificates.ingress.namespace }}
    type: kubernetes.io/tls
---
{{- end }}
{{- end }}
{{- if .Values.certificates.ca.include }}
{{- $p := include "tls-certificates.provider" (list .Values.certificates.ca.provider $provider) }}
{{- if eq $p "sealed-secret" }}
{{- $data := index .Values.sealedSecret "ca" | default dict }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.certificates.ca.configMapName }}
  namespace: {{ .Values.certificates.ca.namespace }}
  annotations:
    sealedsecrets.bitnami.com/managed: "true"
spec:
  encryptedData:
    ca-bundle.crt: {{ index $data "ca-bundle.crt" | quote }}
  template:
    metadata:
      name: {{ .Values.certificates.ca.configMapName }}
      namespace: {{ .Values.certificates.ca.namespace }}
    type: Opaque
{{- end }}
{{- end }}
