{{- /* provider: secret — the certificate already exists as bytes somewhere,
       and secret.source says where: a secrets-manager backend, values, or a
       Secret something else created. Replaces the old manual, external-secret
       and vault providers, which differed only in that.

       cert-manager and sealed-secret are not here: those render a Certificate
       or a SealedSecret and something else turns it into a Secret. */}}
{{- $es := .Values.externalSecret }}
{{- range $key := list "api" "ingress" "ca" }}
{{- $cert := index $.Values.certificates $key }}
{{- if $cert.include }}
{{- $p := include "tls-certificates.provider" (list $cert.provider $.Values.provider) }}
{{- if eq $p "secret" }}
{{- /* The CA bundle is a ConfigMap, not a Secret: OpenShift's trustedCA and
       clientCA fields take a ConfigMap reference. So it is named by
       configMapName and, inline, rendered as a ConfigMap.

       Under source: externalSecret the CA still comes out as a *Secret* —
       ESO cannot create a ConfigMap. That is carried over from the provider
       this replaced rather than introduced here, and it means the vault path
       for a CA bundle has never actually worked for trustedCA. Use
       source: inline, or a cert-manager-issued CA, until that is sorted. */}}
{{- $isCA := eq $key "ca" }}
{{- $name := ternary $cert.configMapName $cert.secretName $isCA }}
{{- $s := $cert.secret | default dict }}
{{- $data := $s.data | default dict }}
{{- $ctx := printf "certificates.%s.secret" $key }}
{{- $source := $s.source | default "existing" }}
{{- if eq $source "externalSecret" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ $cert.namespace }}
spec:
  refreshInterval: {{ $s.refreshInterval | default $es.refreshInterval }}
  secretStoreRef:
    {{- toYaml ($s.secretStoreRef | default $es.secretStoreRef) | nindent 4 }}
  target:
    name: {{ $name }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: {{ ternary "Opaque" "kubernetes.io/tls" $isCA }}
  data:
    {{- range $s.properties }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ required (printf "%s.path is required when source is externalSecret" $ctx) $s.path }}
        property: {{ .property | default .secretKey }}
    {{- end }}
{{- else if eq $source "inline" }}
{{- if $isCA }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ $cert.namespace }}
data:
  ca-bundle.crt: |
    {{- required (printf "%s.data.\"ca-bundle.crt\" is required when source is inline" $ctx) (index $data "ca-bundle.crt") | nindent 4 }}
{{- else }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $cert.namespace }}
type: kubernetes.io/tls
stringData:
  tls.crt: {{ required (printf "%s.data.\"tls.crt\" is required when source is inline" $ctx) (index $data "tls.crt") | quote }}
  tls.key: {{ required (printf "%s.data.\"tls.key\" is required when source is inline" $ctx) (index $data "tls.key") | quote }}
{{- end }}
{{- else if ne $source "existing" }}
{{- fail (printf "%s.source: expected existing, externalSecret or inline — got %q" $ctx $source) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
