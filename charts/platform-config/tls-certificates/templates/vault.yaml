{{- $provider := .Values.provider -}}
{{- $store := .Values.vault.secretStoreRef -}}
{{- $refresh := .Values.vault.refreshInterval -}}
{{- if .Values.certificates.api.include }}
{{- $p := include "tls-certificates.provider" (list .Values.certificates.api.provider $provider) }}
{{- if eq $p "vault" }}
{{- $vaultCfg := index .Values.vault "api" | default dict }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.certificates.api.secretName }}
  namespace: {{ .Values.certificates.api.namespace }}
spec:
  refreshInterval: {{ $refresh }}
  secretStoreRef:
    name: {{ $store.name }}
    kind: {{ $store.kind }}
  target:
    name: {{ .Values.certificates.api.secretName }}
    template:
      type: kubernetes.io/tls
  data:
    {{- range $vaultCfg.properties }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ $vaultCfg.path }}
        property: {{ .property }}
    {{- end }}
---
{{- end }}
{{- end }}
{{- if .Values.certificates.ingress.include }}
{{- $p := include "tls-certificates.provider" (list .Values.certificates.ingress.provider $provider) }}
{{- if eq $p "vault" }}
{{- $vaultCfg := index .Values.vault "ingress" | default dict }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.certificates.ingress.secretName }}
  namespace: {{ .Values.certificates.ingress.namespace }}
spec:
  refreshInterval: {{ $refresh }}
  secretStoreRef:
    name: {{ $store.name }}
    kind: {{ $store.kind }}
  target:
    name: {{ .Values.certificates.ingress.secretName }}
    template:
      type: kubernetes.io/tls
  data:
    {{- range $vaultCfg.properties }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ $vaultCfg.path }}
        property: {{ .property }}
    {{- end }}
---
{{- end }}
{{- end }}
{{- if .Values.certificates.ca.include }}
{{- $p := include "tls-certificates.provider" (list .Values.certificates.ca.provider $provider) }}
{{- if eq $p "vault" }}
{{- $vaultCfg := index .Values.vault "ca" | default dict }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.certificates.ca.configMapName }}
  namespace: {{ .Values.certificates.ca.namespace }}
spec:
  refreshInterval: {{ $refresh }}
  secretStoreRef:
    name: {{ $store.name }}
    kind: {{ $store.kind }}
  target:
    name: {{ .Values.certificates.ca.configMapName }}
    template:
      type: Opaque
  data:
    {{- range $vaultCfg.properties }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ $vaultCfg.path }}
        property: {{ .property }}
    {{- end }}
{{- end }}
{{- end }}
