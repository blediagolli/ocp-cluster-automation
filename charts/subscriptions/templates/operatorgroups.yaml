{{- range $name, $operator := .Values.operators }}
{{- if and $operator.include (not $operator.skipOperatorGroup) }}
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: {{ $operator.operatorGroup }}
  namespace: {{ $operator.namespace }}
  labels:
    operator: {{ $name }}
{{- if $operator.clusterScoped }}
spec: {}
{{- else }}
spec:
  targetNamespaces:
    - {{ $operator.namespace }}
{{- end }}
---
{{- end }}
{{- end }}
