# Cluster-level platform config overrides. Configures cert-manager as the TLS
# certificate provider with Let's Encrypt via DNS01/Route53.
apiServer:
  include: true
  servingCerts:
    namedCertificates:
      - names:
          - api.aws-test.sandbox3321.opentlc.com
        servingCertificate:
          name: cert-manager-api-cert
ingress:
  controller:
    include: true
    manageDefault: true
    default:
      placement: node-role.kubernetes.io/worker
      replicas: 2
      endpointPublishingStrategy: LoadBalancerService
      tolerations: []
    defaultCertificate:
      enabled: true
      name: cert-manager-ingress-cert
proxy:
  include: true

# --- etcd maintenance ---
etcdBackup:
  include: true
  storage:
    type: pvc
    pvc:
      storageClass: gp3-csi
etcdDefrag:
  include: true

# --- monitoring ---
userWorkloadMonitoring:
  include: true
  prometheus:
    storageClass: gp3-csi
prometheusRules:
  include: true
alertmanager:
  include: true

# --- cluster hygiene ---
projectConfig:
  include: true
networkPolicy:
  include: true
limitRange:
  include: true
resourceQuota:
  include: true
machineHealthChecks:
  include: true
imagePruner:
  include: true

# --- console ---
console:
  include: true

# --- identity ---
oauth:
  include: true
  groupRBAC:
    - group: admins
      clusterRole: cluster-admin
    - group: users
      clusterRole: edit
  identityProviders:
    - name: keycloak
      type: OpenID
      mappingMethod: claim
      openID:
        clientID: openshift
        clientSecret:
          name: openshift-oidc-client-secret
        issuer: "https://sso.apps.cluster-c8444.dyn.redhatworkshops.io/realms/sso"
        claims:
          preferredUsername:
            - preferred_username
          name:
            - name
          email:
            - email
          groups:
            - groups
        extraScopes:
          - email
          - profile

# --- TLS ---
provider: cert-manager
certManager:
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
certificates:
  api:
    include: true
    secretName: cert-manager-api-cert
    dnsNames:
      - api.aws-test.sandbox3321.opentlc.com
  ingress:
    include: true
    secretName: cert-manager-ingress-cert
    dnsNames:
      - "*.apps.aws-test.sandbox3321.opentlc.com"
      - apps.aws-test.sandbox3321.opentlc.com
