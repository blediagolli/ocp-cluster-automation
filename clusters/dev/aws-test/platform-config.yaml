# Cluster-level platform config overrides. Configures cert-manager as the TLS
# certificate provider with Let's Encrypt via DNS01/Route53.
apiServer:
  include: true
  servingCerts:
    namedCertificates:
      - names:
          - api.aws-test.sandbox3321.opentlc.com
        servingCertificate:
          name: cert-manager-api-cert
ingress:
  controller:
    include: true
    manageDefault: true
    default:
      placement: node-role.kubernetes.io/worker
      replicas: 2
      endpointPublishingStrategy: LoadBalancerService
      tolerations: []
    defaultCertificate:
      enabled: true
      name: cert-manager-ingress-cert
proxy:
  include: true

# --- etcd maintenance ---
etcdBackup:
  include: true
  storage:
    type: pvc
    pvc:
      storageClass: gp3-csi
etcdDefrag:
  include: true

# --- monitoring ---
userWorkloadMonitoring:
  include: true
  prometheus:
    storageClass: gp3-csi
prometheusRules:
  include: true
alertmanager:
  include: true

# --- cluster hygiene ---
projectConfig:
  include: true
networkPolicy:
  include: true
limitRange:
  include: true
resourceQuota:
  include: true
machineHealthChecks:
  include: true
imagePruner:
  include: true

# --- console ---
console:
  include: true

# --- identity ---
oauth:
  include: true
  groupRBAC:
    - group: admins
      clusterRole: cluster-admin
    - group: users
      clusterRole: edit
  identityProviders:
    - name: keycloak
      type: OpenID
      mappingMethod: claim
      openID:
        clientID: openshift
        clientSecret:
          name: openshift-oidc-client-secret
        issuer: "https://sso.apps.cluster-c8444.dyn.redhatworkshops.io/realms/sso"
        claims:
          preferredUsername:
            - preferred_username
          name:
            - name
          email:
            - email
          groups:
            - groups
        extraScopes:
          - email
          - profile

# --- group sync ---
groupSync:
  include: true
  provider: keycloak
  keycloak:
    url: "https://sso.apps.cluster-c8444.dyn.redhatworkshops.io"
    realm: sso
    credentialsSecretName: keycloak-group-sync
    groupMappings:
      - keycloakGroup: admins
        openshiftGroup: admins
      - keycloakGroup: users
        openshiftGroup: users

# --- RBAC ---
clusterRoles:
  include: true
  roles:
    - include: true
      name: cluster-viewer
      rules:
        - apiGroups: [""]
          resources: ["nodes", "namespaces", "persistentvolumes", "events"]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["storage.k8s.io"]
          resources: ["storageclasses"]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["machine.openshift.io"]
          resources: ["machines", "machinesets"]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["config.openshift.io"]
          resources: ["*"]
          verbs: ["get", "list", "watch"]
clusterRoleBindings:
  include: true
  bindings:
    - include: true
      name: team-alpha-cluster-viewer
      clusterRole: cluster-viewer
      subjects:
        - kind: Group
          name: team-alpha
    - include: true
      name: team-beta-cluster-viewer
      clusterRole: cluster-viewer
      subjects:
        - kind: Group
          name: team-beta

# --- image registry ---
imageRegistry:
  include: true
  replicas: 2
  managementState: Managed
  rolloutStrategy: RollingUpdate
  defaultRoute: true
  storage:
    type: s3
    s3:
      bucket: aws-test-wtxdp-image-registry-us-east-2
      region: us-east-2
      encrypt: true

# --- image policy ---
image:
  include: true

# --- marketplace ---
catalogSource:
  certifiedOperators:
    include: false
  communityOperators:
    include: false

# --- storage classes ---
storageClasses:
  include: true
  classes:
    - name: fast-ssd
      include: true
      provisioner: ebs.csi.aws.com
      reclaimPolicy: Delete
      volumeBindingMode: WaitForFirstConsumer
      allowVolumeExpansion: true
      parameters:
        type: gp3
        iops: "6000"
        throughput: "250"
        encrypted: "true"

# --- DNS ---
dns:
  include: true

# --- build ---
build:
  include: true

# --- scheduler ---
scheduler:
  include: true
  profile: LowNodeUtilization

# --- admin network policies ---
adminNetworkPolicies:
  - name: allow-monitoring
    include: true
    priority: 10
    subject:
      namespaceSelector:
        matchLabels: {}
    ingress:
      - name: allow-prometheus
        action: Allow
        from:
          - namespaces:
              namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: openshift-monitoring
        ports:
          - portNumber:
              port: 9090
              protocol: TCP
          - portNumber:
              port: 9091
              protocol: TCP
          - portNumber:
              port: 8443
              protocol: TCP
    egress: []
  - name: allow-ingress-controller
    include: true
    priority: 20
    subject:
      namespaceSelector:
        matchLabels: {}
    ingress:
      - name: allow-router
        action: Allow
        from:
          - namespaces:
              namespaceSelector:
                matchLabels:
                  policy-group.network.openshift.io/ingress: ""
        ports:
          - portNumber:
              port: 8080
              protocol: TCP
          - portNumber:
              port: 8443
              protocol: TCP
    egress: []

# --- volume snapshot classes ---
volumeSnapshotClasses:
  include: true
  classes:
    - name: csi-aws-ebs-snapclass
      include: true
      driver: ebs.csi.aws.com
      deletionPolicy: Delete

# --- machine config ---
kubeletConfigWorker:
  include: true
kubeletConfigMaster:
  include: true
containerRuntimeConfig:
  include: true

# --- TLS ---
provider: cert-manager
certManager:
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
certificates:
  api:
    include: true
    secretName: cert-manager-api-cert
    dnsNames:
      - api.aws-test.sandbox3321.opentlc.com
  ingress:
    include: true
    secretName: cert-manager-ingress-cert
    dnsNames:
      - "*.apps.aws-test.sandbox3321.opentlc.com"
      - apps.aws-test.sandbox3321.opentlc.com
