cluster:
  name: "cluster-lz5bn"
  environment: dev
  address: "https://cluster-proxy-addon-user.multicluster-engine.svc.cluster.local:9092/cluster-lz5bn"
platformCharts:
  - chart: openshift-machine-config
  - chart: openshift-ingress
  - chart: openshift-marketplace
  - chart: user-workload-monitoring
operatorInstanceCharts:
  - chart: acs-secured-cluster
  - chart: aap-instance
managedCluster:
  deploy: true
  include: true
  name: "cluster-lz5bn"
  environment: dev
  autoImport:
    include: true
    mode: kubeconfig
    kubeconfig:
      secretName: lz5bn-kubeconfig
  addons:
    include: false
deployOperators: true
deployOverlay: true
