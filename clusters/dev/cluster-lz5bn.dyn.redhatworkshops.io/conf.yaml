cluster:
  name: "cluster-lz5bn"
  environment: dev
  address: "https://cluster-proxy-addon-user.multicluster-engine.svc.cluster.local:9092/cluster-lz5bn"
configCharts:
  - chart: platform-config/openshift-machine-config
  - chart: platform-config/openshift-ingress
  - chart: platform-config/openshift-marketplace
  - chart: platform-config/user-workload-monitoring
  - chart: operator-instances/acs-secured-cluster
  - chart: operator-instances/aap-instance
managedCluster:
  deploy: true
  include: true
  name: "cluster-lz5bn"
  environment: dev
  autoImport:
    include: true
    mode: kubeconfig
    kubeconfig:
      secretName: lz5bn-kubeconfig
  addons:
    include: false
deployOperators: true
operators:
  openshift-gitops:
    include: true
    channel: gitops-1.21
  advanced-cluster-security:
    include: true
    channel: stable
  compliance-operator:
    include: true
    channel: stable
securedCluster:
  clusterName: dev