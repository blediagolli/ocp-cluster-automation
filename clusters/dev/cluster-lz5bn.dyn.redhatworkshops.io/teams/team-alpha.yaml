# Team definition for onboarding. The git file generators in onboarding-gitops
# and onboarding-namespaces ApplicationSets read this file. Each team gets its
# own ArgoCD instance and namespaces sized by t-shirt definitions from
# namespace-sizes.yaml. cluster.* must be duplicated here because the generator
# reads a single file and cannot merge with conf.yaml.
cluster:
  name: cluster-lz5bn
  environment: dev
  address: "https://cluster-proxy-addon-user.multicluster-engine.svc.cluster.local:9092/cluster-lz5bn"

team:
  name: team-alpha
  admins: team-alpha-admins
  repo: git@github.com:blediagolli/team-alpha-apps.git
  namespaces:
    - name: team-alpha-dev
      size: small
    - name: team-alpha-stage
      size: medium
    - name: team-alpha-preprod
      size: large
