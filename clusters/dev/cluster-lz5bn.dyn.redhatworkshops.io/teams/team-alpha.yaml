# Team definition for onboarding. The onboarding ApplicationSets use a matrix
# generator that pairs this file with the cluster's conf.yaml, so cluster.*
# values are inherited automatically — only team.* needs to be defined here.
team:
  name: team-alpha
  admins: team-alpha-admins
  repo: git@github.com:blediagolli/team-alpha-apps.git
  namespaces:
    - name: team-alpha-dev
      size: small
    - name: team-alpha-stage
      size: medium
    - name: team-alpha-preprod
      size: large
