# Cluster identity and ApplicationSet config. The git file generators read this
# file to discover which charts to deploy, how to reach the cluster, and where
# to find values overrides. Values here are available to all charts as .Values.cluster.*.
#
# This is a worked example of a managed (spoke) cluster. Copy the directory,
# rename it, and change cluster.name / cluster.baseDomain to onboard your own.
cluster:
  name: example-cluster
  environment: dev
  # Managed clusters are reached through the ACM cluster-proxy addon rather
  # than a public API URL, so the path is the ACM cluster name.
  address: "https://cluster-proxy-addon-user.multicluster-engine.svc.cluster.local:9092/example-cluster"
  baseDomain: example.com

# Platform charts deployed to this cluster, in order. Nothing is enabled: which
# charts a cluster runs is your decision, not this repository's. Uncomment the
# ones you want and delete the rest — the list below is the full catalogue of
# charts/platform-config/. Each chart's fields are documented in
# docs/reference/platform-config.yaml.
platformCharts: []
