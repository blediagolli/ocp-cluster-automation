  # - chart: servicemesh3
  # - chart: tempo
  # - chart: trident
  # - chart: trusted-artifact-signer

# Whether the operator Applications install their operators, or only
# configure operators that something else put there — an ACM policy, or a
# subscription applied by hand. false drops every Namespace, OperatorGroup
# and Subscription in every chart above and keeps the CRs.
installOperators: false

# Whether ArgoCD can actually reach this cluster. Leave false until the cluster
# is imported and has a cluster secret in openshift-gitops. Turning it on early
# generates Applications with a destination ArgoCD cannot resolve, which fails
# the whole ApplicationSet — for every cluster, not just this one — and shows as
# a Degraded platform-root. cluster-import and cluster-provisioning ignore it,
# since they are what bring the cluster into existence.
clusterRegistered: false

# Which ApplicationSets claim this cluster at all. Each one is a separate
# Application; leaving them false means the cluster is defined but inert.
deployOverlay: false     # cluster-config-overlays -> raw manifests under overlays/
deployImport: false      # ACM import of an existing cluster
deployProvision: false   # provision.yaml -> Hive ClusterDeployment

# Teams onboarded to this cluster. Each entry needs a matching definition in
# teams/<name>.yaml; see charts/onboarding/ for what gets created.
teams: []
  # - team: team-alpha
