# Merged operator charts: the full catalogue of charts/operators/, all off.
# One chart per operator. It installs the operator — Namespace, OperatorGroup,
# Subscription, at sync waves -30/-29/-28 — and renders that operator's custom
# resources above them, so a CR is never applied before its CRD exists.
#
# Values come from two optional files per level, all read in order:
#   env/<env>/operators.yaml              shared, several operators
#   env/<env>/operators/<chart>.yaml      one operator
#   clusters/<env>/<cluster>/operators.yaml
#   clusters/<env>/<cluster>/operators/<chart>.yaml
# Every chart nests its values under its own name, so a block is identical in
# both places. Start in the shared file; move an operator to its own file when
# it grows large enough to drown the others.
#
# Listing a chart installs the operator and nothing else: every CR keeps its own
# `include: false` default, so you opt in to operands one at a time.
#
# The key must exist even when empty — the ApplicationSet generator runs with
# missingkey=error and a missing key fails before any default can apply.
operatorCharts: []
  # - chart: advanced-cluster-management
  # - chart: advanced-cluster-security
  # - chart: amq-streams
  # - chart: ansible-automation-platform
  # - chart: cert-manager
  # - chart: cloudnative-pg
  # - chart: cluster-observability
  # - chart: compliance
  # - chart: cost-management-metrics
  # - chart: cost-management-service
  # - chart: dev-spaces
  # - chart: developer-hub
  # - chart: external-secrets
  # - chart: gatekeeper
  # - chart: gitlab
  # - chart: gitlab-runner
  # - chart: group-sync
  # - chart: jfrog
  # - chart: keycloak
  # - chart: kyverno
  # - chart: logging
  # - chart: lvm
  # - chart: metallb
  # - chart: mtv
  # - chart: nmstate
  # - chart: node-feature-discovery
  # - chart: node-maintenance
  # - chart: oadp
  # - chart: odf
  # - chart: openshift-gitops
  # - chart: openshift-local-storage
  # - chart: openshift-pipelines
  # - chart: openshift-virtualization
  # - chart: opentelemetry
  # - chart: portworx
  # - chart: quay
