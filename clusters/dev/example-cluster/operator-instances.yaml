# Cluster-level operator instance overrides. Configures operator CRs deployed
# by the cert-manager-certs chart. Enables Let's Encrypt via DNS01/Route53.
acmeIssuer:
  include: true
  email: your-email@example.com
  dns01:
    region: us-east-2
    hostedZoneID: YOUR_HOSTED_ZONE_ID
    recursiveNameserversOnly: true

# --- ACS secured cluster (minimal) ---
securedCluster:
  sensor:
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2
        memory: 4Gi
  scannerV4:
    scannerComponent: Disabled
  perNode:
    collector:
      collection: CORE_BPF
      imageFlavor: Slim
  admissionControl:
    listenOnCreates: false
    listenOnUpdates: false
    listenOnEvents: false

# --- compliance scanning ---
scanSetting:
  include: true
scanSettingBinding:
  include: true
