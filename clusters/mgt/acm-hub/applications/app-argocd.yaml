apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openshift-gitops-config
  namespace: openshift-gitops
  labels:
    environment: mgt
    cluster: acm-hub
    type: app-of-apps
spec:
  destination:
    server: 'https://kubernetes.default.svc'
  project: default
  source:
    path: clusters/mgt/acm-hub
    repoURL: >-
      git@github.com:blediagolli/gitops-for-organizations.git
    targetRevision: main
  syncPolicy: {}
