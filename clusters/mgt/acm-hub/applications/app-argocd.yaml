apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-root
  namespace: openshift-gitops
  labels:
    environment: mgt
    cluster: acm-hub
    type: app-of-apps
spec:
  destination:
    server: 'https://kubernetes.default.svc'
  project: default
  source:
    path: clusters/mgt/acm-hub
    repoURL: >-
      git@github.com:YOUR_ORG/ocp-cluster-automation.git
    targetRevision: main
  syncPolicy:
    automated:
      selfHeal: true
