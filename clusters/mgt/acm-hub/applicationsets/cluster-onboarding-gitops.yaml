apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: onboarding-gitops
  namespace: openshift-gitops
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - matrix:
        generators:
          - git:
              repoURL: git@github.com:blediagolli/gitops-for-organizations.git
              revision: main
              files:
                - path: "clusters/**/conf.yaml"
          - git:
              repoURL: git@github.com:blediagolli/gitops-for-organizations.git
              revision: main
              files:
                - path: "{{.path.path}}/teams/*.yaml"
  template:
    metadata:
      name: 'onboarding-gitops-{{.cluster.environment}}-{{.cluster.name}}-{{.team.name}}'
      labels:
        environment: '{{.cluster.environment}}'
        cluster: '{{.cluster.name}}'
        type: onboarding-gitops
    spec:
      project: platform
      source:
        repoURL: git@github.com:blediagolli/gitops-for-organizations.git
        targetRevision: main
        path: charts/onboarding/application-gitops
        helm:
          valueFiles:
            - '/env/{{.cluster.environment}}/conf.yaml'
            - '/{{ trimSuffix "/teams" .path.path }}/conf.yaml'
            - '/{{.path.path}}/{{.path.filename}}'
      destination:
        server: '{{.cluster.address}}'
      syncPolicy:
        automated:
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: 5
          backoff:
            duration: 30s
            maxDuration: 10m
            factor: 2
