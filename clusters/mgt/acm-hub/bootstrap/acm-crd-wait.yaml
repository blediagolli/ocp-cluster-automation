apiVersion: v1
kind: ServiceAccount
metadata:
  name: acm-crd-wait
  namespace: open-cluster-management
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: acm-crd-reader
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
rules:
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: acm-crd-reader-binding
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: acm-crd-reader
subjects:
  - kind: ServiceAccount
    name: acm-crd-wait
    namespace: open-cluster-management
---
apiVersion: batch/v1
kind: Job
metadata:
  name: acm-crd-wait
  namespace: open-cluster-management
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      serviceAccountName: acm-crd-wait
      restartPolicy: OnFailure
      containers:
        - name: crd-wait
          image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
          command:
            - /bin/bash
            - -c
            - |
              echo "Waiting for MultiClusterHub CRD..."
              until oc get crd multiclusterhubs.operator.open-cluster-management.io &>/dev/null; do
                echo "CRD not yet available, retrying in 10s..."
                sleep 10
              done
              echo "MultiClusterHub CRD is available."
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      terminationGracePeriodSeconds: 0
