apiVersion: v1
kind: ServiceAccount
metadata:
  name: acm-mch-wait
  namespace: open-cluster-management
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: acm-mch-wait
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
rules:
  - apiGroups:
      - operator.open-cluster-management.io
    resources:
      - multiclusterhubs
    verbs:
      - get
      - list
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: acm-mch-wait-binding
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: acm-mch-wait
subjects:
  - kind: ServiceAccount
    name: acm-mch-wait
    namespace: open-cluster-management
---
apiVersion: batch/v1
kind: Job
metadata:
  name: acm-mch-wait
  namespace: open-cluster-management
  annotations:
    argocd.argoproj.io/sync-wave: "6"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      serviceAccountName: acm-mch-wait
      restartPolicy: OnFailure
      containers:
        - name: mch-wait
          image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
          command:
            - /bin/bash
            - -c
            - |
              echo "Waiting for MultiClusterHub to be ready..."
              until oc get multiclusterhub multiclusterhub -n open-cluster-management -o jsonpath='{.status.phase}' 2>/dev/null | grep -q "Running"; do
                echo "MCH not ready yet, retrying in 30s..."
                sleep 30
              done
              echo "MultiClusterHub is running."

              echo "Waiting for AgentServiceConfig CRD..."
              until oc get crd agentserviceconfigs.agent-install.openshift.io &>/dev/null; do
                echo "AgentServiceConfig CRD not yet available, retrying in 10s..."
                sleep 10
              done
              echo "AgentServiceConfig CRD is available."

              echo "Waiting for HiveConfig CRD..."
              until oc get crd hiveconfigs.hive.openshift.io &>/dev/null; do
                echo "HiveConfig CRD not yet available, retrying in 10s..."
                sleep 10
              done
              echo "HiveConfig CRD is available."
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      terminationGracePeriodSeconds: 0
