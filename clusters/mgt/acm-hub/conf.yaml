cluster:
  name: acm-hub
  environment: mgt
  address: "https://kubernetes.default.svc"
operators:
  openshift-gitops:
    channel: gitops-1.21
  advanced-cluster-management:
    channel: release-2.17
  advanced-cluster-security:
    include: true
    channel: stable
  ansible-automation-platform:
    channel: stable-2.6
  cert-manager:
    channel: stable-v1
  cloudnative-pg:
    channel: stable-v1
  cluster-observability:
    include: true
    channel: stable
  compliance-operator:
    channel: stable
  dev-spaces:
    channel: stable
  developer-hub:
    channel: fast-1.9
  external-secrets-operator:
    include: true
    channel: stable-v1
  gitlab:
    channel: stable
  gitlab-runner:
    channel: stable
  jfrog:
    channel: alpha
  kiali:
    channel: stable
  openshift-local-storage:
    channel: stable
  openshift-logging:
    include: true
    channel: stable-6.6
  loki:
    channel: stable-6.5
  lvm:
    channel: stable-4.22
  metallb:
    channel: stable
  mtv:
    channel: release-v2.10
  nmstate:
    channel: stable
  node-feature-discovery:
    channel: stable
  node-maintenance:
    channel: stable
  odf-operator:
    channel: stable-4.22
  openshift-pipelines:
    channel: pipelines-1.21
  openshift-virtualization:
    channel: stable
  opentelemetry:
    channel: stable
  quay:
    channel: stable-3.17
  servicemesh3:
    channel: stable
  tempo:
    channel: stable
  trident:
    channel: stable
  trusted-artifact-signer:
    channel: stable
central:
  include: true
  initBundle:
    include: true
  consoleLink:
    include: true
    centralUrl: "https://central-stackrox.apps.cluster-c8444.dyn.redhatworkshops.io"
centralNamespace:
  include: true
securedCluster:
  include: true
  clusterName: acm-hub
  centralEndpoint: "central-stackrox.apps.cluster-c8444.dyn.redhatworkshops.io:443"
securedClusterNamespace:
  include: false
projectConfig:
  include: true
  projectRequestMessage: "Contact platform-team to request a project."
selfProvisioners:
  include: true
networkPolicy:
  include: true
resourceQuota:
  include: true
limitRange:
  include: true
roleBindings:
  include: true
serviceAccount:
  include: true
egressFirewall:
  include: true
  rules:
    - type: Allow
      to:
        cidrSelector: 0.0.0.0/0
userWorkloadMonitoring:
  include: true
  prometheus:
    retention: 48h
    storageClass: ocs-external-storagecluster-ceph-rbd
    pvcSize: 50Gi
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 6Gi
etcdDefrag:
  include: true
  schedule: "0 3 * * 0"
  fragmentationThreshold: 50
etcdBackup:
  include: true
  schedule: "0 */6 * * *"
  retentionCount: 7
  storage:
    type: obc
    obc:
      name: etcd-backup-bucket
      storageClass: openshift-storage.noobaa.io
