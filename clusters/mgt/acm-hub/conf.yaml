# Cluster identity and ApplicationSet config. The git file generators read this
# file to discover which charts to deploy, how to reach the cluster, and where
# to find values overrides. Values here are available to all charts as .Values.cluster.*.
#
# This is the management (hub) cluster: it runs ACM, ArgoCD, and the shared
# platform services the managed clusters depend on.
cluster:
  name: acm-hub
  environment: mgt
  # The hub reconciles itself, so ArgoCD talks to the local API server.
  address: "https://kubernetes.default.svc"
  baseDomain: "apps.acm-hub.example.com"
  # Charts that provision storage read cluster.storageClass. Set it to a
  # StorageClass that exists on your cluster, or leave it unset and let each
  # chart fall back to its own default.
  # storageClass: ""

# Platform charts deployed to the hub, in order. Nothing is enabled: which
# charts the hub runs is your decision, not this repository's. Uncomment the
# ones you want and delete the rest — the list below is the full catalogue of
# charts/platform-config/. Each chart's fields are documented in
# docs/reference/platform-config.yaml.
platformCharts: []
