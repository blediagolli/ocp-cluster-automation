# Cluster identity and ApplicationSet config. The git file generators read this
# file to discover which charts to deploy, how to reach the cluster, and where
# to find values overrides. Values here are available to all charts as .Values.cluster.*.
cluster:
  name: acm-hub
  environment: mgt
  address: "https://kubernetes.default.svc"
  baseDomain: "apps.acm-hub.sandbox1269.opentlc.com"
  storageClass: "gp3-csi"
platformCharts:
  - chart: tls-certificates
  # - chart: user-workload-monitoring
  # - chart: project-request-template
  # - chart: etcd-defrag
  # - chart: etcd-backup
  # - chart: openshift-apiserver
  # - chart: openshift-ingress
  # - chart: vault-server
operatorInstanceCharts:
  - chart: cert-manager-certs
  # - chart: openshift-gitops-instance
  # - chart: acm-multiclusterhub
  # - chart: acs-secured-cluster
  # - chart: aap-instance
  # - chart: acs-central
  # - chart: acm-observability
  # - chart: keycloak-instance
  # - chart: quay-registry
  # - chart: cluster-observability
deployOperators: true
deployOverlay: false
deployImport: false
deployProvision: false
teams: []
