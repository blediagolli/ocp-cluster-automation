# Cluster-level operator Subscriptions. Each key under 'operators' becomes an
# OLM Subscription (Namespace, OperatorGroup, Subscription). Set include: false
# to skip an operator inherited from the environment level.
# Precedence: chart defaults < env/<env>/operator-deployment.yaml < this file.
operators:
  openshift-gitops:
    include: true
    channel: gitops-1.21
  advanced-cluster-management:
    include: true
    channel: release-2.17
  advanced-cluster-security:
    include: true
    channel: stable
  ansible-automation-platform:
    include: true
    channel: stable-2.6
  cluster-observability:
    include: true
    channel: stable
  external-secrets-operator:
    include: true
    channel: stable-v1
  openshift-logging:
    include: true
    channel: stable-6.6
  keycloak:
    include: true
    channel: stable-v26
  quay:
    include: true
    channel: stable-3.17
  quay-bridge:
    include: true
    channel: stable-3.17
