# Cluster-level operator instance overrides. Enables and configures operator
# Custom Resources (CRs) for this cluster. Each top-level key maps to a section
# in the corresponding operator-instances Helm chart.
# Precedence: chart defaults < env/<env>/operator-instances.yaml < this file.
argocd:
  include: true
clusterRoleBinding:
  include: true
appProject:
  include: true
consolePlugin:
  include: true
multiClusterHub:
  include: true
assistedService:
  include: true
hiveConfig:
  include: true
gitopsCluster:
  include: true
consolePlugins:
  include: true
central:
  include: true
  createNamespace: true
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 4Gi
  scanner:
    analyzer:
      scaling:
        minReplicas: 1
        maxReplicas: 3
        replicas: 1
  scannerV4:
    indexer:
      scaling:
        minReplicas: 1
        maxReplicas: 3
        replicas: 1
    matcher:
      scaling:
        minReplicas: 1
        maxReplicas: 3
        replicas: 1
initBundle:
  include: true
  distributeAuth: true
oidc:
  include: true
  clientSecret: "CHANGEME_STACKROX_OIDC_CLIENT_SECRET"
defaultTLS:
  include: true
trustedCA:
  include: true
centralConsoleLink:
  include: true
securedCluster:
  include: true
  secretMode: "job"
  consolePlugin:
    include: true
multiClusterObservability:
  include: true
observabilityConsoleLink:
  include: true
quayRegistry:
  include: true
  config:
    superUsers:
      - quayadmin
      - admin
    actionLogRotation:
      include: true
    restrictedUsers:
      include: true
      whitelist:
        - quayadmin
        - admin
  oidc:
    include: true
    server: "https://sso.apps.CLUSTER_DOMAIN/realms/sso/"
    clientId: "quay"
    clientSecret: "CHANGEME_QUAY_OIDC_CLIENT_SECRET"
  bridge:
    include: true
    oauthToken: "CHANGEME_QUAY_BRIDGE_OAUTH_TOKEN"
  init:
    include: true
    quayUrl: "https://registry-quay-quay-enterprise.apps.CLUSTER_DOMAIN"
    oauthToken: "CHANGEME_QUAY_INIT_OAUTH_TOKEN"
    organizations:
      - name: platform
        email: platform@demo.redhat.com
      - name: team-alpha
        email: team-alpha@demo.redhat.com
      - name: team-beta
        email: team-beta@demo.redhat.com
    teams:
      - org: platform
        name: admins
        role: admin
        description: "Platform administrators"
        syncGroup: "admins"
      - org: platform
        name: devs
        role: member
        description: "Platform developers"
        syncGroup: "users"
      - org: team-alpha
        name: devs
        role: member
        description: "Team Alpha developers"
      - org: team-beta
        name: devs
        role: member
        description: "Team Beta developers"
    repositories:
      - org: platform
        name: base-images
        visibility: private
        description: "Curated base images"
    robotAccounts:
      - org: platform
        name: cicd
        description: "CI/CD pipeline push/pull"
        permissions:
          - repo: base-images
            role: write
      - org: platform
        name: pull
        description: "Read-only pull access"
        permissions:
          - repo: base-images
            role: read
keycloak:
  include: true
  createNamespace: true
  instances: 1
realm:
  include: true
  groups:
    - name: admins
    - name: users
  users:
    - username: admin
      email: admin@demo.redhat.com
      firstName: Admin
      lastName: Demo
      realmRoles:
        - admin
      groups:
        - admins
      credentials:
        - type: password
          value: CHANGEME_KEYCLOAK_ADMIN_PASSWORD
          temporary: false
    - username: user1
      email: user1@demo.redhat.com
      firstName: User1
      lastName: Demo
      realmRoles:
        - user
      groups:
        - users
      credentials:
        - type: password
          value: CHANGEME_KEYCLOAK_USER_PASSWORD
          temporary: false
  clients:
    quay:
      include: true
      clientSecret: "CHANGEME_QUAY_OIDC_CLIENT_SECRET"
      redirectUris:
        - "https://registry-quay-quay-enterprise.apps.CLUSTER_DOMAIN/oauth2/callback"
      webOrigins:
        - "https://registry-quay-quay-enterprise.apps.CLUSTER_DOMAIN"
    openshift:
      include: true
      clientSecret: "CHANGEME_OPENSHIFT_OIDC_CLIENT_SECRET"
      redirectUris:
        - "https://oauth-openshift.apps.example-cluster.example.com/oauth2callback/keycloak"
      webOrigins:
        - "https://oauth-openshift.apps.example-cluster.example.com"
    stackrox:
      include: true
      clientSecret: "CHANGEME_STACKROX_OIDC_CLIENT_SECRET"
      redirectUris:
        - "https://central-stackrox.apps.CLUSTER_DOMAIN/sso/providers/oidc/callback"
      webOrigins:
        - "https://central-stackrox.apps.CLUSTER_DOMAIN"
uiPlugins:
  dashboards:
    include: true
  troubleshootingPanel:
    include: true
  monitoring:
    include: true
    clusterHealthAnalyzer:
      enabled: true
monitoringStacks:
  - include: true
    name: platform-monitoring
    namespace: platform-monitoring
    createNamespace: true
    namespaceSelector:
      matchExpressions:
        - key: openshift.io/cluster-monitoring
          operator: DoesNotExist
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 4Gi
    retention: 7d
    prometheusConfig:
      replicas: 1
      persistentVolumeClaim:
        storageClassName: YOUR_STORAGE_CLASS
        resources:
          requests:
            storage: 50Gi
thanosQueriers:
  - include: true
    name: platform-querier
    namespace: platform-monitoring
    selector:
      matchLabels: {}
aap:
  include: true
