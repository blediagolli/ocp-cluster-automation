# Cluster-level operator instance overrides. Enables and configures operator
# Custom Resources (CRs) for this cluster. Each top-level key maps to a section
# in the corresponding operator-instances Helm chart.
# Precedence: chart defaults < env/<env>/operator-instances.yaml < this file.
argocd:
  include: true
clusterRoleBinding:
  include: true
appProject:
  include: true
consolePlugin:
  include: true
multiClusterHub:
  include: true
assistedService:
  include: true
hiveConfig:
  include: true
gitopsCluster:
  include: true
consolePlugins:
  include: true
central:
  include: true
  createNamespace: true
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 4Gi
  scanner:
    analyzer:
      scaling:
        minReplicas: 1
        maxReplicas: 3
        replicas: 1
  scannerV4:
    indexer:
      scaling:
        minReplicas: 1
        maxReplicas: 3
        replicas: 1
    matcher:
      scaling:
        minReplicas: 1
        maxReplicas: 3
        replicas: 1
