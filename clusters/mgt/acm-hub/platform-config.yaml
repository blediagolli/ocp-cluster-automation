# Cluster-level platform config overrides. Enables and configures platform
# charts (monitoring, etcd, project config, network policy, etc.) for this
# cluster. Each top-level key maps to a platform-config Helm chart.
# Precedence: chart defaults < env/<env>/platform-config.yaml < this file.
projectConfig:
  include: true
  projectRequestMessage: "Contact platform-team to request a project."
selfProvisioners:
  include: true
networkPolicy:
  include: true
resourceQuota:
  include: true
limitRange:
  include: true
roleBindings:
  include: true
serviceAccount:
  include: true
egressFirewall:
  include: true
  rules:
    - type: Allow
      to:
        cidrSelector: 0.0.0.0/0
userWorkloadMonitoring:
  include: true
  prometheus:
    retention: 48h
    pvcSize: 50Gi
    resources:
      limits:
        cpu: "2"
        memory: 6Gi
etcdDefrag:
  include: true
etcdBackup:
  include: true
