# Cluster
cluster:
  registry: quay-dev.io

# Marketplace
catalogSource:
  include: false
  rh_catalog_version: v4.22

# Openshift-ingress
ingress:
  service:
    include: false
  controller:
    include: false
    default:
      placement: node-role.kubernetes.io/master
      replicas: 1
      syslog: true
    domains:
      - { name: intranet, http_port: 30400, https_port: 31400, replicas: 1 }
      - { name: extranet, http_port: 30500, https_port: 31500, replicas: 1 }
    syslog:
      address: 10.0.0.1

# Openshift Config
config:
  include: false

# MachineConfig
machineConfig:
  include: false

# Operators
securedCluster:
  include: true
  secretMode: "external"
  centralEndpoint: "central-stackrox.apps.cluster-c8444.dyn.redhatworkshops.io:443"
securedClusterNamespace:
  include: true

operators:
  openshift-gitops:
    include: false
  advanced-cluster-security:
    include: false

scanSetting:
  include: false
scanSettingBinding:
  include: false