# Cluster
cluster:
  registry: quay-dev.io

# Marketplace
catalogSource:
  include: false
  rh_catalog_version: v4.22

# Openshift-ingress
ingress:
  service:
    include: false
  controller:
    include: false
    default:
      placement: node-role.kubernetes.io/master
      replicas: 1
      syslog: true
    domains:
      - { name: intranet, http_port: 30400, https_port: 31400, replicas: 1 }
      - { name: extranet, http_port: 30500, https_port: 31500, replicas: 1 }
    syslog:
      address: 10.0.0.1

# Openshift Config
config:
  include: false

# MachineConfig
machineConfig:
  include: false

# Operators
securedCluster:
  include: true
  secretMode: "generate"
  centralEndpoint: "central-stackrox.apps.cluster-c8444.dyn.redhatworkshops.io:443"
securedClusterNamespace:
  include: true

operators:
  openshift-gitops:
    include: false
  advanced-cluster-security:
    include: false

scanSetting:
  include: false
scanSettingBinding:
  include: false

namespaceSizes:
  small:
    resourceQuota:
      hard:
        requests.cpu: "1"
        requests.memory: 2Gi
        limits.cpu: "2"
        limits.memory: 4Gi
        pods: "10"
        persistentvolumeclaims: "5"
        requests.storage: 10Gi
    limitRange:
      limits:
        - type: Container
          default:
            cpu: 200m
            memory: 256Mi
          defaultRequest:
            cpu: 50m
            memory: 128Mi
          max:
            cpu: "1"
            memory: 2Gi
          min:
            cpu: 25m
            memory: 32Mi
  medium:
    resourceQuota:
      hard:
        requests.cpu: "4"
        requests.memory: 8Gi
        limits.cpu: "8"
        limits.memory: 16Gi
        pods: "20"
        persistentvolumeclaims: "10"
        requests.storage: 50Gi
    limitRange:
      limits:
        - type: Container
          default:
            cpu: 500m
            memory: 512Mi
          defaultRequest:
            cpu: 100m
            memory: 256Mi
          max:
            cpu: "4"
            memory: 8Gi
          min:
            cpu: 50m
            memory: 64Mi
  large:
    resourceQuota:
      hard:
        requests.cpu: "8"
        requests.memory: 16Gi
        limits.cpu: "16"
        limits.memory: 32Gi
        pods: "50"
        persistentvolumeclaims: "20"
        requests.storage: 100Gi
    limitRange:
      limits:
        - type: Container
          default:
            cpu: "1"
            memory: 1Gi
          defaultRequest:
            cpu: 200m
            memory: 512Mi
          max:
            cpu: "8"
            memory: 16Gi
          min:
            cpu: 50m
            memory: 64Mi