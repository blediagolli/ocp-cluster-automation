# Cluster
cluster:
  registry: quay-prod.io

# Marketplace
catalogSource:
  include: false
  rh_catalog_version: v4.22

# Openshift-ingress
ingress:
  service:
    include: false
  controller:
    include: false
    default:
      placement: node-role.kubernetes.io/master
      replicas: 3
      syslog: true
    domains:
      - { name: intranet, http_port: 30600, https_port: 31600, replicas: 3 }
      - { name: extranet, http_port: 30700, https_port: 31700, replicas: 3 }
    syslog:
      address: 10.0.0.3

# Openshift Config
config:
  include: false

# MachineConfig
machineConfig:
  include: false

# Operators
operators:
  openshift-gitops:
    include: false
  external-secrets-operator:
    include: false

namespaceSizes:
  small:
    resourceQuota:
      hard:
        requests.cpu: "2"
        requests.memory: 4Gi
        limits.cpu: "4"
        limits.memory: 8Gi
        pods: "20"
        persistentvolumeclaims: "10"
        requests.storage: 25Gi
    limitRange:
      limits:
        - type: Container
          default:
            cpu: 500m
            memory: 512Mi
          defaultRequest:
            cpu: 100m
            memory: 256Mi
          max:
            cpu: "2"
            memory: 4Gi
          min:
            cpu: 50m
            memory: 64Mi
  medium:
    resourceQuota:
      hard:
        requests.cpu: "8"
        requests.memory: 16Gi
        limits.cpu: "16"
        limits.memory: 32Gi
        pods: "40"
        persistentvolumeclaims: "20"
        requests.storage: 100Gi
    limitRange:
      limits:
        - type: Container
          default:
            cpu: "1"
            memory: 1Gi
          defaultRequest:
            cpu: 200m
            memory: 512Mi
          max:
            cpu: "8"
            memory: 16Gi
          min:
            cpu: 50m
            memory: 64Mi
  large:
    resourceQuota:
      hard:
        requests.cpu: "16"
        requests.memory: 32Gi
        limits.cpu: "32"
        limits.memory: 64Gi
        pods: "100"
        persistentvolumeclaims: "40"
        requests.storage: 250Gi
    limitRange:
      limits:
        - type: Container
          default:
            cpu: "2"
            memory: 2Gi
          defaultRequest:
            cpu: 500m
            memory: 1Gi
          max:
            cpu: "16"
            memory: 32Gi
          min:
            cpu: 50m
            memory: 64Mi
