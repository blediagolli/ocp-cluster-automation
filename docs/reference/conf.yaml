# ── Cluster Identity ──────────────────────────────────────────────────────────
# Available to all charts as .Values.cluster.*

cluster:
  # Cluster name — must match the directory name under clusters/<env>/
  name: example-cluster
  # Environment — must match a directory under env/ (dev, mgt, prod)
  environment: dev
  # API server address — for managed clusters use the ACM cluster-proxy URL;
  # for the hub use https://kubernetes.default.svc
  address: "https://cluster-proxy-addon-user.multicluster-engine.svc.cluster.local:9092/example-cluster"
  # Cluster base domain — used by TLS charts for cert dnsNames
  baseDomain: example.com
  # Default storage class — used by charts that need PVCs (etcd-backup, monitoring, etc.)
  storageClass: YOUR_STORAGE_CLASS

# ── Platform Charts ──────────────────────────────────────────────────────────
# Charts from charts/platform-config/ — each gets an ArgoCD Application via
# the cluster-platform-config ApplicationSet. Values come from platform-config.yaml.

platformCharts:

  # ── Critical — enable on every cluster ──

  - chart: tls-certificates          # API server + ingress wildcard certs
  - chart: openshift-apiserver       # API server config — audit logging, named certificates
  - chart: openshift-ingress         # Ingress controller — replicas, default cert, endpoint publishing
  - chart: openshift-proxy           # Cluster-wide proxy and custom CA trust bundle
  - chart: openshift-oauth           # Identity provider configuration (LDAP, OIDC, HTPasswd)
  - chart: openshift-image-registry  # Internal registry config (storage backend, routes)
  - chart: global-pull-secrets       # Pull secrets for external registries
  - chart: openshift-machine-config  # MachineConfig, KubeletConfig, ContainerRuntimeConfig
  - chart: acm-managed-cluster       # ManagedCluster resource configuration

  # ── Recommended — enable on most clusters ──

  - chart: etcd-backup               # Automated etcd backup CronJob
  - chart: etcd-defrag               # Automated etcd defrag with threshold alerting
  - chart: user-workload-monitoring  # Prometheus monitoring for user workloads
  - chart: project-request-template  # Default namespace resources (NetworkPolicy, LimitRange, ResourceQuota)
  - chart: machine-health-checks     # Auto-remediation of unhealthy nodes
  - chart: image-pruner              # Automatic cleanup of old images in the internal registry
  - chart: openshift-console         # Console branding, links, and customization
  - chart: prometheus-rules          # Critical cluster alert rules
  - chart: alertmanager-config       # Alert routing and notification (Slack, PagerDuty, email)
  - chart: rbac                      # Cluster RBAC — ClusterRoles, ClusterRoleBindings
  - chart: openshift-build           # Cluster-wide build defaults
  - chart: openshift-group-sync      # LDAP/AD group sync CronJob
  - chart: acm-policies              # ACM governance policies (hub-driven)

  # ── Nice to Have — enable based on workload needs ──

  - chart: storage-classes           # Custom StorageClass definitions
  - chart: pure-storage-node-config  # Pure FlashArray host prerequisites (multipath/udev/iSCSI)
  - chart: volume-snapshot-classes   # VolumeSnapshotClass for CSI drivers
  - chart: openshift-image           # Cluster-wide image configuration (registries, policies)
  - chart: image-mirror-config       # ImageDigestMirrorSet for registry mirroring
  - chart: openshift-dns             # DNS configuration (upstream resolvers, node placement)
  - chart: openshift-scheduler       # Scheduler profile (LowNodeUtilization, HighNodeUtilization)
  - chart: openshift-marketplace     # Custom CatalogSources
  - chart: admin-network-policy      # Cluster-scoped network policies (OVN-Kubernetes)
  - chart: vault-server              # HashiCorp Vault with Raft storage

# ── Operator Instance Charts ─────────────────────────────────────────────────
# Charts from charts/operator-instances/ — each gets an ArgoCD Application via
# the cluster-operator-instances ApplicationSet. Values come from operator-instances.yaml.

operatorInstanceCharts:

  # ── Critical ──

  - chart: openshift-gitops-instance       # ArgoCD instance configuration

  # ── Recommended ──

  - chart: acs-secured-cluster             # Connects cluster to ACS Central on the hub
  - chart: compliance-scans                # CIS/NIST compliance scanning
  - chart: acm-multiclusterhub             # ACM MultiClusterHub (hub only)
  - chart: acm-observability               # ACM Observability (hub only)
  - chart: acs-central                     # ACS Central (hub only)
  - chart: logging-lokistack               # Loki log aggregation
  - chart: odf-storagecluster              # OpenShift Data Foundation (Ceph)
  - chart: local-storage-volumes           # Local disk provisioning

  # ── Nice to Have ──

  - chart: cluster-observability           # COO UIPlugins (dashboards, tracing, logging, monitoring)
  - chart: cert-manager-certs              # ClusterIssuers (self-signed CA or Let's Encrypt ACME)
  - chart: gatekeeper-instance             # OPA Gatekeeper policy admission control
  - chart: kyverno-instance                # Kyverno policy admission control
  - chart: aap-instance                    # Ansible Automation Platform Controller + Hub
  - chart: keycloak-instance               # Keycloak Identity and SSO
  - chart: quay-registry                   # Quay private container registry
  - chart: opentelemetry-instance          # OpenTelemetry collector
  - chart: tempo-instance                  # Tempo distributed tracing backend
  - chart: lvm-cluster                     # LVM thin-provisioning (SNO, compact clusters)
  - chart: metallb-config                  # Bare-metal load balancer
  - chart: nmstate-config                  # Declarative node network config
  - chart: node-feature-discovery-instance # Auto-label nodes by hardware features
  - chart: openshift-virtualization-instance # KubeVirt for running VMs
  - chart: mtv-controller                  # Migration Toolkit for Virtualization
  - chart: servicemesh3-instance           # Istio service mesh
  - chart: servicemesh-ambient             # Istio ambient mesh (sidecar-less)
  - chart: trident-config                  # NetApp Trident CSI
  - chart: external-secrets                # ExternalSecret CRs (Vault, AWS SM, etc.)
  - chart: group-sync                      # Group sync operator instance
  - chart: oadp-config                     # OADP backup/restore configuration
  - chart: velero-config                   # Velero backup/restore configuration
  - chart: trusted-artifact-signer-instance # Sigstore-based artifact signing

# ── Deploy Toggles ───────────────────────────────────────────────────────────
# Boolean gates that control which ApplicationSets generate Applications for this cluster.

# Deploy operator Subscriptions via OLM (charts/operator-deployment/)
deployOperators: true

# Deploy cluster-specific raw manifests from a clusters/<env>/<name>/overlay/ directory
deployOverlay: false

# Import this cluster into ACM (ManagedCluster + KlusterletAddonConfig)
deployImport: true

# Provision this cluster via ACM/Hive — enable only for new cluster deployments
deployProvision: false

# ── Team Onboarding ──────────────────────────────────────────────────────────
# Teams listed here get ArgoCD AppProjects and namespaces with quotas/policies
# via the cluster-onboarding-gitops and cluster-onboarding-namespaces ApplicationSets.
# Team definitions live in teams/<team-name>.yaml.

teams:
  - team: team-alpha
  - team: team-beta
