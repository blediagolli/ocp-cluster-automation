# --- oadp-config: OpenShift API for Data Protection ---
oadp:
  include: false
  namespace: openshift-adp
  velero:
    defaultPlugins:
      - openshift
      - csi
    customPlugins: []
    featureFlags: []
    resources:
      requests:
        cpu: 500m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
  nodeAgent:
    enable: false
    uploaderType: kopia                      # restic or kopia
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
    tolerations: []
    nodeSelector: {}
  backupLocations: []
  # - name: default
  #   provider: aws
  #   default: true
  #   bucket: my-backup-bucket
  #   prefix: velero
  #   region: us-east-1
  #   credentialName: cloud-credentials
  #   credentialKey: cloud
  snapshotLocations: []
  # - name: default
  #   provider: aws
  #   region: us-east-1

# --- velero-config: Velero backup schedules and storage ---
velero:
  include: false
  namespace: openshift-adp
  backupStorageLocation:
    include: false
    name: default
    provider: aws
    bucket: ""
    prefix: velero
    region: us-east-1
    credentialSecretName: cloud-credentials
    config: {}
  volumeSnapshotLocation:
    include: false
    name: default
    provider: aws
    region: us-east-1
    config: {}
  schedules:
    - name: daily-full
      include: false
      schedule: "0 2 * * *"
      ttl: 720h                              # 30 days
      includedNamespaces: []
      excludedNamespaces:
        - openshift-*
        - kube-*
      includeClusterResources: true
      snapshotVolumes: true
      storageLocation: default
      volumeSnapshotLocations:
        - default
    - name: weekly-full
      include: false
      schedule: "0 3 * * 0"
      ttl: 2160h                             # 90 days
      includedNamespaces: []
      excludedNamespaces:
        - openshift-*
        - kube-*
      includeClusterResources: true
      snapshotVolumes: true
      storageLocation: default
      volumeSnapshotLocations:
        - default

# --- trusted-artifact-signer-instance: Sigstore-based artifact signing ---
tas:
  include: false
  name: tas-instance
  namespace: openshift-rhtas-operator
  fulcioEnabled: true
  rekoEnabled: true
  tufEnabled: true
