# Reference: provision.yaml
#
# Provisioning values for ACM/Hive cluster creation. Only needed for clusters
# with deployProvision: true in conf.yaml.
#
# Precedence: chart defaults < env/<env>/provision.yaml < clusters/<env>/<name>/provision.yaml
#
# Choose ONE platform section below (aws, vsphere, baremetal, none) and delete
# the others. Cross-platform options (proxy, ntp, ignition, custom manifests,
# networking, disconnected registry) apply to any platform.

provision:
  include: false                      # set true to provision this cluster

# ── Cluster identity ────────────────────────────────────────────────────────────

cluster:
  name: example-cluster               # cluster name (used in ClusterDeployment/AgentClusterInstall)
  baseDomain: example.com             # base domain (cluster API: api.<name>.<baseDomain>)
  platform: aws                       # vsphere | aws | baremetal | none
  environment: dev                    # environment label
  clusterSet: default                 # ManagedClusterSet membership
  imageSetRef: img4.22.13-x86-64-appsub  # ClusterImageSet reference
  networkType: OVNKubernetes          # OVNKubernetes | OpenShiftSDN
  sshPublicKey: "ssh-ed25519 AAAA..." # SSH public key for node access
  sshPrivateKey: ""                   # SSH private key (IPI platforms — stored in ClusterDeployment secret)
  pullSecret: ""                      # Red Hat pull secret JSON (usually set at env level)
  additionalTrustBundle: ""           # PEM CA bundle for private registries or corporate CAs
  fips: false                         # enable FIPS-validated cryptography

# ── Fleet labels ────────────────────────────────────────────────────────────────

fleet:
  operatorClusterType: dev            # label for operator profile selection
  operatorProfile: ocp-4.22           # label for operator channel profile

# ── Node counts ─────────────────────────────────────────────────────────────────

masters:
  count: 3                            # control plane nodes (3 for HA, 1 for SNO)

workers:
  count: 3                            # worker nodes (0 for compact/SNO)

# ── Platform: AWS (IPI) ────────────────────────────────────────────────────────

aws:
  accessKeyID: ""                     # AWS access key (usually injected via ExternalSecret)
  secretAccessKey: ""                 # AWS secret key (usually injected via ExternalSecret)
  region: us-east-2                   # AWS region
  masters:
    instanceType: m5.xlarge           # EC2 instance type for control plane
    zones: []                         # AZs (empty = auto-select; e.g. [us-east-2a, us-east-2b, us-east-2c])
    rootVolume:
      size: 120                       # root volume size in GB
      type: gp3                       # EBS volume type
  workers:
    instanceType: m5.xlarge           # EC2 instance type for workers
    zones: []                         # AZs (empty = auto-select)
    rootVolume:
      size: 120                       # root volume size in GB
      type: gp3                       # EBS volume type

# ── Platform: vSphere (IPI) ────────────────────────────────────────────────────

# vsphere:
#   vcenter: vcenter.example.com      # vCenter FQDN
#   username: administrator@vsphere.local
#   password: ""                      # vCenter password (usually injected via ExternalSecret)
#   datacenter: DC1                   # vSphere datacenter
#   datastore: datastore1             # default datastore
#   cluster: Cluster1                 # vSphere compute cluster
#   folder: /DC1/vm/openshift         # VM folder path
#   network: VM Network               # port group for VM networking
#   cacertificate: ""                 # vCenter CA cert (PEM, if using self-signed)
#   apiVIP: 10.0.0.10                 # API VIP (must be pre-allocated in DNS)
#   ingressVIP: 10.0.0.11            # ingress VIP (must be pre-allocated in DNS)
#   masters:
#     cpus: 4                         # vCPUs per control plane VM
#     coresPerSocket: 2               # cores per socket
#     memoryMB: 16384                 # memory in MB
#     diskGB: 120                     # disk size in GB
#   workers:
#     cpus: 4                         # vCPUs per worker VM
#     coresPerSocket: 2
#     memoryMB: 16384
#     diskGB: 120

