# ── Cross-platform options ─────────────────────────────────────────────────────

# Proxy (all platforms — IPI: install-config; agent-based: AgentClusterInstall + InfraEnv)
proxy:
  enabled: false
  # httpProxy: "http://proxy.internal.example.com:3128"
  # httpsProxy: "http://proxy.internal.example.com:3128"
  # noProxy: ".internal.example.com,.cluster.local,10.128.0.0/14,172.30.0.0/16"

# NTP (agent-based platforms — added to InfraEnv)
ntp:
  enabled: false
  # sources:
  #   - ntp1.internal.example.com
  #   - ntp2.internal.example.com

# Ignition override for discovery ISO (agent-based platforms — added to InfraEnv)
ignitionConfigOverride:
  enabled: false
  # config: '{"ignition":{"version":"3.1.0"},"storage":{"files":[...]}}'

# Day-0 custom manifests (IPI platforms — referenced by ClusterDeployment)
customManifests:
  enabled: false
  # data:
  #   99-chrony-masters.yaml: |
  #     apiVersion: machineconfiguration.openshift.io/v1
  #     kind: MachineConfig
  #     ...

# Networking (agent-based platforms)
networking:
  clusterNetwork:
    - cidr: 10.128.0.0/14
      hostPrefix: 23
    # - cidr: "fd01::/48"            # dual-stack
    #   hostPrefix: 64
  serviceNetwork:
    - 172.30.0.0/16
    # - "fd02::/112"                 # dual-stack
  machineNetwork: []
  # machineNetwork:
  #   - cidr: 10.206.220.0/24
  #   - cidr: "2610:30:401C:2352::/64"  # dual-stack

# Disconnected registry (optional — image mirroring for air-gapped installs)
imageContentSources:
  enabled: false
  # mirror: registry.disconnected.example.com/openshift4
  # registry: registry.disconnected.example.com
  # username: registry-user
  # password: registry-password
  # email: platform@example.com
