namespaceSizes:
  small:
    resourceQuota:
      hard:
        requests.cpu: "1"
        requests.memory: 2Gi
        limits.cpu: "2"
        limits.memory: 4Gi
        pods: "10"
        persistentvolumeclaims: "5"
        requests.storage: 10Gi
    limitRange:
      limits:
        - type: Container
          default:
            cpu: 200m
            memory: 256Mi
          defaultRequest:
            cpu: 50m
            memory: 128Mi
          max:
            cpu: "1"
            memory: 2Gi
          min:
            cpu: 25m
            memory: 32Mi
  medium:
    resourceQuota:
      hard:
        requests.cpu: "4"
        requests.memory: 8Gi
        limits.cpu: "8"
        limits.memory: 16Gi
        pods: "20"
        persistentvolumeclaims: "10"
        requests.storage: 50Gi
    limitRange:
      limits:
        - type: Container
          default:
            cpu: 500m
            memory: 512Mi
          defaultRequest:
            cpu: 100m
            memory: 256Mi
          max:
            cpu: "4"
            memory: 8Gi
          min:
            cpu: 50m
            memory: 64Mi
  large:
    resourceQuota:
      hard:
        requests.cpu: "8"
        requests.memory: 16Gi
        limits.cpu: "16"
        limits.memory: 32Gi
        pods: "50"
        persistentvolumeclaims: "20"
        requests.storage: 100Gi
    limitRange:
      limits:
        - type: Container
          default:
            cpu: "1"
            memory: 1Gi
          defaultRequest:
            cpu: 200m
            memory: 512Mi
          max:
            cpu: "8"
            memory: 16Gi
          min:
            cpu: 50m
            memory: 64Mi
