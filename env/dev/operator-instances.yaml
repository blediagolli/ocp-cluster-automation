# Environment-level operator instance overrides shared by all dev clusters.
# Configures operator CRs (e.g. SecuredCluster, ScanSetting). Cluster-level
# operator-instances.yaml can override individual settings.
securedCluster:
  include: true
  secretMode: "generate"
  centralEndpoint: "central-stackrox.apps.cluster-c8444.dyn.redhatworkshops.io:443"
securedClusterNamespace:
  include: true

scanSetting:
  include: false
scanSettingBinding:
  include: false
