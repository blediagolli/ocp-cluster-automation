# Cluster
cluster:
  registry: quay-prod.io

# Marketplace
catalogSource:
  include: false
  rh_catalog_version: v4.22

# Openshift-ingress
ingress:
  service:
    include: false
  controller:
    include: false
    default:
      placement: node-role.kubernetes.io/master
      replicas: 3
      syslog: true
    domains:
      - { name: intranet, http_port: 30600, https_port: 31600, replicas: 3 }
      - { name: extranet, http_port: 30700, https_port: 31700, replicas: 3 }
    syslog:
      address: 10.0.0.3

# Openshift Config
config:
  include: false

# MachineConfig
machineConfig:
  include: false

# Operators
operators:
  openshift-gitops:
    include: false
  external-secrets-operator:
    include: false
