# Environment-level t-shirt size definitions for team namespace provisioning.
# Defines ResourceQuota and LimitRange per size (small/medium/large).
# Cluster-level namespace-sizes.yaml can override individual sizes or limits.
namespaceSizes:
  small:
    resourceQuota:
      hard:
        requests.cpu: "2"
        requests.memory: 4Gi
        limits.cpu: "4"
        limits.memory: 8Gi
        pods: "20"
        persistentvolumeclaims: "10"
        requests.storage: 25Gi
    limitRange:
      limits:
        - type: Container
          default:
            cpu: 500m
            memory: 512Mi
          defaultRequest:
            cpu: 100m
            memory: 256Mi
          max:
            cpu: "2"
            memory: 4Gi
          min:
            cpu: 50m
            memory: 64Mi
  medium:
    resourceQuota:
      hard:
        requests.cpu: "8"
        requests.memory: 16Gi
        limits.cpu: "16"
        limits.memory: 32Gi
        pods: "40"
        persistentvolumeclaims: "20"
        requests.storage: 100Gi
    limitRange:
      limits:
        - type: Container
          default:
            cpu: "1"
            memory: 1Gi
          defaultRequest:
            cpu: 200m
            memory: 512Mi
          max:
            cpu: "8"
            memory: 16Gi
          min:
            cpu: 50m
            memory: 64Mi
  large:
    resourceQuota:
      hard:
        requests.cpu: "16"
        requests.memory: 32Gi
        limits.cpu: "32"
        limits.memory: 64Gi
        pods: "100"
        persistentvolumeclaims: "40"
        requests.storage: 250Gi
    limitRange:
      limits:
        - type: Container
          default:
            cpu: "2"
            memory: 2Gi
          defaultRequest:
            cpu: 500m
            memory: 1Gi
          max:
            cpu: "16"
            memory: 32Gi
          min:
            cpu: 50m
            memory: 64Mi
