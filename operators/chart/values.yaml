profile: ocp-4.22
clusterType: hub

operators:
  openshift-gitops:
    namespace: openshift-gitops
    operatorGroup: openshift-gitops-operator
    package: openshift-gitops-operator
    channelByProfile:
      ocp-4.21: gitops-1.20
      ocp-4.22: gitops-1.21
    source: redhat-operators
    sourceNamespace: openshift-marketplace
    instance: argocd
  advanced-cluster-management:
    namespace: open-cluster-management
    operatorGroup: open-cluster-management
    package: advanced-cluster-management
    channelByProfile:
      ocp-4.21: release-2.16
      ocp-4.22: release-2.17
    source: redhat-operators
    sourceNamespace: openshift-marketplace
    instance: multiclusterhub
  openshift-local-storage:
    namespace: openshift-local-storage
    operatorGroup: openshift-local-storage
    package: local-storage-operator
    channelByProfile:
      ocp-4.21: stable
      ocp-4.22: stable
    source: redhat-operators
    sourceNamespace: openshift-marketplace
  odf-operator:
    namespace: openshift-storage
    operatorGroup: openshift-storage-operator
    package: odf-operator
    channelByProfile:
      ocp-4.21: stable-4.21
      ocp-4.22: stable-4.22
    source: redhat-operators
    sourceNamespace: openshift-marketplace
    instance: storagecluster
  external-secrets-operator:
    namespace: external-secrets-operator
    operatorGroup: external-secrets-operator
    package: external-secrets-operator
    channelByProfile:
      ocp-4.21: stable
      ocp-4.22: stable
    source: community-operators
    sourceNamespace: openshift-marketplace
  openshift-logging:
    namespace: openshift-logging
    operatorGroup: openshift-logging
    package: cluster-logging
    channelByProfile:
      ocp-4.21: stable-6.5
      ocp-4.22: stable-6.6
    source: redhat-operators
    sourceNamespace: openshift-marketplace
    instance: clusterlogging

targets:
  ocp-4.22:
    hub:
      operators: [openshift-gitops, advanced-cluster-management, openshift-local-storage, odf-operator, external-secrets-operator, openshift-logging]
      instanceOverrides:
        argocd:
          ha:
            enabled: true
          server:
            replicas: 2
          repo:
            replicas: 2
          applicationSet:
            replicas: 2
        multiclusterhub:
          availabilityConfig: High
    prod:
      operators: [openshift-gitops, external-secrets-operator]
    dev:
      operators: [openshift-gitops]
  ocp-4.21:
    hub:
      operators: [openshift-gitops, advanced-cluster-management, openshift-local-storage, odf-operator, external-secrets-operator, openshift-logging]
      instanceOverrides:
        argocd:
          ha:
            enabled: true
          server:
            replicas: 2
          repo:
            replicas: 2
          applicationSet:
            replicas: 2
        multiclusterhub:
          availabilityConfig: High
    prod:
      operators: [openshift-gitops, external-secrets-operator]
    dev:
      operators: [openshift-gitops]

instances:
  argocd:
    apiVersion: argoproj.io/v1beta1
    kind: ArgoCD
    name: openshift-gitops
    spec:
      ha:
        enabled: false
      server:
        replicas: 1
        route:
          enabled: true
      controller:
        replicas: 1
      repo:
        replicas: 1
      applicationSet:
        replicas: 1
      sso:
        provider: dex
        dex:
          openShiftOAuth: true
      rbac:
        policy: |
          g, admins, role:admin
        scopes: '[groups]'
  multiclusterhub:
    apiVersion: operator.open-cluster-management.io/v1
    kind: MultiClusterHub
    name: multiclusterhub
    spec:
      availabilityConfig: High
  storagecluster:
    apiVersion: ocs.openshift.io/v1
    kind: StorageCluster
    name: ocs-external-storagecluster
    spec:
      externalStorage:
        enable: true
      encryption:
        keyRotation:
          schedule: '@weekly'
      managedResources:
        cephBlockPools:
          reconcileStrategy: init
        cephCluster: {}
        cephDashboard: {}
        cephFilesystems: {}
        cephNonResilientPools: {}
        cephObjectStoreUsers: {}
        cephObjectStores:
          enableSTS: true
        cephRBDMirror: {}
        cephToolbox: {}
      multiCloudGateway:
        disableLoadBalancerService: true
  clusterlogging:
    apiVersion: logging.openshift.io/v1
    kind: ClusterLogging
    name: instance
    spec:
      managementState: Managed
      collection:
        type: vector
