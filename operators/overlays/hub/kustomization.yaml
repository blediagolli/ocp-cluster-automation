apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Hub gets the full operator set.
resources:
  - ../../../base/operators/openshift-gitops/install
  - ../../../base/operators/openshift-gitops/instances/default
  - ../../../base/operators/advanced-cluster-management/install
  - ../../../base/operators/advanced-cluster-management/instances/default
  - ../../../base/operators/openshift-local-storage/install
  - ../../../base/operators/odf-operator/install
  - ../../../base/operators/odf-operator/instances/default
  - ../../../base/operators/external-secrets-operator/install
  - ../../../base/operators/openshift-logging/install
  - ../../../base/operators/openshift-logging/instances/default
  - operators-config.yaml

patches:
  - path: patches/gitops-ha-patches.yaml
  - path: patches/acm-patches.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/managed-by: multi-cluster-config
      app.kubernetes.io/part-of: platform-core

commonAnnotations:
  fleet.openshift.io/managed-by: gitops
  fleet.openshift.io/cluster-type: hub
