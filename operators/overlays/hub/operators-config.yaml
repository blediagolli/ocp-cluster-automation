# Informational: the operator set this cluster type is expected to run.
# kustomize does not filter on this — the resources list above is authoritative.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-operators-config
  namespace: openshift-gitops
data:
  cluster-type: hub
  enabled-operators: |
    - openshift-gitops
    - advanced-cluster-management
    - openshift-local-storage
    - odf-operator
    - external-secrets-operator
    - openshift-logging
