# Spoke ArgoCD: single replica, no HA. Usually only reconciles a bootstrap app.
apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: openshift-gitops
  namespace: openshift-gitops
spec:
  ha:
    enabled: false
  server:
    replicas: 1
  controller:
    replicas: 1
  repo:
    replicas: 1
  applicationSet:
    replicas: 1
