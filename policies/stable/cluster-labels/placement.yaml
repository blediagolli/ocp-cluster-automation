apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-cluster-labels
  namespace: ${POLICY_NAMESPACE}
spec:
  # local-cluster only, and that is the whole trick: ManagedCluster objects live
  # on the hub, so a policy placed on a spoke could not write them. local-cluster
  # is the hub, so the config policy controller running there reaches the hub API
  # with an ordinary lookup. ACM sets the local-cluster label itself.
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: local-cluster
              operator: In
              values: ["true"]
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
