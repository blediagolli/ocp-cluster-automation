# Attests the cluster-wide allowed registry list.
#
# Image/cluster is a cluster-scoped singleton, so no namespaceSelector.
#
# Same two-tier hub template as etcd-encryption, with one extra step: the value
# is a list, and a ConfigMap can only hold strings. It is stored as a JSON array
# in policy-values/global.env and toLiteral strips the surrounding quotes so it
# lands as a real YAML sequence rather than a string that looks like one.
#
# Written by: charts/platform-config/openshift-image.
apiVersion: config.openshift.io/v1
kind: Image
metadata:
  name: cluster
spec:
  registrySources:
    allowedRegistries: '{{hub dig "data" "allowedRegistries" ""
      (lookup "v1" "ConfigMap" "open-cluster-management-policies"
        (printf "policy-config-%s" .ManagedClusterName))
      | default (fromConfigMap "open-cluster-management-policies" "policy-config" "allowedRegistries")
      | toLiteral hub}}'
