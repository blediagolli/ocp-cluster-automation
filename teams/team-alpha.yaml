# Central team definition. Onboarding ApplicationSets deploy this team to every
# cluster that lists it in conf.yaml under 'teams'. Environment- and cluster-level
# overrides (env/<env>/teams/<team>.yaml, clusters/.../<team>.yaml) are optional.
team:
  name: team-alpha
  admins: team-alpha-admins
  repo: git@github.com:YOUR_ORG/team-alpha-apps.git
  namespaces:
    dev:
      - name: team-alpha-dev
        size: small
      - name: team-alpha-stage
        size: medium
    prod:
      - name: team-alpha-preprod
        size: large
      - name: team-alpha-prod
        size: large
