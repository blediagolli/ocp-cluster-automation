# Central team definition. Onboarding ApplicationSets deploy this team to every
# cluster that lists it in conf.yaml under 'teams'. Environment- and cluster-level
# overrides (env/<env>/teams/<team>.yaml, clusters/.../<team>.yaml) are optional.
team:
  name: team-alpha
  admins: team-alpha-admins
  readers: team-alpha-readers
  repo: git@github.com:YOUR_ORG/team-alpha-apps.git
  namespaces:
    # The management hub. This is the first cluster either onboarding chart has
    # ever run on, so the two namespaces are deliberately a matched pair: one
    # under full enforcement, one opted out of it, which is the only way to see
    # on a cluster that the switches do what the renders say they do.
    mgt:
      - name: team-alpha-mgt
        size: small
      # Opted out of both objects, the way a namespace being migrated in from
      # somewhere else arrives before its limits are agreed. Switching either
      # back on is a one-line change; switching one OFF on a namespace that
      # already has it DELETES the live object, since sync policy is prune.
      - name: team-alpha-mgt-legacy
        size: small
        resourceQuota: false
        limitRange: false
    dev:
      - name: team-alpha-dev
        size: small
      - name: team-alpha-stage
        size: medium
    prod:
      - name: team-alpha-preprod
        size: large
      - name: team-alpha-prod
        size: large
