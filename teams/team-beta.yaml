# Central team definition. Onboarding ApplicationSets deploy this team to every
# cluster that lists it in conf.yaml under 'teams'. Environment- and cluster-level
# overrides (env/<env>/teams/<team>.yaml, clusters/.../<team>.yaml) are optional.
team:
  name: team-beta
  admins: team-beta-admins
  repo: git@github.com:blediagolli/team-beta-apps.git
  namespaces:
    dev:
      - name: team-beta-dev
        size: small
      - name: team-beta-stage
        size: medium
    prod:
      - name: team-beta-preprod
        size: large
      - name: team-beta-prod
        size: large
