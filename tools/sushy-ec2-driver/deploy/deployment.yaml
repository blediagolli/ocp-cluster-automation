apiVersion: apps/v1
kind: Deployment
metadata:
  name: sushy-ec2-emulator
  labels:
    app: sushy-ec2-emulator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sushy-ec2-emulator
  template:
    metadata:
      labels:
        app: sushy-ec2-emulator
    spec:
      containers:
        - name: sushy-ec2
          image: sushy-ec2-emulator:latest
          ports:
            - containerPort: 8000
              name: redfish
          env:
            - name: AWS_REGION
              valueFrom:
                secretKeyRef:
                  name: sushy-ec2-aws-creds
                  key: region
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: sushy-ec2-aws-creds
                  key: aws_access_key_id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: sushy-ec2-aws-creds
                  key: aws_secret_access_key
            - name: SUSHY_EC2_S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: sushy-ec2-aws-creds
                  key: s3_bucket
            - name: SUSHY_EC2_CONFIG
              value: /config/instances.json
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: sushy-ec2-config
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: sushy-ec2-emulator
  labels:
    app: sushy-ec2-emulator
spec:
  ports:
    - port: 8000
      targetPort: 8000
      name: redfish
  selector:
    app: sushy-ec2-emulator
